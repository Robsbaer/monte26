            if (inside(levelRect(i))) { levelMenuOpen = false; startLevel(i); return; }
          }
          if (!inside({ x: 200, y: 65, w: 400, h: 120 + LEVELS.length * 62 })) levelMenuOpen = false;
          return;
        }
        if (won || player.hp <= 0) { nextAction(); return; }
        if (menuOpen) {
          // Im Menü: Zauber auswählen und Buch schließen, daneben tippen schließt das Buch
          for (let i = 0; i < spells.length; i++) {
            if (inside(spellRect(i))) { selectedSpell = spells[i]; menuOpen = false; return; }
          }
          if (!inside(BOOK)) menuOpen = false;
          return;
        }
        // Knöpfe auf dem Bildschirm (Handy): Zauberleiste, Zauberbuch, Level
        if (touchButtonAt(px, py)) return;
        // Außerhalb des Menüs: Gegner anklicken (Mausposition plus Kamera), Zauber wirken
        if (!selectedSpell) return;
        // Beschwörung braucht kein Ziel: der Lichtwolf erscheint neben dem Magier (höchstens 3 gleichzeitig)
        if (selectedSpell.name == "Beschwörungszauber") {
          if (allies.length >= 2) allies.shift();
          allies.push({ x: player.x + player.facing * 30, y: player.y, hp: 8, maxHp: 8, life: 420, facing: player.facing, moving: false, attacking: false, anim: 0, phase: random(100), puff: 20 });
          player.cast = 18;
          return;
        }
        // Sternenregen: auf einen Gegner oder irgendwohin. Danach muss er 15 Sekunden aufladen.
        if (selectedSpell === STERN) {
          if (player.starCd > 0) { puff(player.x, player.y - 60, [255, 230, 150], 0, "Sterne laden noch!"); return; }
          let target = mobAt(px, py, tol);
          let cx = target ? target.x : px + camX, cy = target ? target.y : py;
          for (let k = 0; k < 7; k++) {
            // Der erste Stern trifft genau die Mitte, die anderen landen ringsum
            let a = random(TWO_PI), r = k == 0 ? 0 : random(25, 85);
            let ox = cos(a) * r, oy = sin(a) * r * 0.6;
            stars.push({ target: target, ox: ox, oy: oy, tx: cx + ox, ty: cy + oy, delay: 10 + k * 7, t: 0, fall: 32 });
          }
          player.starCd = STERN_CD;
          player.cast = 30;
          if (target) player.facing = target.x < player.x ? -1 : 1;
          return;
        }
        // Schutzschild braucht auch kein Ziel, muss aber nach dem Benutzen erst aufladen
        if (selectedSpell === SCHILD) {
          if (player.shieldCd <= 0) { player.shield = 150; player.shieldCd = 600; player.cast = 18; }
          else puff(player.x, player.y - 60, [230, 200, 255], 0, "Schild lädt noch!");
          return;
        }
        let z = mobAt(px, py, tol);
        if (!z) return;
        // Schild des Schattenmagiers: der Zauber prallt zurück und trifft dich selbst
        if (z.shield > 0) {
          puff(z.x, z.y - 22, [220, 150, 255], 70);
          puff(z.x, z.y - 95, [255, 200, 255], 0, "Abgewehrt!");
          if (player.shield <= 0) { player.hp -= 6; puff(player.x, player.y - 8, [220, 120, 255], 40); }
          player.cast = 18;
          return;
        }
        if (selectedSpell.name == "Feuerzauber") z.burn = 300;
        if (selectedSpell.name == "Giftzauber") z.poison = 600;
        if (selectedSpell.name == "Eiszauber") z.freeze = MOBS[z.type].boss ? 90 : 240; // Boss friert nur kurz
        // Schwerkraft: ein Strudel an der Stelle des Gegners (2,5 Sekunden)
        if (selectedSpell.name == "Schwerkraftzauber") vortices.push({ x: z.x, y: z.y, life: 150 });
        if (selectedSpell.name == "Blitzzauber") {
          z.hp -= 30; // sofortiger Schaden
          bolts.push({ x: z.x, y: z.y, life: 14, seed: random(10) });
        }
        z.awake = true;
        // Nach einigen Treffern weicht der Schattenmagier per Teleport aus
        if (MOBS[z.type].wizard && ++z.hits >= 5) teleportWizard(z, z.hp < MOBS[z.type].hp * 0.5);
        player.cast = 18; // Zauber-Animation
        player.facing = z.x < player.x ? -1 : 1;
      }

      // Welcher Gegner liegt unter dem Punkt (Bildschirm-Koordinaten)? Bei mehreren der nächste.
      function mobAt(px, py, tol) {
        let best = null, bestD = Infinity;
        for (let z of zombies) {
          // Der Schattenmagier ist größer gezeichnet: Trefferfläche um seinen Körper
          let zy = MOBS[z.type].wizard ? z.y - 18 : z.y;
          let d = dist(px + camX, py, z.x, zy);
          if (d < (MOBS[z.type].hitR || 20) + tol && d < bestD) { best = z; bestD = d; }
        }
        return best;
      }

      function keyPressed() {
        // T öffnet und schließt das Level-Menü (das Zauberbuch schließt sich dabei)
        if (key === "t" || key === "T") { levelMenuOpen = !levelMenuOpen; menuOpen = false; return; }
        if (levelMenuOpen) return;
        if ((won || player.hp <= 0) && keyCode === ENTER) { nextAction(); return; }
        if (key === "b" || key === "B") menuOpen = !menuOpen;
      }

      // ---------- Steuerung mit dem Finger (Handy, Tablet) ----------
      // isTouch: wird ein Touchscreen benutzt? Dann zeigen wir Knöpfe auf dem Bildschirm.
      let isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      // Joystick: Finger irgendwo hinlegen und ziehen = laufen
      let joy = null;
      const JOY_R = 60;

      // Spielt man gerade (kein Menü, nicht gewonnen oder verloren)?
      function playing() { return !menuOpen && !levelMenuOpen && !won && player.hp > 0; }

      // Fingerposition in Spielfeld-Koordinaten (das Spielfeld ist auf dem Handy kleiner gezeichnet)
      function touchPos(t) {
        let r = document.querySelector("canvas").getBoundingClientRect();
        return { x: (t.clientX - r.left) * width / r.width, y: (t.clientY - r.top) * height / r.height };
      }

      // Die Knöpfe: Zauberleiste rechts, darüber Zauberbuch und Level
      function touchButtons() {
        let b = [];
        b.push({ x: width - 186, y: 32, w: 84, h: 30, label: "📖 Buch", act: () => { menuOpen = true; } });
        b.push({ x: width - 94, y: 32, w: 84, h: 30, label: "🗺️ Level", act: () => { levelMenuOpen = true; menuOpen = false; } });
        for (let i = 0; i < spells.length; i++) {
          let s = spells[i];
          b.push({ x: width - 56, y: 78 + i * 52, w: 46, h: 46, spell: s, act: () => { selectedSpell = s; } });
        }
        return b;
      }

      // Wurde ein Knopf angetippt? Dann ausführen.
      function touchButtonAt(px, py) {
        if (!isTouch) return false;
        for (let b of touchButtons()) {
          if (px > b.x - 6 && px < b.x + b.w + 6 && py > b.y - 4 && py < b.y + b.h + 4) { b.act(); return true; }
        }
        return false;
      }

      function touchStarted(e) {
        isTouch = true;
        if (!e || !e.changedTouches) return false;
        for (let t of e.changedTouches) {
          let p = touchPos(t);
          let onButton = touchButtons().some(b => p.x > b.x - 6 && p.x < b.x + b.w + 6 && p.y > b.y - 4 && p.y < b.y + b.h + 4);
          let onMob = selectedSpell && mobAt(p.x, p.y, 16);
          // Auf Knopf oder Gegner: antippen. Sonst wird der Finger zum Joystick.
          if (playing() && !joy && !onButton && !onMob) joy = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y, start: millis() };
          else handleClick(p.x, p.y, 16);
        }
        return false; // verhindert Scrollen, Zoomen und doppelte Mausklicks
      }

      function touchMoved(e) {
        if (!e || !e.changedTouches) return false;
        for (let t of e.changedTouches) {
          if (!joy || t.identifier !== joy.id) continue;
          let p = touchPos(t);
          joy.x = p.x; joy.y = p.y;
          // Zieht der Finger weit weg, wandert der Joystick mit
          let d = dist(joy.ox, joy.oy, p.x, p.y);
          if (d > JOY_R) { joy.ox = p.x - (p.x - joy.ox) / d * JOY_R; joy.oy = p.y - (p.y - joy.oy) / d * JOY_R; }
        }
        return false;
      }

      function touchEnded(e) {
        if (!e || !e.changedTouches) return false;
        for (let t of e.changedTouches) {
          if (!joy || t.identifier !== joy.id) continue;
          // Nur kurz getippt, nicht gezogen: zählt als Antippen (z.B. für Schutzschild oder Beschwörung)
          if (millis() - joy.start < 250 && dist(joy.ox, joy.oy, joy.x, joy.y) < 12) handleClick(joy.x, joy.y, 16);
          joy = null;
        }
        return false;
      }

      // Richtung des Joysticks: x und y zwischen -1 und 1
      function joyDir() {
        if (!joy) return { x: 0, y: 0 };
        let jx = joy.x - joy.ox, jy = joy.y - joy.oy, l = mag(jx, jy);
        if (l < 8) return { x: 0, y: 0 };
        let k = min(l, JOY_R) / JOY_R;
        return { x: jx / l * k, y: jy / l * k };
      }

      // Knöpfe und Joystick zeichnen (nur auf dem Handy)
      function drawTouchControls() {
        if (!isTouch || !playing()) return;
        textAlign(CENTER);
        for (let b of touchButtons()) {
          if (b.spell) {
            let s = b.spell, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
            fill(0, 150); stroke(s.color); strokeWeight(selectedSpell === s ? 4 : 1.5);
            circle(cx, cy, b.w);
            noStroke(); textSize(22); fill(255); text(s.icon, cx, cy + 8);
            // Schutzschild oder Sternenregen lädt: dunkler Schatten über dem Knopf
            let cd = s === SCHILD ? player.shieldCd / 600 : s === STERN ? player.starCd / STERN_CD : 0;
            if (cd > 0) { fill(0, 160); arc(cx, cy, b.w, b.w, -HALF_PI, -HALF_PI + TWO_PI * cd, PIE); }
          } else {
            fill(0, 150); stroke(200); strokeWeight(1); rect(b.x, b.y, b.w, b.h, 8);
            noStroke(); fill(255); textSize(14); text(b.label, b.x + b.w / 2, b.y + 20);
          }
        }
        textAlign(LEFT);
        // Joystick unter dem Finger
        if (joy) {
          let d = joyDir();
          fill(255, 255, 255, 40); stroke(255, 255, 255, 120); strokeWeight(2); circle(joy.ox, joy.oy, JOY_R * 2);
          noStroke(); fill(255, 255, 255, 150); circle(joy.ox + d.x * JOY_R, joy.oy + d.y * JOY_R, 44);
        } else if (bannerTimer > 0) {
          // Am Levelanfang: Hinweis, wie man läuft
          fill(255, 255, 255, 30); stroke(255, 255, 255, 90); strokeWeight(2); circle(110, 470, JOY_R * 2);
          noStroke(); fill(255, 255, 255, 90); circle(110, 470, 44);
          fill(255, 200); textAlign(CENTER); textSize(13); text("Finger ziehen = laufen", 110, 555); textAlign(LEFT);
        }
      }
    </script>
  </body>
</html>
