function drawDuneLayer(parallax, baseY, amp, wavelength, color, seed) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-20, VIEW_H);
    for (let sx = -20; sx <= VIEW_W + 20; sx += 16) {
        const wx = sx + cameraX * parallax;
        const dy = baseY + Math.sin(wx / wavelength + seed) * amp + Math.sin(wx / (wavelength * 0.37) + seed * 2) * amp * 0.35;
        ctx.lineTo(sx, dy);
    }
    ctx.lineTo(VIEW_W + 20, VIEW_H);
    ctx.closePath(); ctx.fill();
}

function drawSaguaro(x, baseY, scale) {
    ctx.fillStyle = "#3f8f48"; ctx.strokeStyle = "#1d5a27"; ctx.lineWidth = 2;
    const part = (px, py, pw, ph) => { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, pw / 2); ctx.fill(); ctx.stroke(); };
    part(x - 8 * scale, baseY - 90 * scale, 16 * scale, 90 * scale);
    part(x - 28 * scale, baseY - 62 * scale, 13 * scale, 34 * scale);
    part(x - 28 * scale, baseY - 36 * scale, 28 * scale, 12 * scale);
    part(x + 15 * scale, baseY - 72 * scale, 13 * scale, 40 * scale);
    part(x + 4 * scale, baseY - 44 * scale, 24 * scale, 12 * scale);
    ctx.strokeStyle = "rgba(20,70,30,0.55)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, baseY - 84 * scale); ctx.lineTo(x, baseY - 4 * scale); ctx.stroke();
}

function drawBackgroundDesert() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, "#ff9f4a");
    sky.addColorStop(0.55, "#ffd48a");
    sky.addColorStop(1, "#fff0c4");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    const sunX = 560 - cameraX * 0.02, sunY = 120;
    const glow = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 170);
    glow.addColorStop(0, "rgba(255,246,190,0.95)");
    glow.addColorStop(1, "rgba(255,200,100,0)");
    ctx.fillStyle = glow; ctx.fillRect(sunX - 180, sunY - 180, 360, 360);
    ctx.fillStyle = "#fff6c0"; ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI * 2); ctx.fill();

    drawDuneLayer(0.08, 300, 14, 90, "#f2c27b", 1);

    for (let i = -1; i < 2; i++) {
        const index = i + Math.floor((cameraX * 0.14) / 900);
        const x = index * 900 - cameraX * 0.14 + 450;
        const size = 90 + pseudoRandom(index + 6) * 40;
        ctx.fillStyle = "#e0a85e";
        ctx.beginPath(); ctx.moveTo(x - size, 318); ctx.lineTo(x, 318 - size * 0.9); ctx.lineTo(x + size, 318); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#b9803c";
        ctx.beginPath(); ctx.moveTo(x, 318 - size * 0.9); ctx.lineTo(x + size, 318); ctx.lineTo(x + size * 0.15, 318); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#e0a85e";
        ctx.beginPath(); ctx.moveTo(x + size * 1.5, 318); ctx.lineTo(x + size * 1.9, 318 - size * 0.42); ctx.lineTo(x + size * 2.3, 318); ctx.closePath(); ctx.fill();
    }

    drawDuneLayer(0.22, 322, 18, 120, "#e8b569", 3);
    drawDuneLayer(0.4, 345, 14, 150, "#dca255", 5);

    for (let i = -1; i < 4; i++) {
        const index = i + Math.floor((cameraX * 0.55) / 330);
        const x = index * 330 - cameraX * 0.55 + 100;
        if (pseudoRandom(index + 12) > 0.35) drawSaguaro(x, GROUND_Y, 0.7 + pseudoRandom(index + 3) * 0.5);
    }

    // Steppenläufer rollt vorbei
    const rollX = wrap(animTick * 1.6 - cameraX * 0.7, VIEW_W + 120) - 60;
    ctx.save();
    ctx.translate(rollX, GROUND_Y - 14);
    ctx.rotate(animTick / 9);
    ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 1.5;
    for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.arc(0, 0, 6 + k * 1.3, k, k + 4); ctx.stroke(); }
    ctx.restore();

    // Geier kreisen
    ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
        const a = animTick / 160 + i * 2.1;
        const x = 250 + i * 160 + Math.cos(a) * 60 - cameraX * 0.05;
        const y = 70 + i * 22 + Math.sin(a) * 14;
        const flap = Math.sin(animTick / 20 + i) * 2;
        ctx.beginPath(); ctx.moveTo(x - 10, y + flap); ctx.quadraticCurveTo(x - 4, y - 5, x, y); ctx.quadraticCurveTo(x + 4, y - 5, x + 10, y + flap); ctx.stroke();
    }
}

// ---------- Fantasy-Welt ----------
function drawFantasyGem(coin) {
    const y = coin.y + Math.sin(animTick / 18 + coin.x) * 3;
    const glow = ctx.createRadialGradient(coin.x, y, 2, coin.x, y, 17);
    glow.addColorStop(0, "rgba(167,243,208,0.8)");
    glow.addColorStop(1, "rgba(167,243,208,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(coin.x, y, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#34d399"; ctx.strokeStyle = "#047857"; ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; ctx.lineTo(coin.x + Math.cos(a) * 9, y + Math.sin(a) * 11); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#6ee7b7";
    ctx.beginPath(); ctx.moveTo(coin.x, y - 11); ctx.lineTo(coin.x + 8, y - 5); ctx.lineTo(coin.x, y); ctx.lineTo(coin.x - 8, y - 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillRect(coin.x - 4, y - 6, 2, 4);
    if (Math.floor(animTick / 20 + coin.x) % 3 === 0) { ctx.fillRect(coin.x + 8, y - 12, 1.5, 6); ctx.fillRect(coin.x + 5.8, y - 9.8, 6, 1.5); }
}

function drawFantasyCastle(x, baseY) {
    ctx.fillStyle = "#3a2166";
    ctx.fillRect(x - 30, baseY - 90, 60, 90);
    for (const [dx, h] of [[-52, 120], [-52 + 0, 0], [40, 105]]) {
        if (!h) continue;
        ctx.fillRect(x + dx, baseY - h, 26, h);
        ctx.beginPath(); ctx.moveTo(x + dx - 4, baseY - h); ctx.lineTo(x + dx + 13, baseY - h - 40); ctx.lineTo(x + dx + 30, baseY - h); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(x - 34, baseY - 90); ctx.lineTo(x, baseY - 150); ctx.lineTo(x + 34, baseY - 90); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffe08a";
    for (const [wx, wy] of [[-6, -70], [-6, -45], [-44, -100], [50, -85]]) ctx.fillRect(x + wx, baseY + wy, 8, 12);
    ctx.fillStyle = "#f472b6"; ctx.fillRect(x - 1, baseY - 158, 2, 10);
    ctx.beginPath(); ctx.moveTo(x + 1, baseY - 158); ctx.lineTo(x + 14 + Math.sin(animTick / 12) * 2, baseY - 154); ctx.lineTo(x + 1, baseY - 150); ctx.fill();
}

function drawFloatingIsland(x, y, scale, seed) {
    ctx.fillStyle = "#5b3b8c";
    ctx.beginPath(); ctx.moveTo(x - 50 * scale, y); ctx.lineTo(x + 50 * scale, y); ctx.lineTo(x + 8 * scale, y + 55 * scale); ctx.lineTo(x - 8 * scale, y + 48 * scale); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4fd18b";
    ctx.beginPath(); ctx.ellipse(x, y, 50 * scale, 10 * scale, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#8b5a2b"; ctx.fillRect(x - 2 * scale, y - 28 * scale, 4 * scale, 22 * scale);
    ctx.fillStyle = "#f9a8d4";
    ctx.beginPath(); ctx.arc(x, y - 34 * scale, 14 * scale, 0, Math.PI * 2); ctx.arc(x - 10 * scale, y - 28 * scale, 9 * scale, 0, Math.PI * 2); ctx.arc(x + 10 * scale, y - 28 * scale, 9 * scale, 0, Math.PI * 2); ctx.fill();
    // Wasserfall
    ctx.strokeStyle = "rgba(186,230,253,0.85)"; ctx.lineWidth = 3 * scale;
    ctx.setLineDash([6, 5]); ctx.lineDashOffset = -animTick * 0.6 - seed;
    ctx.beginPath(); ctx.moveTo(x + 24 * scale, y + 6 * scale); ctx.lineTo(x + 24 * scale, y + 150); ctx.stroke();
    ctx.setLineDash([]);
}

function drawGlowMushroom(x, baseY, scale, hue) {
    const glow = ctx.createRadialGradient(x, baseY - 30 * scale, 2, x, baseY - 30 * scale, 50 * scale);
    glow.addColorStop(0, "hsla(" + hue + ",90%,70%,0.45)");
    glow.addColorStop(1, "hsla(" + hue + ",90%,70%,0)");
    ctx.fillStyle = glow; ctx.fillRect(x - 55 * scale, baseY - 90 * scale, 110 * scale, 100 * scale);
    ctx.fillStyle = "#f5ecd7"; ctx.fillRect(x - 6 * scale, baseY - 30 * scale, 12 * scale, 30 * scale);
    ctx.fillStyle = "hsl(" + hue + ",80%,62%)";
    ctx.beginPath(); ctx.ellipse(x, baseY - 30 * scale, 28 * scale, 22 * scale, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for (const [dx, dy, r] of [[-12, -38, 4], [4, -46, 5], [14, -36, 3.5]]) { ctx.beginPath(); ctx.arc(x + dx * scale, baseY + dy * scale, r * scale, 0, Math.PI * 2); ctx.fill(); }
}

function drawBackgroundFantasy() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, "#1c1250");
    sky.addColorStop(0.55, "#8a46c9");
    sky.addColorStop(1, "#ffb3d1");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    for (let i = 0; i < 45; i++) {
        ctx.fillStyle = "rgba(255,255,255," + (0.35 + 0.4 * Math.abs(Math.sin(animTick / 40 + i))) + ")";
        ctx.fillRect(wrap(pseudoRandom(i + 3) * VIEW_W - cameraX * 0.02, VIEW_W), pseudoRandom(i + 70) * 190, 2, 2);
    }
    // zwei Monde
    const moonX = 600 - cameraX * 0.03;
    ctx.fillStyle = "#fff4c8"; ctx.beginPath(); ctx.arc(moonX, 85, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(200,170,120,0.35)"; ctx.beginPath(); ctx.arc(moonX - 9, 78, 7, 0, Math.PI * 2); ctx.arc(moonX + 10, 95, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c4e4ff"; ctx.beginPath(); ctx.arc(moonX - 90, 140, 14, 0, Math.PI * 2); ctx.fill();

    drawDuneLayer(0.1, 318, 16, 130, "#3b2b78", 4);
    for (let i = -1; i < 2; i++) {
        const index = i + Math.floor((cameraX * 0.15) / 1100);
        drawFantasyCastle(index * 1100 - cameraX * 0.15 + 600, 322);
    }
    for (let i = -1; i < 3; i++) {
        const index = i + Math.floor((cameraX * 0.3) / 520);
        drawFloatingIsland(index * 520 - cameraX * 0.3 + 260, 120 + pseudoRandom(index + 8) * 70 + Math.sin(animTick / 60 + index) * 4, 0.8 + pseudoRandom(index + 2) * 0.4, index * 13);
    }
    drawDuneLayer(0.35, 340, 14, 120, "#2d2362", 2);

    for (let i = -1; i < 5; i++) {
        const index = i + Math.floor((cameraX * 0.55) / 260);
        const x = index * 260 - cameraX * 0.55 + 80;
        if (index % 3 === 0) {
            const sc = 0.8 + pseudoRandom(index + 5) * 0.5;
            ctx.fillStyle = "#67e8f9";
            ctx.beginPath(); ctx.moveTo(x - 10 * sc, GROUND_Y); ctx.lineTo(x - 4 * sc, GROUND_Y - 55 * sc); ctx.lineTo(x + 3 * sc, GROUND_Y - 80 * sc); ctx.lineTo(x + 12 * sc, GROUND_Y - 40 * sc); ctx.lineTo(x + 14 * sc, GROUND_Y); ctx.closePath(); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fillRect(x - 3 * sc, GROUND_Y - 60 * sc, 2 * sc, 40 * sc);
        } else {
            drawGlowMushroom(x, GROUND_Y, 0.8 + pseudoRandom(index + 9) * 0.5, index % 2 ? 320 : 170);
        }
    }

    // Drache fliegt vorbei
    const dx = wrap(animTick * 1.1 - cameraX * 0.1 + 100, VIEW_W + 260) - 130, dy = 70 + Math.sin(animTick / 50) * 14;
    const wing = Math.sin(animTick / 6) * 10;
    ctx.fillStyle = "#1a0f3d";
    ctx.beginPath(); ctx.ellipse(dx, dy, 20, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(dx - 4, dy); ctx.lineTo(dx - 20, dy - 18 - wing); ctx.lineTo(dx + 8, dy - 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(dx - 20, dy + 2); ctx.quadraticCurveTo(dx - 38, dy + 8, dx - 44, dy - 4); ctx.lineTo(dx - 38, dy + 12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(dx + 22, dy - 3, 6, 0, Math.PI * 2); ctx.fill();

    // Glühwürmchen und Feenstaub
    for (let i = 0; i < 40; i++) {
        const x = wrap(pseudoRandom(i + 200) * VIEW_W - cameraX * 0.4 + Math.sin(animTick / 50 + i) * 18, VIEW_W);
        const y = 120 + pseudoRandom(i + 250) * 260 + Math.cos(animTick / 45 + i) * 12;
        ctx.fillStyle = "rgba(" + (i % 2 ? "253,240,120" : "190,255,200") + "," + (0.35 + 0.6 * Math.abs(Math.sin(animTick / 20 + i))) + ")";
        ctx.beginPath(); ctx.arc(x, y, 1.8, 0, Math.PI * 2); ctx.fill();
    }
}

function drawBackground() {
    if (saveData.background === "underwater") drawBackgroundUnderwater();
    else if (saveData.background === "candy") drawBackgroundCandy();
    else if (saveData.background === "halloween") drawBackgroundHalloween();
    else if (saveData.background === "donut") drawBackgroundDonut();
    else if (saveData.background === "3d") drawBackground3D();
    else if (saveData.background === "christmas") drawBackgroundChristmas();
    else if (saveData.background === "comic") drawBackgroundComic();
    else if (saveData.background === "jjk") drawBackgroundJujutsu();
    else if (saveData.background === "ship") drawBackgroundShip();
    else if (saveData.background === "winter") drawBackgroundWinter();
    else if (saveData.background === "desert") drawBackgroundDesert();
    else if (saveData.background === "fantasy") drawBackgroundFantasy();
    else drawBackgroundDay();
}

function drawBackgroundDay() {
    const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    sky.addColorStop(0, "#4a86f5");
    sky.addColorStop(1, "#b8dcff");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.fillStyle = "#7fd36b";
    for (let i = -1; i < 8; i++) {
        const x = i * 220 - (cameraX * 0.3) % 220;
        ctx.beginPath();
        ctx.ellipse(x + 110, GROUND_Y, 130, 80 + (i % 3) * 15, 0, Math.PI, 0);
        ctx.fill();
    }

    ctx.fillStyle = "rgba(255,255,255,0.95)";
    for (let i = -1; i < 6; i++) {
        const x = i * 260 - (cameraX * 0.5) % 260 + 60;
        const y = 60 + (i * 47 % 90);
        [[0, 0, 28], [30, -8, 34], [64, 0, 26]].forEach(([dx, dy, r]) => {
            ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2); ctx.fill();
        });
    }
}

function drawGround(solid) {
    const jjk = saveData.background === "jjk";
    const ship = saveData.background === "ship";
    const winter = saveData.background === "winter";
    const desert = saveData.background === "desert";
    const fantasy = saveData.background === "fantasy";
    ctx.fillStyle = jjk ? "#241547" : ship ? "#a0642c" : winter ? "#6f8fb0" : desert ? "#e0b060" : fantasy ? "#3b2a4f" : "#c8742c";
    ctx.fillRect(solid.x, solid.y, solid.w, solid.h);
    ctx.fillStyle = jjk ? "#150b30" : ship ? "#5e3510" : winter ? "#557596" : desert ? "#c4904a" : fantasy ? "#2a1c3a" : "#a35a1c";
    for (let bx = solid.x + 10; bx < solid.x + solid.w; bx += 48) {
        for (let by = solid.y + 22; by < solid.y + solid.h; by += 24) ctx.fillRect(bx, by, 22, 4);
    }
    const topColors = { christmas: ["#f4f9ff", "#cfe0f2"], donut: ["#ff8cc6", "#e0569b"], halloween: ["#6d28d9", "#4c1d95"], candy: ["#7ee8c9", "#3cc7a2"], underwater: ["#f2d49b", "#d9b26f"], comic: ["#ffd21f", "#e0a800"], jjk: ["#7c4dff", "#4527a0"], ship: ["#d9a066", "#8a5a2b"], winter: ["#ffffff", "#cfe3f5"], desert: ["#f2d28b", "#d9b36a"], fantasy: ["#7be08a", "#3fb36b"] }[saveData.background] ?? ["#3fbf3f", "#2c9a2c"];
    ctx.fillStyle = topColors[0];
    ctx.fillRect(solid.x, solid.y, solid.w, 12);
    ctx.fillStyle = topColors[1];
    ctx.fillRect(solid.x, solid.y + 12, solid.w, 4);
}

const pipePalettes = {
    candy: { body: "#ff6fb5", light: "#ffc2e2", dark: "#c2347f", rim: "#ff4fa3", outline: "#7a1a4c" },
    fantasy: { body: "#7c5cd6", light: "#d4c8ff", dark: "#4b2fa0", rim: "#9b7cf0", outline: "#241058" },
    desert: { body: "#4aa04f", light: "#9be39b", dark: "#2a6a30", rim: "#58b85d", outline: "#14401a" },
    winter: { body: "#7ec8f0", light: "#e3f6ff", dark: "#4a93c4", rim: "#9ed8f7", outline: "#1d4e75" },
    ship: { body: "#a0642c", light: "#d9a066", dark: "#6b3d14", rim: "#8a5a2b", outline: "#3b2008" },
    jjk: { body: "#2a1a4a", light: "#8b6ff0", dark: "#150c2a", rim: "#3b2470", outline: "#05030f" },
    comic: { body: "#ff5a36", light: "#ffc0ad", dark: "#c4300f", rim: "#ff7a52", outline: "#000000" },
    underwater: { body: "#2f7de1", light: "#8ec5ff", dark: "#1b4f9c", rim: "#3b8cf0", outline: "#0c2f66" }
};
const greenPipePalette = { body: "#1f9d2a", light: "#6be26b", dark: "#0d6a17", rim: "#26b832", outline: "#093d0e" };

function drawPipe(solid, side) {
    const palette = pipePalettes[saveData.background] ?? greenPipePalette;
    const rimH = 26;
    const rimY = side === "ground" ? solid.y : solid.y + solid.h - rimH;
    const bodyY = side === "ground" ? solid.y + rimH : solid.y;
    const bodyH = solid.h - rimH;

    ctx.fillStyle = palette.body;
    ctx.fillRect(solid.x + 4, bodyY, PIPE_W - 8, bodyH);
    ctx.fillStyle = palette.light;
    ctx.fillRect(solid.x + 10, bodyY, 8, bodyH);
    ctx.fillStyle = palette.dark;
    ctx.fillRect(solid.x + PIPE_W - 16, bodyY, 12, bodyH);

    ctx.fillStyle = palette.rim;
    ctx.fillRect(solid.x - 4, rimY, PIPE_W + 8, rimH);
    ctx.fillStyle = palette.light;
    ctx.fillRect(solid.x + 2, rimY, 8, rimH);
    ctx.fillStyle = palette.dark;
    ctx.fillRect(solid.x + PIPE_W - 10, rimY, 14, rimH);
    ctx.strokeStyle = palette.outline;
    ctx.lineWidth = 2;
    ctx.strokeRect(solid.x - 4, rimY, PIPE_W + 8, rimH);
    ctx.strokeRect(solid.x + 4, bodyY, PIPE_W - 8, bodyH);
    if (saveData.background === "halloween") drawPipeDecor(solid, side);
    if (saveData.background === "fantasy") {
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        for (let sy = bodyY + 10; sy < bodyY + bodyH - 6; sy += 18) {
            ctx.beginPath(); ctx.moveTo(solid.x + 30, sy); ctx.lineTo(solid.x + 34, sy + 4); ctx.lineTo(solid.x + 30, sy + 8); ctx.lineTo(solid.x + 26, sy + 4); ctx.closePath(); ctx.fill();
        }
    }
    if (saveData.background === "desert") {
        ctx.fillStyle = "#f4f8d0";
        for (let sy = bodyY + 8; sy < bodyY + bodyH - 4; sy += 14) { ctx.fillRect(solid.x + 6, sy, 3, 2); ctx.fillRect(solid.x + PIPE_W - 14, sy + 6, 3, 2); ctx.fillRect(solid.x + 28, sy + 3, 3, 2); }
        ctx.fillRect(solid.x - 1, rimY + 8, 3, 2); ctx.fillRect(solid.x + PIPE_W - 3, rimY + 14, 3, 2);
    }
    if (saveData.background === "candy") drawPipeStripes(solid, rimY, bodyY, bodyH, rimH);
}

function drawPipeStripes(solid, rimY, bodyY, bodyH, rimH) {
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    for (let stripeY = bodyY + 8; stripeY < bodyY + bodyH - 4; stripeY += 18) ctx.fillRect(solid.x + 4, stripeY, PIPE_W - 8, 6);
    ctx.fillRect(solid.x - 4, rimY + rimH / 2 - 3, PIPE_W + 8, 6);
}

const brickStyles = {
    day:        { fill: "#d9822b", line: "#6e3a0c" },
    "3d":       { fill: "#a78bfa", line: "#4c1d95" },
    christmas:  { fill: "#b5651d", line: "#5a2f0a" },
    donut:      { fill: "#f8c9a0", line: "#a8632f" },
    halloween:  { fill: "#6b7280", line: "#1f2937" },
    candy:      { fill: "#7b3f1d", line: "#3b1a08" },
    underwater: { fill: "#f4a8a0", line: "#b4534b" },
    comic:      { fill: "#ff5a36", line: "#000000" },
    jjk:        { fill: "#241547", line: "#a78bfa" },
    ship:       { fill: "#a0642c", line: "#3b2008" },
    winter:     { fill: "#a5d8f5", line: "#3f86b8" },

function drawBrick(solid) {
    const world = saveData.background;
    const style = brickStyles[world] ?? brickStyles.day;
    const { x, y, w, h } = solid;
    ctx.fillStyle = style.fill;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = style.line;
    ctx.lineWidth = world === "comic" ? 4 : 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

    if (world === "ship") {
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x + w, y + 12); ctx.moveTo(x, y + 24); ctx.lineTo(x + w, y + 24); ctx.stroke();
        ctx.fillStyle = "#d9d9d9";
        for (const [dx, dy] of [[5, 6], [w - 5, 6], [5, 30], [w - 5, 30]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, 1.5, 0, Math.PI * 2); ctx.fill(); }
        return;
    }
    if (world === "candy") {
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(x + 4, y + 4, w / 2 - 6, h / 2 - 6);
        return;
    }
    if (world === "christmas") {
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath(); ctx.moveTo(x + 4, y + 10);
        for (let zx = x + 10; zx < x + w - 2; zx += 6) ctx.lineTo(zx, y + (Math.round((zx - x) / 6) % 2 ? 6 : 12));
        ctx.stroke();
        ctx.fillStyle = "#e11d48"; ctx.beginPath(); ctx.arc(x + 11, y + 24, 2.5, 0, Math.PI * 2); ctx.arc(x + 25, y + 24, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.lineCap = "butt"; ctx.lineJoin = "miter";
        return;
    }
    if (world === "donut") {
        ctx.fillStyle = "#ff6fb5";
        ctx.beginPath(); ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + w - 2, y + 2); ctx.lineTo(x + w - 2, y + 12);
        for (let dx = w - 2; dx > 2; dx -= 8) ctx.quadraticCurveTo(x + dx - 4, y + 20, x + dx - 8, y + 12);
        ctx.lineTo(x + 2, y + 12); ctx.closePath(); ctx.fill();
        for (const [dx, c] of [[8, "#facc15"], [18, "#38bdf8"], [28, "#4ade80"]]) { ctx.fillStyle = c; ctx.fillRect(x + dx, y + 5, 4, 2); }
        return;
    }
    if (world === "halloween") {
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.moveTo(x + w / 3, y); ctx.lineTo(x + w / 3, y + h / 2); ctx.moveTo(x + 2 * w / 3, y + h / 2); ctx.lineTo(x + 2 * w / 3, y + h); ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + 16, y + 16); ctx.moveTo(x + 2, y + 10); ctx.lineTo(x + 10, y + 14); ctx.moveTo(x + 10, y + 2); ctx.lineTo(x + 14, y + 10); ctx.stroke();
        return;
    }
    if (world === "underwater") {
        ctx.fillStyle = "#e0736a";
        for (const [dx, dy, r] of [[9, 10, 4], [24, 22, 5], [11, 28, 3]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.arc(x + 27, y + 9, 2, 0, Math.PI * 2); ctx.fill();
        return;
    }
    if (world === "comic") {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        for (let hy = 7; hy < h - 4; hy += 9) for (let hx = 7 + (hy % 18 ? 4 : 0); hx < w - 4; hx += 9) { ctx.beginPath(); ctx.arc(x + hx, y + hy, 1.8, 0, Math.PI * 2); ctx.fill(); }
        return;
    }
    if (world === "jjk") {
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(167,139,250," + (0.55 + Math.sin(animTick / 20 + x) * 0.3) + ")";
        ctx.beginPath(); ctx.moveTo(x + 6, y + 4); ctx.lineTo(x + 14, y + 14); ctx.lineTo(x + 10, y + 22); ctx.lineTo(x + 22, y + 30); ctx.stroke();
        return;
    }
    if (world === "winter") {
        ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fillRect(x + 5, y + 8, 4, h - 18);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.ellipse(x + w / 2, y + 1, w / 2 + 2, 6, 0, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 7, y + 2, 4, 0, Math.PI * 2); ctx.arc(x + w - 8, y + 2, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 3, y + h - 2); ctx.lineTo(x + 6, y + h + 7); ctx.lineTo(x + 9, y + h - 2); ctx.moveTo(x + w - 11, y + h - 2); ctx.lineTo(x + w - 8, y + h + 5); ctx.lineTo(x + w - 5, y + h - 2); ctx.fillStyle = "#d6efff"; ctx.fill();
        return;
    }
    if (world === "fantasy") {
        ctx.fillStyle = "#4fae5f";
        ctx.beginPath(); ctx.moveTo(x + 1, y + 1); ctx.lineTo(x + w - 1, y + 1); ctx.lineTo(x + w - 1, y + 6);
        for (let mx = w - 4; mx > 4; mx -= 7) ctx.quadraticCurveTo(x + mx - 3, y + 13, x + mx - 7, y + 6);
        ctx.lineTo(x + 1, y + 6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "rgba(125,211,252," + (0.5 + Math.sin(animTick / 20 + x) * 0.3) + ")"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x + 24, y + 20); ctx.lineTo(x + 28, y + 24); ctx.lineTo(x + 24, y + 28); ctx.moveTo(x + 8, y + 22); ctx.lineTo(x + 14, y + 22); ctx.stroke();
    }
    if (world === "3d") {
        ctx.fillStyle = "#c4b5fd";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6, y - 5); ctx.lineTo(x + w + 6, y - 5); ctx.lineTo(x + w, y); ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
    ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h / 2);
    ctx.stroke();
}

function drawBubble(coin) {
    const wobble = Math.sin(animTick / 10 + coin.x) * 1.2;
    const radiusX = 13 + wobble;
    const radiusY = 13 - wobble;
    const centerY = coin.y + Math.sin(animTick / 25 + coin.x) * 3;
    const hue = wrap(coin.x * 1.3 + coin.y * 2, 360);
    const fill = ctx.createRadialGradient(coin.x - 4, centerY - 5, 1, coin.x, centerY, 15);
    fill.addColorStop(0, "rgba(255,255,255,0.85)");
    fill.addColorStop(0.55, "hsla(" + hue + ",90%,65%,0.4)");
    fill.addColorStop(0.85, "hsla(" + (hue + 60) + ",90%,60%,0.5)");
    fill.addColorStop(1, "hsla(" + hue + ",95%,55%,0.85)");
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(coin.x, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "hsla(" + hue + ",100%,85%,0.9)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.ellipse(coin.x - 5, centerY - 6, 4, 2.5, -0.7, 0, Math.PI * 2);
    ctx.fill();
}

function drawCoin(coin) {
    if (saveData.background === "underwater") {
        drawStarfish(coin.x, coin.y + Math.sin(animTick / 25 + coin.x) * 3, 13, Math.sin(animTick / 40 + coin.x) * 0.5);
        return;
    }
    if (saveData.background === "candy") {
        drawLollipop(coin.x, coin.y - 4 + Math.sin(animTick / 20 + coin.x) * 3, 10, wrap(coin.x * 0.9, 360), animTick / 25, 16);
        return;
    }
    if (saveData.background === "halloween") { drawPumpkin(coin.x, coin.y + Math.sin(animTick / 20 + coin.x) * 3, 11); return; }
    if (saveData.background === "donut") {
        drawDonut(coin.x, coin.y + Math.sin(animTick / 20 + coin.x) * 3, 12, donutIcing(Math.floor(coin.x / 9)), animTick / 50 + coin.x);
        return;
    }
    if (saveData.background === "3d") { drawBubble(coin); return; }
    if (saveData.background === "ship") { drawBerry(coin); return; }
    if (saveData.background === "winter") { drawSnowflakeCoin(coin); return; }
    if (saveData.background === "desert") { drawDesertCoin(coin); return; }
    if (saveData.background === "fantasy") { drawFantasyGem(coin); return; }
    if (saveData.background === "jjk") { drawCursedOrb(coin.x, coin.y + Math.sin(animTick / 18 + coin.x) * 3); return; }
    if (saveData.background === "comic") { drawComicStar(coin.x, coin.y + Math.sin(animTick / 15 + coin.x) * 3, 13, animTick / 60 + coin.x); return; }
    const squeeze = Math.abs(Math.cos(stateTimer / 12 + coin.x));
    ctx.fillStyle = "#ffd21f";
    ctx.strokeStyle = "#b8860b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(coin.x, coin.y, 9 * Math.max(squeeze, 0.2), 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (saveData.background === "christmas") drawCoinChristmas(coin, Math.max(squeeze, 0.5));
}

function drawCoinChristmas(coin, widthFactor) {
    const half = 9 * widthFactor;
    const scarfY = coin.y + 6;
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i % 2 ? "#ffffff" : "#d62828";
        ctx.fillRect(coin.x - half + i * (half / 2), scarfY, half / 2, 4);
    }
    ctx.fillStyle = "#d62828";
    ctx.fillRect(coin.x + half * 0.3, scarfY + 4, 4, 7);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(coin.x + half * 0.3, scarfY + 8, 4, 3);

    ctx.fillStyle = "#d62828";
    ctx.beginPath();
    ctx.moveTo(coin.x - half, coin.y - 8);
    ctx.quadraticCurveTo(coin.x - half * 0.3, coin.y - 24, coin.x + half + 2, coin.y - 15);
    ctx.lineTo(coin.x + half, coin.y - 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(coin.x - half - 1, coin.y - 11, half * 2 + 2, 4);
    ctx.beginPath();
    ctx.arc(coin.x + half + 2, coin.y - 15, 3, 0, Math.PI * 2);
    ctx.fill();
}

const luckyStyles = {
    day:        { fill: "#ffb400", border: "#a86a00", mark: "#ffffff", used: ["#9a6a35", "#4a2e12", "#2e1c0a"] },

function drawLucky(block) {
    const world = saveData.background;
    const style = luckyStyles[world] ?? luckyStyles.day;
    const { x, y, w, h } = block;
    const [usedFill, usedBorder, hollow] = style.used;
    ctx.fillStyle = block.used ? usedFill : style.fill;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = block.used ? usedBorder : style.border;
    ctx.lineWidth = world === "comic" ? 4 : 3;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
    if (block.used) {
        // geöffnet: dunkle Höhle statt Fragezeichen
        ctx.fillStyle = hollow;
        ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(x + 8, y + 8, w - 16, 4);
        if (world === "halloween") {
            ctx.fillStyle = "#ffb347";
            ctx.beginPath(); ctx.moveTo(x + 11, y + 14); ctx.lineTo(x + 16, y + 14); ctx.lineTo(x + 13.5, y + 19); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + 20, y + 14); ctx.lineTo(x + 25, y + 14); ctx.lineTo(x + 22.5, y + 19); ctx.fill();
            ctx.fillRect(x + 12, y + 23, 12, 2);
        } else if (world === "christmas") {
            ctx.fillStyle = "#facc15";
            ctx.beginPath(); ctx.ellipse(x + w / 2 - 5, y + 5, 5, 3.5, -0.4, 0, Math.PI * 2); ctx.ellipse(x + w / 2 + 5, y + 5, 5, 3.5, 0.4, 0, Math.PI * 2); ctx.fill();
        } else if (world === "winter") {
            ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 12, y + 14); ctx.lineTo(x + 8, y + 22); ctx.moveTo(x + w - 5, y + 6); ctx.lineTo(x + w - 14, y + 18); ctx.stroke();
        } else if (world === "comic") {
            ctx.fillStyle = "#000"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText("...", x + w / 2, y + 24);
        } else if (world === "jjk") {
            ctx.strokeStyle = "rgba(167,139,250,0.35)"; ctx.lineWidth = 1.5; ctx.strokeRect(x + 6, y + 6, w - 12, h - 12);
        } else if (world === "underwater") {
            ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.arc(x + 14, y + 22, 2, 0, Math.PI * 2); ctx.arc(x + 22, y + 15, 1.5, 0, Math.PI * 2); ctx.fill();
        } else if (world === "donut") {
            ctx.fillStyle = "#fff"; ctx.fillRect(x + 12, y + 22, 3, 2); ctx.fillStyle = "#ff6fb5"; ctx.fillRect(x + 20, y + 18, 3, 2);
        } else if (world === "ship") {
            ctx.strokeStyle = usedBorder; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(x, y + 24); ctx.lineTo(x + 8, y + 24); ctx.moveTo(x + w - 8, y + 24); ctx.lineTo(x + w, y + 24); ctx.stroke();
        }
        return;
    }

    if (world === "christmas") {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(x + w / 2 - 3, y, 6, h); ctx.fillRect(x, y + h / 2 - 3, w, 6);
    } else if (world === "ship") {
        ctx.strokeStyle = style.border; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x + w, y + 12); ctx.moveTo(x, y + 24); ctx.lineTo(x + w, y + 24); ctx.stroke();
    } else if (world === "comic") {
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        for (const [dx, dy] of [[6, 6], [14, 6], [10, 11]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, 1.8, 0, Math.PI * 2); ctx.fill(); }
    } else if (world === "jjk") {
        ctx.strokeStyle = "rgba(196,181,253," + (0.4 + Math.sin(animTick / 15 + x) * 0.3) + ")";
        ctx.lineWidth = 2; ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    } else if (world === "halloween") {
        ctx.fillStyle = "#4a7c2a"; ctx.fillRect(x + w / 2 - 2, y - 4, 4, 5);
    } else if (world === "candy") {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        for (let sx = x + 4; sx < x + w - 6; sx += 10) ctx.fillRect(sx, y + 3, 5, 3);
    } else if (world === "underwater") {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.beginPath(); ctx.arc(x + 7, y + 28, 2.5, 0, Math.PI * 2); ctx.arc(x + 29, y + 8, 2, 0, Math.PI * 2); ctx.fill();
    } else if (world === "donut") {
        ctx.fillStyle = "#fff";
        for (const [dx, dy, c] of [[6, 5, "#facc15"], [28, 7, "#38bdf8"], [9, 30, "#4ade80"]]) { ctx.fillStyle = c; ctx.fillRect(x + dx, y + dy, 5, 2); }
    } else if (world === "3d") {
        ctx.fillStyle = "#c4b5fd";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6, y - 5); ctx.lineTo(x + w + 6, y - 5); ctx.lineTo(x + w, y); ctx.fill();
    } else if (world === "fantasy") {
        ctx.fillStyle = "#facc15";
        for (const [dx, dy] of [[4, 4], [w - 9, 4], [4, h - 9], [w - 9, h - 9]]) { ctx.beginPath(); ctx.moveTo(x + dx + 2.5, y + dy); ctx.lineTo(x + dx + 5, y + dy + 2.5); ctx.lineTo(x + dx + 2.5, y + dy + 5); ctx.lineTo(x + dx, y + dy + 2.5); ctx.closePath(); ctx.fill(); }
        ctx.strokeStyle = "rgba(253,230,138," + (0.35 + Math.sin(animTick / 12 + x) * 0.25) + ")"; ctx.lineWidth = 2;
        ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    } else if (world === "desert") {
        ctx.fillStyle = "#c98a2c";
        for (const [dx, dy] of [[4, 4], [w - 9, 4], [4, h - 9], [w - 9, h - 9]]) ctx.fillRect(x + dx, y + dy, 5, 5);
        ctx.fillStyle = "#22d3ee";
        ctx.beginPath(); ctx.arc(x + w / 2, y + 6, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (world === "winter") {
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.fillRect(x + 4, y + 4, 4, h - 12);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.ellipse(x + w / 2, y + 1, w / 2 + 2, 6, 0, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 6, y + 2, 4, 0, Math.PI * 2); ctx.arc(x + w - 7, y + 2, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = style.mark;
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "center";
    ctx.fillText("?", x + w / 2, y + 28);
}

function drawItem(item) {
    const type = itemTypes[item.type];
    const y = item.y + Math.sin(stateTimer / 8) * 3;
    ctx.fillStyle = type.color;
    ctx.beginPath();
    ctx.arc(item.x, y, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(type.icon, item.x, y + 1);
    ctx.textBaseline = "alphabetic";
}

function drawDonut(centerX, centerY, radius, icing = "#ff6fa8", angle = 0) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(angle);
    ctx.fillStyle = "#d9964a";
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.moveTo(radius * 0.3, 0);
    ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    ctx.fillStyle = icing;
    ctx.beginPath();
    ctx.arc(0, 0, radius - radius * 0.18, 0, Math.PI * 2);
    ctx.moveTo(radius * 0.38, 0);
    ctx.arc(0, 0, radius * 0.38, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    const sprinkle = Math.max(2, radius * 0.22);
    ["#fff", "#ffd21f", "#4dd2ff", "#7cff7c"].forEach((color, i) => {
        ctx.fillStyle = color;
        const sprinkleAngle = i * 1.6 + 0.4;
        ctx.fillRect(Math.cos(sprinkleAngle) * radius * 0.68 - sprinkle / 2, Math.sin(sprinkleAngle) * radius * 0.68, sprinkle, sprinkle / 2);
    });
    ctx.restore();
}

function drawDiverMario() {
    const { x, y, w, h, facing } = player;
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillStyle = "#ff9f1c";
    ctx.fillRect(x - 2 + (facing < 0 ? -3 : 0), y + h - 5, 15, 5 - walk);
    ctx.fillRect(x + w - 13 + (facing > 0 ? 3 : 0), y + h - 5, 15, 2 + walk);
    ctx.fillStyle = "#0e7490";
    ctx.fillRect(x + 3, y + 22, w - 6, 14);
    ctx.fillStyle = "#22d3ee";
    ctx.fillRect(x + 1, y + 16, w - 2, 10);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 1, y + 24, w - 2, 2);
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(x + 3, y + 3, w - 6, 16);
    ctx.fillStyle = "#0b3b52";
    ctx.fillRect(x + 1, y, w - 2, 5);
    ctx.fillStyle = "#e8321e";
    ctx.fillRect(x + 1, y + 4, w - 2, 3);
    const lensX = facing > 0 ? x + w - 13 : x + 1;
    ctx.fillStyle = "#bff3ff";
    ctx.fillRect(lensX, y + 5, 12, 8);
    ctx.strokeStyle = "#0b3b52";
    ctx.lineWidth = 2;
    ctx.strokeRect(lensX, y + 5, 12, 8);
    ctx.fillStyle = "black";
    ctx.fillRect(lensX + (facing > 0 ? 7 : 3), y + 7, 3, 4);
    ctx.fillStyle = "#4a2a0a";
    ctx.fillRect(x + (facing > 0 ? 8 : 4), y + 14, w - 12, 3);
    ctx.strokeStyle = "#ffb703";
    ctx.lineWidth = 3;
    const tubeX = facing > 0 ? x + 2 : x + w - 2;
    ctx.beginPath(); ctx.moveTo(tubeX, y + 2); ctx.lineTo(tubeX - facing * 3, y - 14); ctx.lineTo(tubeX - facing * 8, y - 14); ctx.stroke();
}

function drawOrbitFish() {
    const centerX = player.x + player.w / 2;
    const centerY = player.y + player.h / 2;
    for (let i = 0; i < 4; i++) {
        const angle = animTick / 22 + i * Math.PI / 2;
        drawFish(centerX + Math.cos(angle) * 42, centerY + Math.sin(angle) * 34, 6, -Math.sin(angle) >= 0 ? 1 : -1, 20 + i * 70);
    }
}

function drawGhostCostume() {
    const { x, y, w, h, facing } = player;
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillStyle = "#6b3a1a";
    ctx.fillRect(x + 2, y + h - 5, 10, 5 - walk);
    ctx.fillRect(x + w - 12, y + h - 5, 10, 2 + walk);
    ctx.fillStyle = "#f4f1ff";
    ctx.beginPath();
    ctx.moveTo(x - 3, y + h - 4);
    ctx.lineTo(x - 3, y + 12);
    ctx.quadraticCurveTo(x - 3, y - 4, x + w / 2, y - 4);
    ctx.quadraticCurveTo(x + w + 3, y - 4, x + w + 3, y + 12);
    ctx.lineTo(x + w + 3, y + h - 4);
    const waves = 4;
    const waveWidth = (w + 6) / waves;
    for (let i = 0; i < waves; i++) {
        const waveX = x + w + 3 - i * waveWidth;
        ctx.quadraticCurveTo(waveX - waveWidth / 2, y + h + 3 + (i % 2) * 2 + walk * 0.3, waveX - waveWidth, y + h - 4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#b8b0d8";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#ece6fb";
    ctx.fillRect(facing > 0 ? x - 3 : x + w - 3, y + 14, 6, h - 22);
    ctx.fillStyle = "#1a0b2e";
    const eyeShift = facing * 3;
    ctx.beginPath(); ctx.ellipse(x + w / 2 - 5 + eyeShift, y + 10, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + 5 + eyeShift, y + 10, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + eyeShift, y + 20, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
}

        ctx.fillText(label, button.x + button.w / 2, button.y + 22);

    ctx.font = "14px Arial";

}

function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-Math.round(cameraX), 0);

    drawFlag();
    solids.forEach(solid => {
        if (solid.x + solid.w + 10 < cameraX || solid.x - 10 > cameraX + VIEW_W) return;
        if (solid.kind === "ground") drawGround(solid);
        else if (solid.kind === "brick") drawBrick(solid);
        else if (solid.kind === "lucky") drawLucky(solid);
        else drawPipe(solid, solid.kind === "pipe-ceiling" ? "ceiling" : "ground");
    });
    coins.filter(coin => !coin.taken).forEach(drawCoin);
    items.filter(item => !item.taken).forEach(drawItem);
    enemies.forEach(enemy => { if (enemy.x + enemy.w > cameraX - 20 && enemy.x < cameraX + VIEW_W + 20) drawEnemy(enemy); });
    drawEffects();
    drawPlayer();

    ctx.restore();
    if (saveData.background === "winter") drawForegroundSnow();
    drawHud();
    drawShopButton();
    drawLevelButton();
    if (shopOpen) drawShop();
    if (levelMenuOpen) drawLevelMenu();
    if (resetDialogOpen) drawResetDialog();
    if (toast.timer > 0 && shopOpen) {
        ctx.textAlign = "center";
        ctx.font = "bold 24px Arial";
        ctx.fillStyle = "#c2410c";
        ctx.fillText(toast.text, VIEW_W / 2, shopPanel.y + shopPanel.h - 40);
    }
    if (state === "over") drawOverlay("Game Over 😢", "Alle Leben verbraucht", "Enter = Level " + currentLevel + " nochmal");
    if (state === "win") drawOverlay("Level " + currentLevel + " geschafft! 🎉", "+" + WIN_BONUS + " Münzen Belohnung", "Enter = Level " + (currentLevel + 1));
}

// ---------- Schleife (feste 60 Schritte pro Sekunde) ----------
let lastTime = performance.now();
let accumulator = 0;
function frame(now) {
    accumulator += Math.min(now - lastTime, 100);
    lastTime = now;
    while (accumulator >= 1000 / 60) { update(); accumulator -= 1000 / 60; }
    if (state !== "play") stateTimer++;
    animTick++;
    music.setWorld(saveData.background);
    draw();
    requestAnimationFrame(frame);
}

        let degree = 2;
        for (let i = 0; i < 64; i++) {
            if (i % 16 === 0) degree = 2;
            const rest = random() < 0.28 && i % 4 !== 0;
            degree = Math.max(0, Math.min(def.scale.length * 2 - 1, degree + Math.round((random() - 0.5) * 4)));
            melody.push(rest ? null : degree);
        }
        return { def, melody, chordRoots };
    }
    function midiToHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function scaleNote(def, degree) {
        const n = def.scale.length;
        return def.root + def.scale[degree % n] + 12 * Math.floor(degree / n);
    }
    function tone(type, hz, time, length, volume) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + length);
        osc.connect(gain).connect(master);
        osc.start(time);
        osc.stop(time + length + 0.05);
    }
    function schedule() {
        if (!audio || !plan) return;
        const { def, melody, chordRoots } = plan;
        const stepLength = 60 / def.bpm / 2;
        while (nextTime < audio.currentTime + 0.3) {
            const i = step % 64;
            const swung = nextTime + (i % 2 === 1 ? stepLength * def.swing : 0);
            const note = melody[i];
            if (note !== null) tone(def.lead, midiToHz(scaleNote(def, note) + 12), swung, stepLength * 1.6, 0.07);
            if (i % 4 === 0) {
                const chord = chordRoots[Math.floor(i / 16) % chordRoots.length];
                tone(def.bass, midiToHz(def.root - 24 + chord), nextTime, stepLength * 3.6, 0.16);
            }
            if (i % 8 === 4) tone(def.bass, midiToHz(def.root - 12 + def.scale[2]), nextTime, stepLength * 1.5, 0.05);
            nextTime += stepLength;
            step++;
        }
    }
    const api = {
        get muted() { return muted; },
        unlock() {
            if (!audio) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                audio = new Ctx();
                master = audio.createGain();
                master.gain.value = muted ? 0 : 0.6;
                master.connect(audio.destination);
                setInterval(schedule, 100);
                if (worldId) api.setWorld(worldId, true);
            }
            if (audio.state === "suspended") audio.resume();
        },
        setWorld(id, force) {
            if (id === worldId && !force) return;
            worldId = id;
            if (!audio) return;
            plan = buildPlan(id);
            step = 0;
            nextTime = audio.currentTime + 0.1;
        },
        toggleMute() {
            muted = !muted;
            try { localStorage.setItem("jumpandrun-muted", muted ? "1" : "0"); } catch { /* egal */ }
            if (master) master.gain.value = muted ? 0 : 0.6;
        }
    };
    return api;
})();
window.addEventListener("pointerdown", () => music.unlock());

// ---------- Touch-Steuerung ----------
document.querySelectorAll("#touch button[data-key]").forEach(button => {
    const key = button.dataset.key;
    const press = event => { event.preventDefault(); button.setPointerCapture?.(event.pointerId); keys[key] = true; button.classList.add("on"); music.unlock(); };
    const release = () => { keys[key] = false; button.classList.remove("on"); };
    button.addEventListener("pointerdown", press);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
    button.addEventListener("contextmenu", event => event.preventDefault());
});
document.getElementById("resetButton").addEventListener("click", () => {
    if (state === "play" && !shopOpen) { resetDialogOpen = true; keys = {}; }
});
document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });

setInterval(persist, 1000);
window.addEventListener("beforeunload", persist);
newGame(saveData.level);
requestAnimationFrame(frame);
</script>
