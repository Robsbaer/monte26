        ctx.fillRect(x - 120, 30, 240, 8);
        const sway = Math.sin(animTick / 40 + index) * 6;
        ctx.fillStyle = "#fffaf0"; ctx.strokeStyle = "#b9a98a"; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - 115, 38); ctx.lineTo(x + 115, 38);
        ctx.quadraticCurveTo(x + 125 + sway, 130, x + 110, 225);
        ctx.quadraticCurveTo(x + sway * 1.5, 245, x - 110, 225);
        ctx.quadraticCurveTo(x - 125 + sway, 130, x - 115, 38);
        ctx.fill(); ctx.stroke();
        drawJollyRoger(x + sway * 0.5, 85);
        ctx.fillStyle = "#d62828";
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 36 + sway, 8); ctx.lineTo(x, 18); ctx.fill();
    }

    // Möwen
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
        const x = wrap(i * 230 + animTick * (0.4 + i * 0.1) - cameraX * 0.15, VIEW_W + 60) - 30;
        const y = 110 + i * 22 + Math.sin(animTick / 20 + i) * 6;
        const flap = Math.sin(animTick / 8 + i) * 4;
        ctx.beginPath(); ctx.moveTo(x - 8, y - flap); ctx.quadraticCurveTo(x - 3, y - 6, x, y); ctx.quadraticCurveTo(x + 3, y - 6, x + 8, y - flap); ctx.stroke();
    }
}

function drawBackground() {
    if (saveData.background === "underwater") drawBackgroundUnderwater();
    else if (saveData.background === "candy") drawBackgroundCandy();
    else if (saveData.background === "halloween") drawBackgroundHalloween();
    else if (saveData.background === "donut") drawBackgroundDonut();
    else if (saveData.background === "3d") drawBackground3D();
    else if (saveData.background === "christmas") drawBackgroundChristmas();
    else if (saveData.background === "comic") drawBackgroundComic();
    else if (saveData.background === "jjk") drawBackgroundJujutsu();
    else if (saveData.background === "ship") drawBackgroundShip();
    else drawBackgroundDay();
}

function drawBackgroundDay() {
    const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    sky.addColorStop(0, "#4a86f5");
    sky.addColorStop(1, "#b8dcff");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    ctx.fillStyle = "#7fd36b";
    for (let i = -1; i < 8; i++) {
        const x = i * 220 - (cameraX * 0.3) % 220;
        ctx.beginPath();
        ctx.ellipse(x + 110, GROUND_Y, 130, 80 + (i % 3) * 15, 0, Math.PI, 0);
        ctx.fill();
    }

    ctx.fillStyle = "rgba(255,255,255,0.95)";
    for (let i = -1; i < 6; i++) {
        const x = i * 260 - (cameraX * 0.5) % 260 + 60;
        const y = 60 + (i * 47 % 90);
        [[0, 0, 28], [30, -8, 34], [64, 0, 26]].forEach(([dx, dy, r]) => {
            ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2); ctx.fill();
        });
    }
}

function drawGround(solid) {
    const jjk = saveData.background === "jjk";
    const ship = saveData.background === "ship";
    ctx.fillStyle = jjk ? "#241547" : ship ? "#a0642c" : "#c8742c";
    ctx.fillRect(solid.x, solid.y, solid.w, solid.h);
    ctx.fillStyle = jjk ? "#150b30" : ship ? "#5e3510" : "#a35a1c";
    for (let bx = solid.x + 10; bx < solid.x + solid.w; bx += 48) {
        for (let by = solid.y + 22; by < solid.y + solid.h; by += 24) ctx.fillRect(bx, by, 22, 4);
    }
    const topColors = { christmas: ["#f4f9ff", "#cfe0f2"], donut: ["#ff8cc6", "#e0569b"], halloween: ["#6d28d9", "#4c1d95"], candy: ["#7ee8c9", "#3cc7a2"], underwater: ["#f2d49b", "#d9b26f"], comic: ["#ffd21f", "#e0a800"], jjk: ["#7c4dff", "#4527a0"], ship: ["#d9a066", "#8a5a2b"] }[saveData.background] ?? ["#3fbf3f", "#2c9a2c"];
    ctx.fillStyle = topColors[0];
    ctx.fillRect(solid.x, solid.y, solid.w, 12);
    ctx.fillStyle = topColors[1];
    ctx.fillRect(solid.x, solid.y + 12, solid.w, 4);
}

const pipePalettes = {
    candy: { body: "#ff6fb5", light: "#ffc2e2", dark: "#c2347f", rim: "#ff4fa3", outline: "#7a1a4c" },
    ship: { body: "#a0642c", light: "#d9a066", dark: "#6b3d14", rim: "#8a5a2b", outline: "#3b2008" },
    jjk: { body: "#2a1a4a", light: "#8b6ff0", dark: "#150c2a", rim: "#3b2470", outline: "#05030f" },
    comic: { body: "#ff5a36", light: "#ffc0ad", dark: "#c4300f", rim: "#ff7a52", outline: "#000000" },
    underwater: { body: "#2f7de1", light: "#8ec5ff", dark: "#1b4f9c", rim: "#3b8cf0", outline: "#0c2f66" }
};
const greenPipePalette = { body: "#1f9d2a", light: "#6be26b", dark: "#0d6a17", rim: "#26b832", outline: "#093d0e" };

function drawPipe(solid, side) {
    const palette = pipePalettes[saveData.background] ?? greenPipePalette;
    const rimH = 26;
    const rimY = side === "ground" ? solid.y : solid.y + solid.h - rimH;
    const bodyY = side === "ground" ? solid.y + rimH : solid.y;
    const bodyH = solid.h - rimH;

    ctx.fillStyle = palette.body;
    ctx.fillRect(solid.x + 4, bodyY, PIPE_W - 8, bodyH);
    ctx.fillStyle = palette.light;
    ctx.fillRect(solid.x + 10, bodyY, 8, bodyH);
    ctx.fillStyle = palette.dark;
    ctx.fillRect(solid.x + PIPE_W - 16, bodyY, 12, bodyH);

    ctx.fillStyle = palette.rim;
    ctx.fillRect(solid.x - 4, rimY, PIPE_W + 8, rimH);
    ctx.fillStyle = palette.light;
    ctx.fillRect(solid.x + 2, rimY, 8, rimH);
    ctx.fillStyle = palette.dark;
    ctx.fillRect(solid.x + PIPE_W - 10, rimY, 14, rimH);
    ctx.strokeStyle = palette.outline;
    ctx.lineWidth = 2;
    ctx.strokeRect(solid.x - 4, rimY, PIPE_W + 8, rimH);
    ctx.strokeRect(solid.x + 4, bodyY, PIPE_W - 8, bodyH);
    if (saveData.background === "halloween") drawPipeDecor(solid, side);
    if (saveData.background === "candy") drawPipeStripes(solid, rimY, bodyY, bodyH, rimH);
}

function drawPipeStripes(solid, rimY, bodyY, bodyH, rimH) {
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    for (let stripeY = bodyY + 8; stripeY < bodyY + bodyH - 4; stripeY += 18) ctx.fillRect(solid.x + 4, stripeY, PIPE_W - 8, 6);
    ctx.fillRect(solid.x - 4, rimY + rimH / 2 - 3, PIPE_W + 8, 6);
}

function drawBrick(solid) {
    ctx.fillStyle = "#d9822b";
    ctx.fillRect(solid.x, solid.y, solid.w, solid.h);
    ctx.strokeStyle = "#6e3a0c";
    ctx.lineWidth = 2;
    ctx.strokeRect(solid.x + 1, solid.y + 1, solid.w - 2, solid.h - 2);
    ctx.beginPath();
    ctx.moveTo(solid.x, solid.y + solid.h / 2); ctx.lineTo(solid.x + solid.w, solid.y + solid.h / 2);
    ctx.moveTo(solid.x + solid.w / 2, solid.y); ctx.lineTo(solid.x + solid.w / 2, solid.y + solid.h / 2);
    ctx.stroke();
}

function drawBubble(coin) {
    const wobble = Math.sin(animTick / 10 + coin.x) * 1.2;
    const radiusX = 13 + wobble;
    const radiusY = 13 - wobble;
    const centerY = coin.y + Math.sin(animTick / 25 + coin.x) * 3;
    const hue = wrap(coin.x * 1.3 + coin.y * 2, 360);
    const fill = ctx.createRadialGradient(coin.x - 4, centerY - 5, 1, coin.x, centerY, 15);
    fill.addColorStop(0, "rgba(255,255,255,0.85)");
    fill.addColorStop(0.55, "hsla(" + hue + ",90%,65%,0.4)");
    fill.addColorStop(0.85, "hsla(" + (hue + 60) + ",90%,60%,0.5)");
    fill.addColorStop(1, "hsla(" + hue + ",95%,55%,0.85)");
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(coin.x, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "hsla(" + hue + ",100%,85%,0.9)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.ellipse(coin.x - 5, centerY - 6, 4, 2.5, -0.7, 0, Math.PI * 2);
    ctx.fill();
}

function drawCoin(coin) {
    if (saveData.background === "underwater") {
        drawStarfish(coin.x, coin.y + Math.sin(animTick / 25 + coin.x) * 3, 13, Math.sin(animTick / 40 + coin.x) * 0.5);
        return;
    }
    if (saveData.background === "candy") {
        drawLollipop(coin.x, coin.y - 4 + Math.sin(animTick / 20 + coin.x) * 3, 10, wrap(coin.x * 0.9, 360), animTick / 25, 16);
        return;
    }
    if (saveData.background === "halloween") { drawPumpkin(coin.x, coin.y + Math.sin(animTick / 20 + coin.x) * 3, 11); return; }
    if (saveData.background === "donut") {
        drawDonut(coin.x, coin.y + Math.sin(animTick / 20 + coin.x) * 3, 12, donutIcing(Math.floor(coin.x / 9)), animTick / 50 + coin.x);
        return;
    }
    if (saveData.background === "3d") { drawBubble(coin); return; }
    if (saveData.background === "ship") { drawBerry(coin); return; }
    if (saveData.background === "jjk") { drawCursedOrb(coin.x, coin.y + Math.sin(animTick / 18 + coin.x) * 3); return; }
    if (saveData.background === "comic") { drawComicStar(coin.x, coin.y + Math.sin(animTick / 15 + coin.x) * 3, 13, animTick / 60 + coin.x); return; }
    const squeeze = Math.abs(Math.cos(stateTimer / 12 + coin.x));
    ctx.fillStyle = "#ffd21f";
    ctx.strokeStyle = "#b8860b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(coin.x, coin.y, 9 * Math.max(squeeze, 0.2), 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (saveData.background === "christmas") drawCoinChristmas(coin, Math.max(squeeze, 0.5));
}

function drawCoinChristmas(coin, widthFactor) {
    const half = 9 * widthFactor;
    const scarfY = coin.y + 6;
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i % 2 ? "#ffffff" : "#d62828";
        ctx.fillRect(coin.x - half + i * (half / 2), scarfY, half / 2, 4);
    }
    ctx.fillStyle = "#d62828";
    ctx.fillRect(coin.x + half * 0.3, scarfY + 4, 4, 7);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(coin.x + half * 0.3, scarfY + 8, 4, 3);

    ctx.fillStyle = "#d62828";
    ctx.beginPath();
    ctx.moveTo(coin.x - half, coin.y - 8);
    ctx.quadraticCurveTo(coin.x - half * 0.3, coin.y - 24, coin.x + half + 2, coin.y - 15);
    ctx.lineTo(coin.x + half, coin.y - 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(coin.x - half - 1, coin.y - 11, half * 2 + 2, 4);
    ctx.beginPath();
    ctx.arc(coin.x + half + 2, coin.y - 15, 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawLucky(block) {
    ctx.fillStyle = block.used ? "#8a7a68" : "#ffb400";
    ctx.fillRect(block.x, block.y, block.w, block.h);
    ctx.strokeStyle = block.used ? "#5a4c3c" : "#a86a00";
    ctx.lineWidth = 3;
    ctx.strokeRect(block.x + 1.5, block.y + 1.5, block.w - 3, block.h - 3);
    if (block.used) return;
    ctx.fillStyle = "white";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "center";
    ctx.fillText("?", block.x + block.w / 2, block.y + 28);
}

function drawItem(item) {
    const type = itemTypes[item.type];
    const y = item.y + Math.sin(stateTimer / 8) * 3;
    ctx.fillStyle = type.color;
    ctx.beginPath();
    ctx.arc(item.x, y, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(type.icon, item.x, y + 1);
    ctx.textBaseline = "alphabetic";
}

function drawDonut(centerX, centerY, radius, icing = "#ff6fa8", angle = 0) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(angle);
    ctx.fillStyle = "#d9964a";
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.moveTo(radius * 0.3, 0);
    ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    ctx.fillStyle = icing;
    ctx.beginPath();
    ctx.arc(0, 0, radius - radius * 0.18, 0, Math.PI * 2);
    ctx.moveTo(radius * 0.38, 0);
    ctx.arc(0, 0, radius * 0.38, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    const sprinkle = Math.max(2, radius * 0.22);
    ["#fff", "#ffd21f", "#4dd2ff", "#7cff7c"].forEach((color, i) => {
        ctx.fillStyle = color;
        const sprinkleAngle = i * 1.6 + 0.4;
        ctx.fillRect(Math.cos(sprinkleAngle) * radius * 0.68 - sprinkle / 2, Math.sin(sprinkleAngle) * radius * 0.68, sprinkle, sprinkle / 2);
    });
    ctx.restore();
}

function drawDiverMario() {
    const { x, y, w, h, facing } = player;
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillStyle = "#ff9f1c";
    ctx.fillRect(x - 2 + (facing < 0 ? -3 : 0), y + h - 5, 15, 5 - walk);
    ctx.fillRect(x + w - 13 + (facing > 0 ? 3 : 0), y + h - 5, 15, 2 + walk);
    ctx.fillStyle = "#0e7490";
    ctx.fillRect(x + 3, y + 22, w - 6, 14);
    ctx.fillStyle = "#22d3ee";
    ctx.fillRect(x + 1, y + 16, w - 2, 10);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 1, y + 24, w - 2, 2);
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(x + 3, y + 3, w - 6, 16);
    ctx.fillStyle = "#0b3b52";
    ctx.fillRect(x + 1, y, w - 2, 5);
    ctx.fillStyle = "#e8321e";
    ctx.fillRect(x + 1, y + 4, w - 2, 3);
    const lensX = facing > 0 ? x + w - 13 : x + 1;
    ctx.fillStyle = "#bff3ff";
    ctx.fillRect(lensX, y + 5, 12, 8);
    ctx.strokeStyle = "#0b3b52";
    ctx.lineWidth = 2;
    ctx.strokeRect(lensX, y + 5, 12, 8);
    ctx.fillStyle = "black";
    ctx.fillRect(lensX + (facing > 0 ? 7 : 3), y + 7, 3, 4);
    ctx.fillStyle = "#4a2a0a";
    ctx.fillRect(x + (facing > 0 ? 8 : 4), y + 14, w - 12, 3);
    ctx.strokeStyle = "#ffb703";
    ctx.lineWidth = 3;
    const tubeX = facing > 0 ? x + 2 : x + w - 2;
    ctx.beginPath(); ctx.moveTo(tubeX, y + 2); ctx.lineTo(tubeX - facing * 3, y - 14); ctx.lineTo(tubeX - facing * 8, y - 14); ctx.stroke();
}

function drawOrbitFish() {
    const centerX = player.x + player.w / 2;
    const centerY = player.y + player.h / 2;
    for (let i = 0; i < 4; i++) {
        const angle = animTick / 22 + i * Math.PI / 2;
        drawFish(centerX + Math.cos(angle) * 42, centerY + Math.sin(angle) * 34, 6, -Math.sin(angle) >= 0 ? 1 : -1, 20 + i * 70);
    }
}

function drawGhostCostume() {
    const { x, y, w, h, facing } = player;
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillStyle = "#6b3a1a";
    ctx.fillRect(x + 2, y + h - 5, 10, 5 - walk);
    ctx.fillRect(x + w - 12, y + h - 5, 10, 2 + walk);
    ctx.fillStyle = "#f4f1ff";
    ctx.beginPath();
    ctx.moveTo(x - 3, y + h - 4);
    ctx.lineTo(x - 3, y + 12);
    ctx.quadraticCurveTo(x - 3, y - 4, x + w / 2, y - 4);
    ctx.quadraticCurveTo(x + w + 3, y - 4, x + w + 3, y + 12);
    ctx.lineTo(x + w + 3, y + h - 4);
    const waves = 4;
    const waveWidth = (w + 6) / waves;
    for (let i = 0; i < waves; i++) {
        const waveX = x + w + 3 - i * waveWidth;
        ctx.quadraticCurveTo(waveX - waveWidth / 2, y + h + 3 + (i % 2) * 2 + walk * 0.3, waveX - waveWidth, y + h - 4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#b8b0d8";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#ece6fb";
    ctx.fillRect(facing > 0 ? x - 3 : x + w - 3, y + 14, 6, h - 22);
    ctx.fillStyle = "#1a0b2e";
    const eyeShift = facing * 3;
    ctx.beginPath(); ctx.ellipse(x + w / 2 - 5 + eyeShift, y + 10, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + 5 + eyeShift, y + 10, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + eyeShift, y + 20, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
}

function drawCandyWorker() {
    const { x, y, w, facing } = player;
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillStyle = "#2b4fd6";
    ctx.fillRect(x + 3, y + 26, w - 6, 9);
    ctx.fillStyle = "#6b3a1a";
    ctx.fillRect(x + 1, y + 34, 11, 6 - walk);
    ctx.fillRect(x + w - 12, y + 34, 11, 3 + walk);
    for (let stripe = 0; stripe < 6; stripe++) {
        ctx.fillStyle = stripe % 2 ? "#ff5fa8" : "#ffffff";
        ctx.fillRect(x + 1, y + 16 + stripe * 3.5, w - 2, 3.5);
    }
    ctx.fillStyle = "#ff8cc6";
    ctx.fillRect(x + 5, y + 22, w - 10, 13);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 8, y + 25, 6, 4);
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(x + 3, y + 4, w - 6, 13);
    ctx.fillStyle = "black";
    ctx.fillRect(x + (facing > 0 ? w - 10 : 6), y + 8, 3, 4);
    ctx.fillStyle = "#4a2a0a";
    ctx.fillRect(x + (facing > 0 ? 8 : 4), y + 13, w - 12, 3);
    for (let stripe = 0; stripe < 4; stripe++) {
        ctx.fillStyle = stripe % 2 ? "#ffffff" : "#ff5fa8";
        ctx.fillRect(x + 1 + stripe * ((w - 2) / 4), y - 2, (w - 2) / 4, 7);
    }
    ctx.fillStyle = "#ff5fa8";
    ctx.fillRect(facing > 0 ? x + 8 : x - 4, y + 4, w - 4, 3);
    drawLollipop(x + w / 2 + facing * 14, y + 20, 7, 320, stateTimer / 20, 14);
}

function drawDonutSeller() {
    const { x, y, w, facing } = player;
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillStyle = "#5a3a22";
    ctx.fillRect(x + 2, y + 33, 10, 7 - walk);
    ctx.fillRect(x + w - 12, y + 33, 10, 4 + walk);
    ctx.fillStyle = "#ff7eb6";
    ctx.fillRect(x + 1, y + 16, w - 2, 19);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 5, y + 20, w - 10, 15);
    ctx.fillStyle = "#ff7eb6";
    ctx.fillRect(x + 5, y + 26, w - 10, 2);
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(x + 3, y + 4, w - 6, 13);
    ctx.fillStyle = "black";
    ctx.fillRect(x + (facing > 0 ? w - 10 : 6), y + 8, 3, 4);
    ctx.fillStyle = "#4a2a0a";
    ctx.fillRect(x + 5, y + 13, w - 10, 3);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 2, y - 3, w - 4, 8);
    [[x + 6, y - 5, 6], [x + w / 2, y - 9, 7], [x + w - 6, y - 5, 6]].forEach(([centerX, centerY, radius]) => {
        ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.fill();
    });
    ctx.strokeStyle = "#d9dde6";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 2, y - 3, w - 4, 8);
    drawDonut(x + w / 2 + facing * 11, y + 27, 8);
}

function drawPlayer() {
    if (player.invulnerable > 0 && Math.floor(player.invulnerable / 5) % 2) return;
    const { x, y, w, h, facing } = player;
    if (player.shield) {
        ctx.strokeStyle = "rgba(37,99,235,0.8)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, 30, 0, Math.PI * 2);
        ctx.stroke();
    }
    if (saveData.skin === "donut") { drawDonutSeller(); return; }
    if (saveData.skin === "candy") { drawCandyWorker(); return; }
    if (saveData.skin === "ghost") { drawGhostCostume(); return; }
    if (saveData.skin === "water") { drawDiverMario(); drawOrbitFish(); return; }
    if (saveData.skin === "comic") { drawComicMario(); return; }
    if (saveData.skin === "yuji") { drawYuji(); return; }
    if (saveData.skin === "gojo") { drawGojo(); return; }
    if (saveData.skin === "luffy") { drawLuffyGear5(); return; }
    if (saveData.skin === "chopper") { drawChopper(); return; }
    ctx.fillStyle = "#2b4fd6";
    ctx.fillRect(x + 3, y + 22, w - 6, 14);
    ctx.fillStyle = "#e8321e";
    ctx.fillRect(x + 1, y + 16, w - 2, 10);
    ctx.fillStyle = "#6b3a1a";
    const walk = player.onGround && player.vx !== 0 ? Math.floor(stateTimer / 5) % 2 * 3 : 0;
    ctx.fillRect(x + 1, y + 34, 11, 6 - walk);
    ctx.fillRect(x + w - 12, y + 34, 11, 3 + walk);
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(x + 3, y + 3, w - 6, 16);
    const isSanta = saveData.skin === "santa";
    if (!isSanta) {
        ctx.fillStyle = "#e8321e";
        ctx.fillRect(x + 1, y, w - 2, 7);
        ctx.fillRect(facing > 0 ? x + 8 : x - 4, y + 5, w - 4, 3);
    }
    ctx.fillStyle = "black";
    ctx.fillRect(x + (facing > 0 ? w - 10 : 6), y + 8, 3, 5);
    ctx.fillStyle = "#4a2a0a";
    ctx.fillRect(x + (facing > 0 ? 8 : 4), y + 14, w - 12, 3);
    if (isSanta) drawSantaHat();
}

function drawSantaHat() {
    const { x, y, w, facing } = player;
    const tipX = x + w / 2 - facing * 12;
    ctx.fillStyle = "#d62828";
    ctx.beginPath();
    ctx.moveTo(x, y + 6);
    ctx.lineTo(x + w, y + 6);
    ctx.lineTo(x + w - 3, y - 4);
    ctx.quadraticCurveTo(x + w / 2, y - 16, tipX, y - 8);
    ctx.lineTo(x + 3, y - 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 2, y + 1, w + 4, 7);
    ctx.beginPath();
    ctx.arc(tipX, y - 8, 4.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawFlag() {
    ctx.fillStyle = "#dddddd";
    ctx.fillRect(flagX + 18, GROUND_Y - 200, 6, 200);
    ctx.fillStyle = "#2c9a2c";
    ctx.beginPath();
    const wave = Math.sin(stateTimer / 10) * 4;
    ctx.moveTo(flagX + 24, GROUND_Y - 196);
    ctx.lineTo(flagX + 78, GROUND_Y - 175 + wave);
    ctx.lineTo(flagX + 24, GROUND_Y - 150);
    ctx.fill();
    ctx.fillStyle = "#ffd21f";
    ctx.beginPath(); ctx.arc(flagX + 21, GROUND_Y - 204, 7, 0, Math.PI * 2); ctx.fill();
}

function drawHud() {
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(8, 8, 330, 34);
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "left";
    ctx.fillText("❤️ " + lives + "    🪙 " + score + "    Level " + currentLevel + (music.muted ? "   🔇" : ""), 18, 31);
    const active = [];
    if (player.jumpTimer > 0) active.push("🦘 " + Math.ceil(player.jumpTimer / 60) + "s");
    if (player.turboTimer > 0) active.push("⚡ " + Math.ceil(player.turboTimer / 60) + "s");
    if (player.doubleTimer > 0) active.push("💸×2 " + Math.ceil(player.doubleTimer / 60) + "s");
    if (player.shield) active.push("⭐");
    if (active.length > 0) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(8, 48, 340, 30);
        ctx.fillStyle = "white";
        ctx.fillText(active.join("   "), 18, 69);
    }
    if (toast.timer > 0) {
        ctx.textAlign = "center";
        ctx.font = "bold 24px Arial";
        ctx.fillStyle = "#ffd21f";
        ctx.fillText(toast.text, VIEW_W / 2, 80);
    }
}

function drawShopButton() {
    const { x, y, w, h } = shopButton;
    ctx.fillStyle = shopOpen ? "#f59e0b" : "#10b981";
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "20px Arial";
    ctx.fillText("🛒", x + w / 2, y + 26);
    ctx.font = "bold 12px Arial";
    ctx.fillText("Taste 1", x + w / 2, y + h - 6);
}

function drawShop() {
    ctx.fillStyle = "rgba(11,37,69,0.7)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "#fff8e1";
    ctx.beginPath();
    ctx.roundRect(shopPanel.x, shopPanel.y, shopPanel.w, shopPanel.h, 14);
    ctx.fill();
    ctx.fillStyle = "#0B2545";
    ctx.textAlign = "center";
    ctx.font = "bold 24px Arial";
    ctx.fillText("🛒 Shop  –  🪙 " + score, shopPanel.x + shopPanel.w / 2, shopPanel.y + 38);

    shopTabs.forEach((tab, index) => {
        const rect = shopTabRect(index);
        ctx.fillStyle = index === shopTab ? "#0B2545" : "#d6dbe6";
        ctx.beginPath();
        ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8);
        ctx.fill();
        ctx.fillStyle = index === shopTab ? "white" : "#0B2545";
        ctx.font = "bold 15px Arial";
        ctx.fillText(tab.name, rect.x + rect.w / 2, rect.y + 21);
    });

    shopTabs[shopTab].rows.forEach((row, index) => {
        const rect = shopRowRect(index);
        const isCosmetic = row.kind !== "powerup";
        const owned = isCosmetic && saveData.owned.includes(row.kind + ":" + row.id);
        const active = owned && saveData[row.kind] === row.id;
        const usable = owned || score >= row.price;
        ctx.fillStyle = usable ? row.color : "#b0b0b0";
        ctx.beginPath();
        ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 10);
        ctx.fill();
        if (active) {
            ctx.strokeStyle = "#ffd21f";
            ctx.lineWidth = 4;
            ctx.stroke();
        }
        ctx.fillStyle = "white";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "left";
        const keyHint = index < 8 ? "   [" + (index + 2) + "]" : index === 8 ? "   [0]" : "";
        ctx.fillText(row.icon + "  " + row.label + keyHint, rect.x + 14, rect.y + rect.h / 2 + 5);
        ctx.textAlign = "right";
        const priceText = active ? "✓ Aktiv" : owned ? "Auswählen" : row.price === 0 ? "Gratis" : "🪙 " + row.price;
        ctx.fillText(priceText, rect.x + rect.w - 14, rect.y + rect.h / 2 + 5);
    });

    ctx.fillStyle = "#0B2545";
    ctx.textAlign = "center";
    ctx.font = "14px Arial";
    ctx.fillText("Klicken oder Zifferntaste · Tab / ⬅️➡️ = Reiter · 1 / Esc = schließen", shopPanel.x + shopPanel.w / 2, shopPanel.y + shopPanel.h - 12);
}

function drawResetDialog() {
    ctx.fillStyle = "rgba(11,37,69,0.75)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "#fff8e1";
    ctx.beginPath();
    ctx.roundRect(resetDialog.x, resetDialog.y, resetDialog.w, resetDialog.h, 14);
    ctx.fill();
    ctx.fillStyle = "#0B2545";
    ctx.textAlign = "center";
    ctx.font = "bold 24px Arial";
    ctx.fillText("Von vorne anfangen?", VIEW_W / 2, resetDialog.y + 42);
    ctx.font = "16px Arial";
    ctx.fillText("Alle Münzen, Skins und Welten gehören dir dann", VIEW_W / 2, resetDialog.y + 80);
    ctx.fillText("nicht mehr. Sie bleiben aber im Shop zum Kaufen.", VIEW_W / 2, resetDialog.y + 102);
    [[resetYesButton, "#dc2626", "Ja [J]"], [resetNoButton, "#16a34a", "Nein [N]"]].forEach(([button, color, label]) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(button.x, button.y, button.w, button.h, 10);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.font = "bold 20px Arial";
        ctx.fillText(label, button.x + button.w / 2, button.y + 30);
    });
}

function drawOverlay(title, subtitle, hint) {
    ctx.fillStyle = "rgba(11,37,69,0.75)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 46px Arial";
    ctx.fillText(title, VIEW_W / 2, VIEW_H / 2 - 10);
    ctx.font = "20px Arial";
    ctx.fillText(subtitle, VIEW_W / 2, VIEW_H / 2 + 30);
    ctx.fillText("🪙 " + score + " · " + hint, VIEW_W / 2, VIEW_H / 2 + 62);
}

function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-Math.round(cameraX), 0);

    drawFlag();
    solids.forEach(solid => {
        if (solid.x + solid.w + 10 < cameraX || solid.x - 10 > cameraX + VIEW_W) return;
        if (solid.kind === "ground") drawGround(solid);
        else if (solid.kind === "brick") drawBrick(solid);
        else if (solid.kind === "lucky") drawLucky(solid);
        else drawPipe(solid, solid.kind === "pipe-ceiling" ? "ceiling" : "ground");
    });
    coins.filter(coin => !coin.taken).forEach(drawCoin);
    items.filter(item => !item.taken).forEach(drawItem);
    enemies.forEach(enemy => { if (enemy.x + enemy.w > cameraX - 20 && enemy.x < cameraX + VIEW_W + 20) drawEnemy(enemy); });
    drawPlayer();

    ctx.restore();
    drawHud();
    drawShopButton();
    if (shopOpen) drawShop();
    if (resetDialogOpen) drawResetDialog();
    if (toast.timer > 0 && shopOpen) {
        ctx.textAlign = "center";
        ctx.font = "bold 24px Arial";
        ctx.fillStyle = "#c2410c";
        ctx.fillText(toast.text, VIEW_W / 2, shopPanel.y + shopPanel.h - 40);
    }
    if (state === "over") drawOverlay("Game Over 😢", "Alle Leben verbraucht", "Enter = Level " + currentLevel + " nochmal");
    if (state === "win") drawOverlay("Level " + currentLevel + " geschafft! 🎉", "+" + WIN_BONUS + " Münzen Belohnung", "Enter = Level " + (currentLevel + 1));
}

// ---------- Schleife (feste 60 Schritte pro Sekunde) ----------
let lastTime = performance.now();
let accumulator = 0;
function frame(now) {
    accumulator += Math.min(now - lastTime, 100);
    lastTime = now;
    while (accumulator >= 1000 / 60) { update(); accumulator -= 1000 / 60; }
    if (state !== "play") stateTimer++;
    animTick++;
    music.setWorld(saveData.background);
    draw();
    requestAnimationFrame(frame);
}

// ---------- Musik (pro Welt, per Web Audio erzeugt) ----------
const WORLD_MUSIC = {
    day:        { bpm: 132, root: 60, scale: [0, 2, 4, 7, 9],        lead: "square",   bass: "triangle", seed: 11, swing: 0 },
    "3d":       { bpm: 120, root: 57, scale: [0, 2, 3, 5, 7, 8, 10], lead: "sawtooth", bass: "square",   seed: 23, swing: 0 },
    christmas:  { bpm: 108, root: 67, scale: [0, 2, 4, 5, 7, 9, 11], lead: "sine",     bass: "triangle", seed: 37, swing: 0.15 },
    donut:      { bpm: 140, root: 62, scale: [0, 2, 4, 7, 9],        lead: "triangle", bass: "sine",     seed: 41, swing: 0.1 },
    halloween:  { bpm: 96,  root: 55, scale: [0, 1, 4, 5, 7, 8, 11], lead: "sawtooth", bass: "sine",     seed: 53, swing: 0 },
    candy:      { bpm: 150, root: 64, scale: [0, 2, 4, 7, 9],        lead: "square",   bass: "triangle", seed: 67, swing: 0.12 },
    comic:      { bpm: 126, root: 62, scale: [0, 2, 4, 7, 9],        lead: "square",   bass: "sawtooth", seed: 97, swing: 0.2 },
    ship:       { bpm: 138, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], lead: "triangle", bass: "square", seed: 131, swing: 0.2 },
    jjk:        { bpm: 112, root: 57, scale: [0, 1, 3, 5, 7, 8, 10], lead: "sawtooth", bass: "square", seed: 113, swing: 0 },
    underwater: { bpm: 84,  root: 58, scale: [0, 2, 3, 7, 8],        lead: "sine",     bass: "sine",     seed: 79, swing: 0 }
};
const music = (() => {
    let audio = null, master = null, worldId = null, plan = null;
    let step = 0, nextTime = 0, muted = false;
    try { muted = localStorage.getItem("jumpandrun-muted") === "1"; } catch { /* egal */ }

    function buildPlan(id) {
        const def = WORLD_MUSIC[id] ?? WORLD_MUSIC.day;
        const random = createRandom(def.seed);
        const chordRoots = [0, 3, 4, 2].map(i => def.scale[i % def.scale.length]);
        const melody = [];
        let degree = 2;
        for (let i = 0; i < 64; i++) {
            if (i % 16 === 0) degree = 2;
            const rest = random() < 0.28 && i % 4 !== 0;
            degree = Math.max(0, Math.min(def.scale.length * 2 - 1, degree + Math.round((random() - 0.5) * 4)));
            melody.push(rest ? null : degree);
        }
        return { def, melody, chordRoots };
    }
    function midiToHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function scaleNote(def, degree) {
        const n = def.scale.length;
        return def.root + def.scale[degree % n] + 12 * Math.floor(degree / n);
    }
    function tone(type, hz, time, length, volume) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + length);
        osc.connect(gain).connect(master);
        osc.start(time);
        osc.stop(time + length + 0.05);
    }
    function schedule() {
        if (!audio || !plan) return;
        const { def, melody, chordRoots } = plan;
        const stepLength = 60 / def.bpm / 2;
        while (nextTime < audio.currentTime + 0.3) {
            const i = step % 64;
            const swung = nextTime + (i % 2 === 1 ? stepLength * def.swing : 0);
            const note = melody[i];
            if (note !== null) tone(def.lead, midiToHz(scaleNote(def, note) + 12), swung, stepLength * 1.6, 0.07);
            if (i % 4 === 0) {
                const chord = chordRoots[Math.floor(i / 16) % chordRoots.length];
                tone(def.bass, midiToHz(def.root - 24 + chord), nextTime, stepLength * 3.6, 0.16);
            }
            if (i % 8 === 4) tone(def.bass, midiToHz(def.root - 12 + def.scale[2]), nextTime, stepLength * 1.5, 0.05);
            nextTime += stepLength;
            step++;
        }
    }
    const api = {
        get muted() { return muted; },
        unlock() {
            if (!audio) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                audio = new Ctx();
                master = audio.createGain();
                master.gain.value = muted ? 0 : 0.6;
                master.connect(audio.destination);
                setInterval(schedule, 100);
                if (worldId) api.setWorld(worldId, true);
            }
            if (audio.state === "suspended") audio.resume();
        },
        setWorld(id, force) {
            if (id === worldId && !force) return;
            worldId = id;
            if (!audio) return;
            plan = buildPlan(id);
            step = 0;
            nextTime = audio.currentTime + 0.1;
        },
        toggleMute() {
            muted = !muted;
            try { localStorage.setItem("jumpandrun-muted", muted ? "1" : "0"); } catch { /* egal */ }
            if (master) master.gain.value = muted ? 0 : 0.6;
        }
    };
    return api;
})();
window.addEventListener("pointerdown", () => music.unlock());

// ---------- Touch-Steuerung ----------
document.querySelectorAll("#touch button[data-key]").forEach(button => {
    const key = button.dataset.key;
    const press = event => { event.preventDefault(); button.setPointerCapture?.(event.pointerId); keys[key] = true; button.classList.add("on"); music.unlock(); };
    const release = () => { keys[key] = false; button.classList.remove("on"); };
    button.addEventListener("pointerdown", press);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
    button.addEventListener("contextmenu", event => event.preventDefault());
});
document.getElementById("resetButton").addEventListener("click", () => {
    if (state === "play" && !shopOpen) { resetDialogOpen = true; keys = {}; }
});
document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });

setInterval(persist, 1000);
window.addEventListener("beforeunload", persist);
newGame(saveData.level);
requestAnimationFrame(frame);
</script>
