<!DOCTYPE html>
<html>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script>
      // Y-Position der Kugel
      let y = -10;
      let x = 100;
      
      // Vertikale Geschwindigkeit der Kugel
      let vy = 0;
      // Anziehungskr aft
      let g = 1;
      // Radius der Kugel
      let radius = 100;
      // Rückprallfaktor
      let restitution = 0.8;

      // Erstelle die Oberfläche
      function setup(red) {
        // Erstelle eine Oberfläche mit 600x400 Pixeln
        createCanvas(725, 700);
      }

      // Zeichne die Kugel
      function draw() {
        background("gray");
        // Berechne die Physik
        vy += g;
        y  += vy;

        // Behandle Boden-Kollision
        if (y + radius > height) {
          y = height - radius;
          vy = -vy * restitution;
        }

        // Zeichne die Kugel
        fill("red");  // Weiß
        circle(x, y, radius*2);

        // kleine Anleitung
        fill("red");  // Text in Schwarz
        text(" du bist Dum ", 300, 200);
      }

      // Taste gedrückt-Funktion
      function keyPressed() {
        if (keyCode === 32) vy = -10;        // Leertaste = Sprung
        if (keyCode === UP_ARROW) vy = -14;  // Pfeil hoch = hoher Sprung
        if (keyCode === RIGHT_ARROW) x = x+10
         if (keyCode === LEFT_ARROW) x = x+-10
      }
    
    </script>
  </body>
</html>
