<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Straßenkampf 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
  #gl{position:fixed;inset:0;display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);flex-direction:column;text-align:center}
  #overlay h1{font-size:34px;margin:0 0 6px;letter-spacing:2px;text-transform:uppercase;color:#ffd24a;text-shadow:0 2px 0 #000}
  #overlay p{margin:0 0 18px;color:#ccc}
  #cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1000px;max-height:70vh;overflow:auto;padding:6px}
  .card{width:165px;background:#1c2430;border:2px solid #3a4a60;border-radius:10px;padding:12px;cursor:pointer;transition:.12s;text-align:left}
  .card:hover{transform:translateY(-4px);border-color:#ffd24a;background:#26324a}
  .card h3{margin:0 0 2px;font-size:16px}
  .card small{color:#8fa3bf}
  .bar{height:6px;background:#0d121a;border-radius:3px;margin:3px 0 7px;overflow:hidden}
  .bar i{display:block;height:100%;background:#ffd24a}
  .key{float:right;background:#ffd24a;color:#000;border-radius:4px;padding:0 6px;font-weight:700;font-size:13px}
  button.big{margin-top:20px;background:#ffd24a;color:#000;border:0;padding:12px 30px;font-size:18px;font-weight:700;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================ Setup
const glc = document.getElementById('gl'), hudc = document.getElementById('hud'), hud = hudc.getContext('2d');
const ov = document.getElementById('overlay');
const renderer = new THREE.WebGLRenderer({canvas:glc, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, .1, 260);
let W, H;
function resize(){ W = innerWidth; H = innerHeight; renderer.setSize(W,H,false); glc.style.width=W+'px'; glc.style.height=H+'px';
  hudc.width = W; hudc.height = H; camera.aspect = W/H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const keys = {}; const mouse = {down:false};
const locked = () => document.pointerLockElement === glc;
function lock(){ try{ const r = glc.requestPointerLock(); if (r && r.catch) r.catch(()=>{}); }catch(e){} }
addEventListener('keydown', e => { keys[e.code] = true; if (e.code==='Space') e.preventDefault(); onKey(e.code); });
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('mousemove', e => {
  if (!locked() || (state!=='street' && state!=='arena')) return;
  player.ang += e.movementX*0.0024;
  camPitch = clamp(camPitch + e.movementY*0.002, .02, .85);
});
glc.addEventListener('mousedown', () => { if (!locked()){ lock(); return; } mouse.down = true; });
addEventListener('mouseup', () => mouse.down = false);
document.addEventListener('pointerlockchange', () => { if (!locked()) mouse.down = false; });
addEventListener('contextmenu', e => e.preventDefault());

const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const BOOST = 3.2;  // Waffen-Schadensbonus
const U = 40;  // Waffen-Pixelwerte -> Meter
const C = h => new THREE.Color(h).convertSRGBToLinear();   // sRGB-Hex -> lineare Farbe

// ============================================================ Daten
const WEAPONS = {
  // Abschnitt 1 (Troll): Handfeuerwaffen
  pistol:  {name:'Glock 17',         dmg:40,  rate:.22, speed:950, spread:.03, pellets:1, r:3},
  revolver:{name:'Colt Python .357', dmg:95,  rate:.5,  speed:1000,spread:.02, pellets:1, r:4},
  shotgun: {name:'Pump-Action-Flinte',dmg:30, rate:.8,  speed:900, spread:.36, pellets:8, r:3},
  hunting: {name:'Jagdgewehr',       dmg:130, rate:.9,  speed:1500,spread:.01, pellets:1, r:4},
  crossbow:{name:'Armbrust',         dmg:110, rate:.7,  speed:1300,spread:.01, pellets:1, r:4, col:0xd9c9a0},
  // Abschnitt 2 (Spinne): Maschinenwaffen
  mp5:     {name:'MP5',              dmg:28,  rate:.075,speed:1000,spread:.1,  pellets:1, r:3},
  uzi:     {name:'Uzi',              dmg:22,  rate:.055,speed:1000,spread:.18, pellets:1, r:3},
  ak47:    {name:'AK-47',            dmg:55,  rate:.1,  speed:1100,spread:.06, pellets:1, r:3},
  dbl:     {name:'Doppellauf-Flinte',dmg:38,  rate:.9,  speed:900, spread:.3,  pellets:10,r:3},
  flame:   {name:'Flammenwerfer',    dmg:20,  rate:.035,speed:430, spread:.22, pellets:1, r:7, life:.5, col:0xff8a2a},
  // Abschnitt 3 (Dämon): Militärwaffen
  m4:      {name:'M4 Karabiner',     dmg:70,  rate:.085,speed:1200,spread:.04, pellets:1, r:3},
  lmg:     {name:'M249 MG',          dmg:60,  rate:.06, speed:1150,spread:.1,  pellets:1, r:3},
  sniper:  {name:'Barrett .50',      dmg:520, rate:1.0, speed:2000,spread:0,   pellets:1, r:4, col:0xffffff},
  grenade: {name:'Granatwerfer M32', dmg:320, rate:.9,  speed:430, spread:.02, pellets:1, r:6, splash:135},
  rpg:     {name:'RPG-7',            dmg:600, rate:1.4, speed:520, spread:0,   pellets:1, r:6, splash:150},
  // Abschnitt 4 (Hydra): Hightech
  railgun: {name:'Railgun',          dmg:900, rate:1.0, speed:2200,spread:0,   pellets:1, r:4, col:0x5ef0ff},
  laser:   {name:'Laserkanone',      dmg:100, rate:.1,  speed:1700,spread:0,   pellets:1, r:4, col:0x5ef0ff},
  plasma:  {name:'Plasmagewehr',     dmg:260, rate:.2,  speed:900, spread:.03, pellets:1, r:6, splash:80, col:0x6aff5a},
  minigun: {name:'M134 Minigun',     dmg:55,  rate:.03, speed:1200,spread:.12, pellets:1, r:3},
  panzer:  {name:'Panzerfaust',      dmg:1400,rate:1.5, speed:600, spread:0,   pellets:1, r:7, splash:170}
};
const GEAR = {
  vest:  {name:'Schutzweste', color:0x3b6ea5, text:'+50 Rüstung'},
  medkit:{name:'Medkit',      color:0xe04848, text:'+40 Leben'},
  boots: {name:'Sprintschuhe',color:0x3fbf7f, text:'+15% Tempo'},
  gloves:{name:'Kampfhandschuhe', color:0xc98a2e, text:'+15% Schaden'},
  helmet:{name:'Helm',        color:0x7d8a99, text:'+25 Rüstung'}
};
// Kreuzungen: nach jedem besiegten Gegner läuft man zur nächsten
const CROSSES = [75, 170, 265, 360];
const STREET_END = CROSSES[CROSSES.length-1] + 6.25, STREET_START = -30, ARENA_R = 15.5;
const pillars = [{x:-7.5,y:-7.5,r:1.05},{x:7.5,y:-7.5,r:1.05},{x:-7.5,y:7.5,r:1.05},{x:7.5,y:7.5,r:1.05}];
const nearCross = (x,m) => CROSSES.some(c => Math.abs(x-c) < m);

// ============================================================ Three: Helfer
const matCache = {};
const lam = c => matCache['l'+c] || (matCache['l'+c] = new THREE.MeshStandardMaterial({color:C(c),roughness:.85,metalness:0}));
const bas = c => matCache['b'+c] || (matCache['b'+c] = new THREE.MeshBasicMaterial({color:C(c)}));
const unitBox = new THREE.BoxGeometry(1,1,1), unitSphere = new THREE.SphereGeometry(1,16,12), unitCyl = new THREE.CylinderGeometry(1,1,1,16);
const _up = new THREE.Vector3(0,1,0);
function box(w,h,d,m,x=0,y=0,z=0,shadow=true){ const o = new THREE.Mesh(unitBox,m); o.scale.set(w,h,d); o.position.set(x,y,z); o.castShadow=shadow; return o; }
function cyl(r,h,m,x=0,y=0,z=0){ const o = new THREE.Mesh(unitCyl,m); o.scale.set(r,h,r); o.position.set(x,y,z); o.castShadow=true; return o; }
function ball(p,x,y,z,sx,sy,sz,m){ const o = new THREE.Mesh(unitSphere,m); o.scale.set(sx,sy??sx,sz??sx); o.position.set(x,y,z); o.castShadow=true; p.add(o); return o; }
function limb(p,a,b,r1,r2,m){   // Zylinder von a (Radius r1) nach b (Radius r2)
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b), d = vb.clone().sub(va), len = d.length();
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,10), m);
  o.position.copy(va).add(vb).multiplyScalar(.5); o.quaternion.setFromUnitVectors(_up,d.normalize()); o.castShadow = true; p.add(o); return o;
}
function mk(list,hex,rough=.8,metal=0,emis){ const m = new THREE.MeshStandardMaterial({color:C(hex),roughness:rough,metalness:metal}); if (emis!==undefined){ m.emissive = C(emis); } list&&list.push(m); return m; }
function labelSprite(text){
  const c = document.createElement('canvas'); c.width=256; c.height=64; const g = c.getContext('2d');
  g.font='bold 30px Segoe UI, Arial'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=6; g.strokeStyle='#000'; g.strokeText(text,128,32); g.fillStyle='#fff'; g.fillText(text,128,32);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthWrite:false}));
  s.scale.set(3,.75,1); return s;
}
function noiseTexture(base,var_,size=256,rep=1,lines=false,grid=0){
  const c = document.createElement('canvas'); c.width=c.height=size; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,size,size);
  const id = g.getImageData(0,0,size,size);
  for (let i=0;i<id.data.length;i+=4){ const n=(Math.random()-.5)*var_; id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n; }
  g.putImageData(id,0,0);
  if (lines){ g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=1.2; for(let i=0;i<5;i++){ g.beginPath(); let x=Math.random()*size,y=Math.random()*size; g.moveTo(x,y); for(let k=0;k<6;k++){ x+=rnd(-30,30); y+=rnd(-30,30); g.lineTo(x,y);} g.stroke(); } }
  if (grid){ g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; for(let i=0;i<=size;i+=size/grid){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,size); g.moveTo(0,i); g.lineTo(size,i); g.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep); t.encoding=THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

// Himmel (Farbverlauf), Lichter
function skyTexture(top,mid,bot){
  const c = document.createElement('canvas'); c.width=4; c.height=256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,256); gr.addColorStop(0,top); gr.addColorStop(.55,mid); gr.addColorStop(1,bot);
  g.fillStyle=gr; g.fillRect(0,0,4,256); const t = new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
const skyDay = skyTexture('#3d78c4','#9cc3e6','#e8dcc4'), skyNight = skyTexture('#05030a','#140c24','#2a1236');
const hemi = new THREE.HemisphereLight(C(0xbfd8ff), C(0x6a6458), .75); scene.add(hemi);
const sun = new THREE.DirectionalLight(C(0xffe6bf), 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -.0004;
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:140});
scene.add(sun, sun.target);
const arenaLights = [new THREE.PointLight(C(0xff4a8a),2.2,44), new THREE.PointLight(C(0x6a5aff),1.8,44)];
arenaLights[0].position.set(-9,6,-9); arenaLights[1].position.set(9,6,9);
arenaLights.forEach(l => { l.visible=false; scene.add(l); });

// ============================================================ Welt: Straße (statisch)
const streetG = new THREE.Group(), arenaG = new THREE.Group(); scene.add(streetG, arenaG); arenaG.visible=false;
const cars = [];
const TEX = {};
function slab(x0,x1,z0,z1,h,mat,uvScale){
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,h,z1-z0), mat);
  m.position.set((x0+x1)/2,h/2,(z0+z1)/2); m.receiveShadow = true; streetG.add(m); return m;
}
function building(x0,x1,z0,z1,h,color){
  const w=x1-x0, d=z1-z0;
  const tx = TEX.win.clone(), tz = TEX.win.clone(); tx.needsUpdate = tz.needsUpdate = true;
  tx.repeat.set(d/3,h/3); tz.repeat.set(w/3,h/3);
  const mk2 = t => new THREE.MeshStandardMaterial({color:C(color),map:t,roughness:.75,emissive:C(0x40351a),emissiveMap:t,emissiveIntensity:.0});
  const mx = mk2(tx), mz = mk2(tz), roof = lam(0x3b3f46);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mx,mx,roof,roof,mz,mz]);
  m.position.set((x0+x1)/2,h/2,(z0+z1)/2); m.castShadow = m.receiveShadow = true; streetG.add(m);
  // Dachaufbau
  if (Math.random()<.6) streetG.add(box(rnd(.8,1.6),rnd(.6,1.4),rnd(.8,1.6),lam(0x555a62),(x0+x1)/2+rnd(-.5,.5),h+.5,(z0+z1)/2+rnd(-1,1)));
}
function makeCar(color){
  const g = new THREE.Group(); const paint = new THREE.MeshStandardMaterial({color:C(color),roughness:.3,metalness:.55});
  const glass = new THREE.MeshStandardMaterial({color:C(0x1a2630),roughness:.1,metalness:.6});
  const body = box(4.3,.62,1.85,paint,0,.62,0); g.add(body);
  g.add(box(3.7,.28,1.8,paint,0,.98,0), box(2.2,.6,1.62,glass,-.25,1.32,0), box(2.1,.1,1.55,paint,-.25,1.66,0));
  g.add(box(.05,.18,.45,bas(0xffe9a0),2.15,.72,.6,false), box(.05,.18,.45,bas(0xffe9a0),2.15,.72,-.6,false),
        box(.05,.16,.45,bas(0xdd2222),-2.15,.72,.6,false), box(.05,.16,.45,bas(0xdd2222),-2.15,.72,-.6,false));
  g.add(box(.2,.12,1.9,lam(0x222222),2.2,.38,0), box(.2,.12,1.9,lam(0x222222),-2.2,.38,0));
  for (const sx of [-1.4,1.4]) for (const sz of [-.9,.9]){ const w = cyl(.38,.28,lam(0x151515),sx,.38,sz); w.rotation.x=Math.PI/2; g.add(w); const hub = cyl(.2,.3,lam(0xaaaaaa),sx,.38,sz); hub.rotation.x=Math.PI/2; g.add(hub); }
  return g;
}
function buildStreet(){
  TEX.win = (() => { const c = document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
    g.fillStyle='#ffffff'; g.fillRect(0,0,64,64);
    for (let y=0;y<4;y++) for (let x=0;x<4;x++){ g.fillStyle = Math.random()<.3 ? '#ffe2a0' : '#2c3a4d'; g.fillRect(x*16+3,y*16+3,10,10); g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(x*16+3,y*16+3,10,3); }
    const t = new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; t.magFilter=THREE.NearestFilter; return t; })();
  const asphalt = new THREE.MeshStandardMaterial({color:C(0x8a8a8e), map:noiseTexture('#3a3b40',38,256,1,true), roughness:.95});
  const asphaltTex = asphalt.map; asphaltTex.repeat.set(1,1);
  const pave = new THREE.MeshStandardMaterial({color:C(0xc6c6c8), map:noiseTexture('#9a9a9e',22,256,1,false,4), roughness:.9});
  const asphaltLong = new THREE.MeshStandardMaterial({color:C(0x8a8a8e), map:noiseTexture('#3a3b40',38,256,1,true), roughness:.95});
  asphaltLong.map.repeat.set((STREET_END-STREET_START)/6, 1);
  const paveLong = new THREE.MeshStandardMaterial({color:C(0xc6c6c8), map:noiseTexture('#9a9a9e',22,256,1,false,4), roughness:.9});
  paveLong.map.repeat.set((STREET_END-STREET_START)/3, 1);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200,1200), lam(0x4a4d53)); ground.rotation.x=-Math.PI/2; ground.position.x=200; ground.receiveShadow=true; streetG.add(ground);
  slab(STREET_START,STREET_END,-2.5,2.5,.06,asphaltLong);
  for (const c of CROSSES) slab(c-2.5,c+2.5,-15.5,15.5,.06,asphalt);
  for (const s of [-1,1]){
    const a=s<0?-4.75:2.5, b=s<0?-2.5:4.75; const c0=s<0?-15.5:4.75, d0=s<0?-4.75:15.5;
    slab(STREET_START,STREET_END,a,b,.15,paveLong);
    for (const c of CROSSES){ slab(c-3,c-2.5,c0,d0,.15,pave); slab(c+2.5,c+3,c0,d0,.15,pave); }
  }
  // Fahrbahn über den Gehwegen an Kreuzungen frei halten
  for (const c of CROSSES) slab(c-2.5,c+2.5,-4.75,4.75,.16,asphalt).position.y = .08;
  // Linien
  const yel = bas(0xe8c53a), wht = bas(0xdddddd);
  for (let x=STREET_START+2;x<STREET_END;x+=3){ if (nearCross(x,3.2)) continue; streetG.add(box(1.6,.02,.12,yel,x,.09,0,false)); }
  for (const c of CROSSES){
    for (let z=-15;z<-3;z+=3) streetG.add(box(.12,.02,1.6,yel,c,.09,z,false));
    for (let z=4;z<15;z+=3) streetG.add(box(.12,.02,1.6,yel,c,.09,z,false));
    for (let z=-2.2;z<2.3;z+=.55) for (const x of [c-3.75,c+3.75]) streetG.add(box(1.4,.02,.3,wht,x,.09,z,false));
    // Kanaldeckel
    const lid = cyl(.4,.03,lam(0x2a2a2a),c+2.5,.09,1.5); streetG.add(lid);
  }
  // Gebäude
  const cols = [0x8b8f98,0xa88a7a,0x7f9a86,0xb59d78,0x6f7f97,0x9a87a8,0xb86a5a];
  const pick = () => cols[(Math.random()*cols.length)|0];
  for (let x=STREET_START;x<STREET_END+10;x+=3.75) for (const s of [-1,1]){
    if (nearCross(x+1.7,12.5)) continue;
    const dd = rnd(5,10), hh = rnd(9,30);
    s<0 ? building(x,x+3.4,-4.75-dd,-4.75,hh,pick()) : building(x,x+3.4,4.75,4.75+dd,hh,pick());
  }
  for (const c of CROSSES) for (const sx of [-1,1]) for (const sz of [-1,1]){
    const x0 = sx<0 ? c-12 : c+3, x1 = sx<0 ? c-3 : c+12;
    sz<0 ? building(x0,x1,-15.5,-4.75,rnd(10,22),pick()) : building(x0,x1,4.75,15.5,rnd(10,22),pick());
  }
  for (const c of CROSSES) for (const z of [-15.3,15.3]) for (let i=0;i<8;i++) streetG.add(box(.5,.8,.12,lam(i%2?0xd9342b:0xeeeeee),c-2.1+i*.6,.5,z));
  building(STREET_END+.5,STREET_END+6,-4.75,4.75,14,0x5f6f83);
  building(STREET_START-5,STREET_START,-4.75,4.75,14,0x5f6f83);
  // Laternen
  for (let x=STREET_START+5;x<STREET_END;x+=10) for (const s of [-1,1]){
    if (nearCross(x,5)) continue;
    streetG.add(cyl(.06,5,lam(0x2a2a2a),x,2.5,s*4.5), box(.1,.1,1,lam(0x2a2a2a),x,5,s*4), box(.4,.1,.3,bas(0xffe9a0),x,4.93,s*3.55,false));
  }
  // Mülleimer, Hydranten
  for (let x=STREET_START+8;x<STREET_END;x+=13){ if (nearCross(x,5)) continue; const s=Math.random()<.5?-1:1;
    streetG.add(cyl(.28,.8,lam(0x3a5a3a),x,.55,s*4.5)); const h=cyl(.14,.6,lam(0xcc2a2a),x+4,.45,-s*4.45); streetG.add(h); }
  // Autos
  const carCols = [0xc0392b,0x2980b9,0xf1c40f,0xecf0f1,0x27ae60,0x8e44ad,0x222222];
  let n=0; for (let x=STREET_START+10;x<STREET_END-4;x+=9){
    if (nearCross(x,8)) continue;
    const m = makeCar(carCols[n%7]); const z=(n%2?1:-1)*3.45, xx=x+rnd(-1,1); n++;
    m.position.set(xx,0,z); if (rnd(0,1)<.5) m.rotation.y=Math.PI; streetG.add(m); cars.push({x:xx,z});
  }
  // Waffenwahl-Markierungen
  streetG.userData.rings = []; streetG.userData.beams = [];
  for (const c of CROSSES){
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.7,2.1,48), new THREE.MeshBasicMaterial({color:C(0xffd24a),side:THREE.DoubleSide,transparent:true,opacity:.9}));
    ring.rotation.x=-Math.PI/2; ring.position.set(c,.12,0); streetG.add(ring); streetG.userData.rings.push(ring);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,14,24,1,true), new THREE.MeshBasicMaterial({color:C(0xffd24a),transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}));
    beam.position.set(c,7,0); streetG.add(beam); streetG.userData.beams.push(beam);

function buildHydra(){
  const g = new THREE.Group(), mats = [];
  const scale = mk(mats,0x1f5e54,.45,.25), belly = mk(mats,0x9fc08a,.7), spike = mk(mats,0xd8d0b0,.4), tooth = mk(mats,0xf2eedd,.3), dark = mk(mats,0x123a34,.6);
  ball(g,0,1.8,0,2.3,1.3,1.6,scale); ball(g,.2,1.35,0,2.1,.8,1.4,belly);
  for (let i=0;i<9;i++){ const x=-1.9+i*.5, y=2.95-Math.abs(x)*.12; limb(g,[x,y,0],[x-.15,y+.8,0],.2,.01,spike); }
  const legs = [];
  for (const sx of [-1.2,1.2]) for (const s of [-1,1]){ const p = new THREE.Group(); p.position.set(sx,1.2,s*1.3);
    limb(p,[0,0,0],[0,-.6,s*.3],.5,.4,scale); limb(p,[0,-.6,s*.3],[.2,-1.2,s*.4],.4,.3,scale); ball(p,.4,-1.2,s*.4,.55,.15,.4,dark); for (const o of [-.2,0,.2]) limb(p,[.8,-1.15,s*.4+o],[1.1,-1.15,s*.4+o],.06,.01,spike); g.add(p); legs.push(p); }
  const tail=[]; for (let i=0;i<8;i++) tail.push(ball(g,-2.2-i*.6,1.5-i*.08,0,.8-i*.08,.6-i*.06,.7-i*.07,scale));
  limb(g,[-7,1.0,0],[-8,1.0,0],.2,.01,spike);
  const heads = [];
  for (let k=0;k<3;k++){
    const hg = new THREE.Group();
    ball(hg,0,0,0,.8,.42,.46,scale); ball(hg,.35,-.28,0,.55,.14,.34,dark);                // Schädel, Unterkiefer
    for (let i=0;i<5;i++){ limb(hg,[.4+i*.12,-.12,.22],[.4+i*.12,-.38,.2],.04,.005,tooth); limb(hg,[.4+i*.12,-.12,-.22],[.4+i*.12,-.38,-.2],.04,.005,tooth); }
    for (const s of [-1,1]){ ball(hg,.4,.18,s*.28,.09,.09,.09,glow(0xffe030)); limb(hg,[-.1,.3,s*.25],[-.6,.7,s*.5],.1,.01,spike); }
    ball(hg,.85,.05,.0,.1,.06,.2,dark);

    legs.forEach((l,i) => l.rotation.z = Math.sin(ph+(i%2)*Math.PI)*.35*(i<2?1:-1));

    heads.forEach((h,k) => {
      const base = [1.3,2.6,h.z*1.1];

        const x = base[0] + u*(2.4+atk*.6+lunge*1.0) + Math.sin(time*1.7+h.ph)*.2*u;
        const y = base[1] + Math.sin(u*Math.PI*.85)*(1.8-lunge*1.2) - u*.6;
        const z = base[2] + h.z*u*1.3 + Math.sin(time*1.3+h.ph)*.6*u;

      h.hg.rotation.z = -.35 + Math.sin(time*2+h.ph)*.08 + (atk?-.15:0);

// Schussgeräusche (Web Audio, erst nach Klick aktiv)
let actx = null, noiseBuf = null;
function sfx(kind){
  try{
    if (!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); noiseBuf = actx.createBuffer(1,actx.sampleRate*.6,actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const t = actx.currentTime, src = actx.createBufferSource(); src.buffer = noiseBuf;
    const f = actx.createBiquadFilter(), g = actx.createGain(); f.type='lowpass';
    const P = {light:[3500,.09,.28], heavy:[1400,.22,.5], boom:[500,.6,.9], laser:[6000,.12,.2], flame:[1800,.06,.12]}[kind] || [2500,.1,.3];
    f.frequency.setValueAtTime(P[0],t); f.frequency.exponentialRampToValueAtTime(200,t+P[1]);
    g.gain.setValueAtTime(P[2],t); g.gain.exponentialRampToValueAtTime(.001,t+P[1]);
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t,Math.random()*.2,P[1]+.05);
    if (kind==='laser'){ const o = actx.createOscillator(), og = actx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(1400,t); o.frequency.exponentialRampToValueAtTime(200,t+.15); og.gain.setValueAtTime(.12,t); og.gain.exponentialRampToValueAtTime(.001,t+.15); o.connect(og); og.connect(actx.destination); o.start(t); o.stop(t+.16); }
  }catch(e){}
}
const SND = {pistol:'light',revolver:'heavy',shotgun:'heavy',hunting:'heavy',crossbow:'flame',mp5:'light',uzi:'light',ak47:'light',dbl:'heavy',flame:'flame',m4:'light',lmg:'light',sniper:'boom',grenade:'boom',rpg:'boom',railgun:'laser',laser:'laser',plasma:'laser',minigun:'light',panzer:'boom'};
const muzzleLight = new THREE.PointLight(C(0xffc060),0,12); scene.add(muzzleLight);
let flashT = 0, kick = 0;
function explode(x,y,r,dmg){
  for (let i=0;i<34;i++){ const a=rnd(0,6.28), s=rnd(2,9);
    puff(x,1.2,y,Math.cos(a)*s,rnd(1,6),Math.sin(a)*s,rnd(.35,.8),[0xff7a30,0xffd24a,0x555555][i%3],rnd(.12,.35),9); }
  puff(x,1.2,y,0,0,0,.25,0xffe0a0,r*1.4);
  shake = 12; sfx('boom');

    telegraph.visible=slamRing.visible=slamFill.visible=false;

function hurtPlayer(d){
  if (player.invuln > 0 || state==='lose') return;
  if (player.armor > 0){ const a = Math.min(player.armor,d*.6); player.armor -= a; d -= a; }
  player.hp -= d; player.hurt = .25; shake = Math.max(shake,7);

// ============================================================ Schießen
function shoot(){
  const w = WEAPONS[player.weapon]; if (player.cd > 0) return; player.cd = w.rate;
  const dx = Math.cos(player.ang), dz = Math.sin(player.ang), rx = -dz, rz = dx;
  const sx = player.x + rx*.34 + dx*(ph.muzzle+.1), sz = player.y + rz*.34 + dz*(ph.muzzle+.1);
  for (let i=0;i<w.pellets;i++){
    const a = player.ang + rnd(-w.spread,w.spread), sp = w.speed/U;
    const b = {x:sx,y:sz,h:1.3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:w.dmg*BOOST*player.dmgMul,life:w.life||1.4,r:w.r/30,own:'p',rocket:!!w.splash,splash:(w.splash||0)/U,exploded:false,col:w.col||(w.splash?0xff7a30:0xffe27a)};
    bulletMesh(b); b.m.position.set(sx,1.3,sz); bullets.push(b);
  }
  for (let i=0;i<5;i++) puff(sx,1.3,sz,dx*4+rnd(-2,2),rnd(-1,2),dz*4+rnd(-2,2),.1,0xffd86b,.14);
  puff(sx,1.3,sz,0,0,0,.05,0xfff0b0,.35);
  muzzleLight.position.set(sx,1.5,sz); muzzleLight.color.copy(C(w.col||0xffc060)); muzzleLight.intensity = 6; flashT = .05;
  kick = Math.min(1.4, kick + (w.splash?1.4:w.pellets>1?1:.45));
  sfx(SND[player.weapon]);
  shake = Math.max(shake, w.splash?6:w.pellets>1?3.5:1);
}
function bossShoot(a,sp,dmg=9){
  const b = {x:boss.x+Math.cos(a)*boss.r*1.2,y:boss.y+Math.sin(a)*boss.r*1.2,h:1.4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:dmg*boss.L.dmg,life:6,r:.26,own:'b',col:boss.L.col};
  bulletMesh(b); b.m.position.set(b.x,1.4,b.y); bullets.push(b);
}

// ============================================================ Update
function update(dt){
  time += dt;
  msgs.forEach(m=>m.life-=dt); msgs = msgs.filter(m=>m.life>0);
  for (const p of particles){ p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt; p.vy-=p.grav*dt; p.life-=dt; p.m.scale.setScalar(Math.max(.001,p.size*Math.min(1,p.life/p.max*1.5))); if (p.m.position.y<0){p.m.position.y=0;p.vy*=-.3;} }
  particles = particles.filter(p => { if (p.life<=0){ scene.remove(p.m); return false; } return true; });
  shake *= Math.pow(.001,dt); fadeExtra = Math.max(0,fadeExtra-dt*1.4);
  const pulse = .6+.4*Math.sin(time*4); streetG.userData.rings.forEach(r => r.material.opacity = pulse);

  if (state==='teleport'){
    tele.t += dt;
    puff(player.x+rnd(-.4,.4),rnd(0,1),player.y+rnd(-.4,.4),0,rnd(3,8),0,.7,0x5ef0ff,.09);
    if (tele.t > 2.2) startArena();
    return;
  }
  if (state==='back'){
    back.t += dt; if (!back.swapped && back.t>=1){ back.swapped=true; finishBack(); }
    if (back.t>=2){ state='street'; back=null; lock(); }
    return;
  }
  if (state==='intro'||state==='select') return;
  const p = player;
  p.cd-=dt; p.dashCd-=dt; p.hurt-=dt; p.invuln-=dt;

  if (state==='street'||state==='arena'){
    p.ang += ((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*2.4*dt;
    const dx=Math.cos(p.ang), dz=Math.sin(p.ang), rx=-dz, rz=dx;
    const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0), r=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    let mx=dx*f+rx*r, mz=dz*f+rz*r; const ml=Math.hypot(mx,mz);
    if (p.dash>0){ p.dash-=dt; p.x+=p.dashDir.x*18*dt; p.y+=p.dashDir.y*18*dt; puff(p.x,.8,p.y,0,0,0,.25,0xffffff,.2); }
    else {
      if (ml){ mx/=ml; mz/=ml; p.step+=dt*11; }
      const sp = 6.6*p.speedMul; p.x+=mx*sp*dt; p.y+=mz*sp*dt;
      if (keys.Space && p.dashCd<=0){ p.dash=.16; p.dashCd=1; p.invuln=Math.max(p.invuln,.3); p.dashDir = ml?{x:mx,y:mz}:{x:dx,y:dz}; }
    }
    if (mouse.down && locked()) shoot();
  }
  if (state==='street') updateStreet(dt); else if (state==='arena'||state==='win') updateArena(dt);

  for (const b of bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if (b.rocket) puff(b.x,b.h,b.y,rnd(-.5,.5),rnd(-.5,.5),rnd(-.5,.5),.3,0xaaaaaa,.12);
    if (state==='arena'||state==='win'){
      if (Math.hypot(b.x,b.y)>ARENA_R) b.life=0;
      for (const pl of pillars) if (Math.hypot(b.x-pl.x,b.y-pl.y)<pl.r) b.life=0;
      if (b.own==='p' && boss && boss.hp>0 && Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+b.r){
        b.life=0;
        if (b.rocket){ b.exploded=true; explode(b.x,b.y,b.splash,b.dmg); }
        else { damageBoss(b.dmg); for(let i=0;i<3;i++) puff(b.x,b.h,b.y,rnd(-3,3),rnd(0,3),rnd(-3,3),.25,0xff4a8a,.1); }
      }
      if (b.own==='b' && p.invuln<=0 && Math.hypot(b.x-p.x,b.y-p.y)<.4+b.r){ b.life=0; hurtPlayer(b.dmg); }
    }
    if (b.life<=0 && b.rocket && !b.exploded){ b.exploded=true; explode(b.x,b.y,b.splash,0); }
    b.m.position.set(b.x,b.h,b.y);
  }
  bullets = bullets.filter(b => { if (b.life<=0){ scene.remove(b.m); return false; } return true; });
}

function updateStreet(dt){
  const p = player;
  p.x = clamp(p.x,STREET_START+1,STREET_END-.4);
  p.y = nearCross(p.x,2.4) ? clamp(p.y,-14.8,14.8) : clamp(p.y,-4.1,4.1);
  for (const c of cars){
    if (Math.abs(p.x-c.x)>4) continue;
    const dx=p.x-c.x, dz=p.y-c.z, ox=2.2+.4-Math.abs(dx), oz=.95+.4-Math.abs(dz);
    if (ox>0 && oz>0){ if (ox<oz) p.x+=Math.sign(dx||1)*ox; else p.y+=Math.sign(dz||1)*oz; }
  }
  for (const it of items){
    if (it.taken || Math.abs(it.x-p.x)>30) continue;
    it.body.position.y = 1+Math.sin(time*3+it.ph)*.12; it.body.rotation.y += dt*1.6;
    if (Math.hypot(it.x-p.x,it.y-p.y) > .9) continue;
    it.taken = true; it.g.visible = false;
    if (it.type==='weapon'){
      if (p.inv.includes(it.key)){ p.dmgMul*=1.08; say(WEAPONS[it.key].name+' schon vorhanden: Waffen-Upgrade +8% Schaden',3); }
      else { p.inv.push(it.key); say('Aufgenommen: '+WEAPONS[it.key].name,2.5); }
    } else {
      say(GEAR[it.key].name+' ('+GEAR[it.key].text+')',2.5);
      if (it.key==='vest') p.armor=Math.min(100,p.armor+50);
      if (it.key==='helmet') p.armor=Math.min(100,p.armor+25);
      if (it.key==='medkit') p.hp=Math.min(p.maxhp,p.hp+40);
      if (it.key==='boots') p.speedMul*=1.15;
      if (it.key==='gloves') p.dmgMul*=1.15;
    }
    for (let i=0;i<16;i++) puff(it.x,1,it.y,rnd(-3,3),rnd(1,5),rnd(-3,3),.5,0xffffff,.1,8);
  }
  if (Math.hypot(p.x-CROSSES[level],p.y) < 2) openSelect();
}

function updateArena(dt){
  const p = player;
  const d = Math.hypot(p.x,p.y); if (d>ARENA_R-.5){ p.x*=(ARENA_R-.5)/d; p.y*=(ARENA_R-.5)/d; }
  for (const pl of pillars){ const dx=p.x-pl.x, dy=p.y-pl.y, dd=Math.hypot(dx,dy), m=pl.r+.4; if (dd<m){ p.x=pl.x+dx/dd*m; p.y=pl.y+dy/dd*m; } }
  if (!boss || boss.hp<=0 || state==='win') return;
  const b = boss, L = b.L; b.hit-=dt; b.t-=dt; b.mt+=dt;
  if (b.hp<b.maxhp/2 && b.phase===1){ b.phase=2; say(L.name+' rastet aus!',2.5); shake=14; }
  const f = L.f * (b.phase===2 ? 1.4 : 1);
  const toP = Math.atan2(p.y-b.y,p.x-b.x);
  if (b.mode!=='charge' || b.t>0) b.ang = toP;
  let moving = false;
  if (b.mode==='idle'){
    moving = true;
    b.x+=Math.cos(toP)*1.7*f*dt; b.y+=Math.sin(toP)*1.7*f*dt;
    if (b.t<=0){
      const opts = ['ring','burst','charge']; if (L.spiral) opts.push('spiral'); if (L.slam) opts.push('slam');
      b.mode = opts[(Math.random()*opts.length)|0]; b.mt=0; b.count=0;
      b.t = b.mode==='charge' ? .9/f : 0;
      if (b.mode==='slam'){ b.sx=b.x; b.sy=b.y; b.tx=p.x; b.ty=p.y; b.dur=1.1/L.f; b.t=b.dur; slamRing.visible=slamFill.visible=true; slamRing.position.set(b.tx,.15,b.ty); slamFill.position.set(b.tx,.14,b.ty); }
    }
  } else if (b.mode==='ring'){
    if (b.t<=0){ const n=L.ringN+(b.phase===2?6:0), off=b.count*.2;
      for (let i=0;i<n;i++) bossShoot(i/n*6.283+off, 6+b.count*.3+L.f);
      b.count++; b.t=.55/f; if (b.count>=3){ b.mode='idle'; b.t=1.4/f; } }
  } else if (b.mode==='burst'){
    if (b.t<=0){ const sn=L.spread+(b.phase===2?1:0); for (let k=-sn;k<=sn;k++) bossShoot(toP+k*.15,10+L.f*1.5,8);
      b.count++; b.t=.17/f; if (b.count>=12){ b.mode='idle'; b.t=1.2/f; } }
  } else if (b.mode==='spiral'){
    if (b.t<=0){ for (let k=0;k<3;k++) bossShoot(b.count*.34+k*2.094,7+L.f,7); b.count++; b.t=.07/f; if (b.count>=48){ b.mode='idle'; b.t=1.2/f; } }
  } else if (b.mode==='slam'){
    const u = 1 - clamp(b.t/b.dur,0,1);
    b.x = b.sx+(b.tx-b.sx)*u; b.y = b.sy+(b.ty-b.sy)*u; b.z = Math.sin(u*Math.PI)*6;
    slamFill.material.opacity = .15+.25*u;
    if (b.t<=0){
      b.z=0; shake=16; slamRing.visible=slamFill.visible=false;
      for (let i=0;i<40;i++){ const a=rnd(0,6.28), s=rnd(3,12); puff(b.x,.2,b.y,Math.cos(a)*s,rnd(1,5),Math.sin(a)*s,rnd(.4,.9),0x9a8a7a,rnd(.15,.4),9); }
      if (Math.hypot(p.x-b.x,p.y-b.y) < 4.2) hurtPlayer(30*L.dmg);
      for (let i=0;i<18;i++) bossShoot(i/18*6.283,8,6);
      b.mode='idle'; b.t=1.2/f;
    }
  } else if (b.mode==='charge'){
    moving = b.t<0;
    if (b.t>0){ b.vx=Math.cos(toP); b.vy=Math.sin(toP); }
    else {
      b.x+=b.vx*15.5*f*dt; b.y+=b.vy*15.5*f*dt;
      if (b.t<-.7/f || Math.hypot(b.x,b.y)>ARENA_R-b.r-.2){ b.mode='idle'; b.t=1.1/f; shake=10; }
      if (Math.hypot(b.x-p.x,b.y-p.y)<b.r+.4) hurtPlayer(25*L.dmg);
    }
  }
  const bd=Math.hypot(b.x,b.y); if (bd>ARENA_R-b.r){ b.x*=(ARENA_R-b.r)/bd; b.y*=(ARENA_R-b.r)/bd; }
  for (const pl of pillars){ const dx=b.x-pl.x, dy=b.y-pl.y, dd=Math.hypot(dx,dy), m=pl.r+b.r; if (dd<m){ b.x=pl.x+dx/dd*m; b.y=pl.y+dy/dd*m; } }
  if (b.mode!=='charge' && b.mode!=='slam' && Math.hypot(b.x-p.x,b.y-p.y)<b.r+.5) hurtPlayer(40*dt*L.dmg);
  walkPh += dt*(moving ? 5.5*Math.min(1.8,f) : 1.2);
}

// ============================================================ Rendering
function syncModels(){
  const p = player;
  ph.g.position.set(p.x, 0, p.y);
  if (state==='teleport'){
    const t = tele.t; ph.g.position.y = t*1.6; ph.g.rotation.y = -p.ang + t*9; ph.g.scale.setScalar(Math.max(.01,1-t*.35));
    tbeam.visible = true; tbeam.position.set(p.x,15,p.y); tbeam.scale.set(1+Math.sin(t*20)*.1,1,1+Math.sin(t*20)*.1);
  } else ph.g.rotation.y = -p.ang;
  const sw = Math.sin(p.step)*.7; ph.legL.rotation.z = sw; ph.legR.rotation.z = -sw;
  kick = Math.max(0, kick - dtLast*7); ph.mount.position.x = .5 - kick*.1; ph.mount.rotation.z = kick*.06;
  flashT -= dtLast; if (flashT <= 0) muzzleLight.intensity = 0;
  ph.jacket.color.copy(C(p.hurt>0 ? 0xff5555 : PLAYER_LOOK.jacket));
  ph.g.visible = !(p.invuln>0 && Math.floor(time*20)%2 && state!=='teleport');
  if (state==='lose') ph.g.rotation.z = Math.min(1.5,(ph.g.rotation.z||0)+.04);

  if (boss && mon){
    mon.g.position.set(boss.x, boss.z||0, boss.y);
    if (state==='win'||state==='back'){
      if (state==='back') deadT = Math.max(deadT,3); else deadT += dtLast; mon.g.rotation.z = Math.min(1.45,deadT*.9); mon.g.position.y = -Math.min(1.5,deadT*.5);
      if (Math.random()<.5) puff(boss.x+rnd(-1.5,1.5),rnd(0,2),boss.y+rnd(-1.5,1.5),0,rnd(1,4),0,.8,[0xffd24a,0xff4a8a][(Math.random()*2)|0],.2);
    } else {
      mon.g.rotation.y = -boss.ang; mon.anim.call(mon,boss,walkPh,dtLast); mon.g.position.y += (mon.bob||0);
    }
    const em = boss.hit>0 ? 0xffffff : (boss.phase===2 ? 0x551010 : 0x000000);
    mon.mats.forEach(m => m.emissive.copy(C(em)));
    const tel = boss.mode==='charge' && boss.t>0 && state==='arena';
    telegraph.visible = tel;
    if (tel){ telegraph.position.set(boss.x+boss.vx*7,.14,boss.y+boss.vy*7); telegraph.rotation.z = Math.atan2(boss.vy,boss.vx); telegraph.scale.set(14,boss.r*2,1); }
  }
}
let dtLast = .016;
function updateCamera(){
  const p = player, a = p.ang;
  const dx=Math.cos(a), dz=Math.sin(a), rx=-dz, rz=dx;
  const dist = 4.6, hd = Math.cos(camPitch)*dist, hy = 1.6 + Math.sin(camPitch)*dist*1.1;
  let cx = p.x + rx*.34 - dx*hd, cz = p.y + rz*.34 - dz*hd;
  if (boss && mon){ const d=Math.hypot(cx,cz); if (d>ARENA_R-.4){ cx*=(ARENA_R-.4)/d; cz*=(ARENA_R-.4)/d; } }
  else { const lim = nearCross(cx,2.8) ? 15 : 4.5; cz = clamp(cz,-lim,lim); cx = clamp(cx,STREET_START-3,STREET_END+4); }
  const s = shake*.03;
  camera.position.set(cx+rnd(-s,s), hy+rnd(-s,s), cz+rnd(-s,s));
  camera.lookAt(p.x+rx*.34+dx*12, 1.6, p.y+rz*.34+dz*12);
  sun.position.set(p.x+24,34,p.y+18); sun.target.position.set(p.x,0,p.y); sun.target.updateMatrixWorld();
}

// ============================================================ HUD
function bar(x,y,w,h,v,col,label){
  hud.fillStyle='rgba(0,0,0,.6)'; hud.fillRect(x-2,y-2,w+4,h+4);
  hud.fillStyle=col; hud.fillRect(x,y,w*clamp(v,0,1),h);
  hud.fillStyle='#fff'; hud.font='bold 11px sans-serif'; hud.textAlign='left'; hud.textBaseline='middle';
  hud.fillText(label,x+6,y+h/2+1);
}
function fadeAlpha(){
  let a = fadeExtra;
  if (state==='teleport' && tele.t>1.6) a = Math.max(a,Math.min(1,(tele.t-1.6)/.6));
  if (state==='back' && back) a = Math.max(a, back.t<1 ? back.t : 2-back.t);
  return a;
}
function drawHUD(){
  hud.clearRect(0,0,W,H);
  if (!player) return;
  const p = player;
  const fa = fadeAlpha(); if (fa>0){ hud.fillStyle=`rgba(255,255,255,${fa})`; hud.fillRect(0,0,W,H); }
  if (state==='intro') return;
  bar(20,20,220,18,p.hp/p.maxhp,'#d33b3b','LEBEN '+Math.ceil(p.hp));
  bar(20,46,220,12,p.armor/100,'#3b8bd3','RÜSTUNG '+Math.ceil(p.armor));
  bar(20,68,220,6,1-clamp(p.dashCd,0,1),'#7be07b','');
  hud.fillStyle='#fff'; hud.font='bold 15px sans-serif'; hud.textAlign='left'; hud.textBaseline='alphabetic';
  hud.fillText(WEAPONS[p.weapon].name,20,100);
  hud.font='13px sans-serif'; hud.fillText('Gegner '+Math.min(level+1,LEVELS.length)+' von '+LEVELS.length,20,120);
  if (state==='street'){
    hud.fillText('Waffen in diesem Abschnitt: '+p.inv.length+' von '+LEVELS[level].weapons.length+'   ·   Schaden x'+p.dmgMul.toFixed(2),20,140);
    const c0 = level>0 ? CROSSES[level-1] : 0, c1 = CROSSES[level];
    const prog = clamp((p.x-c0)/(c1-c0),0,1);
    hud.fillStyle='rgba(0,0,0,.6)'; hud.fillRect(W/2-150,18,300,10); hud.fillStyle='#ffd24a'; hud.fillRect(W/2-150,18,300*prog,10);
    hud.fillStyle='#fff'; hud.textAlign='center'; hud.fillText('Weg zur Kreuzung '+(level+1)+' ('+LEVELS[level].name+')',W/2,44);
  }
  if ((state==='arena'||state==='win') && boss){
    const bw = Math.min(600,W-80);
    hud.fillStyle='rgba(0,0,0,.65)'; hud.fillRect(W/2-bw/2-3,18,bw+6,22);
    hud.fillStyle = boss.phase===2?'#e2335a':'#c83a6a'; hud.fillRect(W/2-bw/2,21,bw*clamp(boss.hp/boss.maxhp,0,1),16);
    hud.fillStyle='#fff'; hud.font='bold 13px sans-serif'; hud.textAlign='center'; hud.fillText(boss.L.name.toUpperCase(),W/2,56);
    const v = new THREE.Vector3(boss.x,1.8,boss.y).project(camera);
    const off = v.z>1 || Math.abs(v.x)>.95 || Math.abs(v.y)>.95;
    if (off && boss.hp>0){
      let sx = v.x, sy = v.y; if (v.z>1){ sx=-sx; sy=-sy; }
      const m = Math.max(Math.abs(sx),Math.abs(sy))||1; sx/=m; sy/=m;
      const px = W/2+sx*(W/2-40), py = H/2-sy*(H/2-40), ang = Math.atan2(-sy,sx);
      hud.save(); hud.translate(px,py); hud.rotate(ang); hud.fillStyle='#ff4a8a'; hud.beginPath(); hud.moveTo(16,0); hud.lineTo(-10,-12); hud.lineTo(-10,12); hud.fill(); hud.restore();
    }
  }
  if (state==='street'||state==='arena'){
    const cx=W/2, cy=H/2; hud.strokeStyle='#fff'; hud.lineWidth=2; hud.beginPath(); hud.arc(cx,cy,9,0,7);
    hud.moveTo(cx-15,cy); hud.lineTo(cx-5,cy); hud.moveTo(cx+5,cy); hud.lineTo(cx+15,cy); hud.moveTo(cx,cy-15); hud.lineTo(cx,cy-5); hud.moveTo(cx,cy+5); hud.lineTo(cx,cy+15); hud.stroke();
    if (!locked()){ hud.fillStyle='#ffd24a'; hud.font='bold 18px sans-serif'; hud.textAlign='center'; hud.fillText('Klicke ins Spiel, um die Maus zu steuern',W/2,H/2+80); }
  }
  hud.textAlign='center'; hud.font='bold 17px sans-serif';
  msgs.slice(-3).forEach((m,i)=>{ hud.globalAlpha=clamp(m.life,0,1); hud.fillStyle='rgba(0,0,0,.55)';
    const tw = hud.measureText(m.t).width; hud.fillRect(W/2-tw/2-10,H-110+i*30-18,tw+20,26);
    hud.fillStyle='#fff'; hud.textBaseline='alphabetic'; hud.fillText(m.t,W/2,H-110+i*30); });
  hud.globalAlpha=1;
}

// ============================================================ Loop
let last = performance.now();
function loop(now){
  const dt = Math.min(.05,(now-last)/1000); last = now; dtLast = dt;
  if (player){ update(dt); syncModels(); updateCamera(); }
  renderer.render(scene,camera); drawHUD();
  requestAnimationFrame(loop);
}
newGame(); state='intro'; ov.style.display='flex';
ov.innerHTML = `<h1>Straßenkampf 3D</h1>
  <p>Lauf die Straße entlang, sammle Waffen und Ausrüstung, wähle an der Kreuzung deine Waffe<br>und stelle dich dem Monster. Danach geht es weiter zum nächsten, stärkeren Gegner.</p>
  <p style="color:#9ab">WASD bewegen · Maus drehen und zielen · Linksklick schießen · Leertaste Ausweichrolle<br>Ohne Maussteuerung: Pfeiltasten links/rechts drehen</p>
  <button class="big" onclick="startGame()">Spiel starten</button>`;
requestAnimationFrame(loop);
</script>
