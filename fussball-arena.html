<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fußball-Arena</title>
<style>
  :root { --ink:#0B2545; --blue:#2563EB; --blue2:#60A5FA; --amber:#F59E0B; --text:#E8F0FF; --muted:#9DB3D9; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: radial-gradient(ellipse at top, #16325f 0%, #0b1a33 60%, #060f20 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px;
  }
  /* Spielfeld passt sich immer an Breite UND Höhe des Fensters an */
  #wrap { position: relative; width: min(calc(100vw - 16px), calc((100vh - 46px) * 1200 / 760)); aspect-ratio: 1200 / 760; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #info { margin-top: 8px; font-size: 13px; color: var(--muted); text-align: center; }
  #info b { color: var(--text); }

  /* Menüs liegen über dem Spielfeld */
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,14,32,.45); border-radius: 12px; }
  .panel { background: linear-gradient(180deg, rgba(22,48,96,.97), rgba(11,37,69,.97));
    border: 1px solid rgba(96,165,250,.4); border-radius: 18px; padding: 20px 28px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55); width: min(640px, 92%); max-height: 94%; overflow: auto; text-align: center; }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 44px); font-family: "Trebuchet MS", Arial, sans-serif; letter-spacing: .5px; }
  h1 span { color: var(--amber); }
  .sub { margin: 2px 0 14px; color: var(--muted); font-size: 15px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; flex-wrap: wrap; }
  .opt > span { font-weight: 600; min-width: 90px; text-align: left; }
  .seg { display: flex; background: rgba(0,0,0,.3); border-radius: 999px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .seg button:hover { background: rgba(255,255,255,.08); }
  .seg button.on { background: var(--blue); color: #fff; font-weight: 700; box-shadow: 0 2px 10px rgba(37,99,235,.5); }
  .big { margin-top: 14px; border: 0; border-radius: 999px; padding: 12px 34px; font: inherit; font-size: 19px; font-weight: 800;
    background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #1f1300; cursor: pointer; box-shadow: 0 6px 18px rgba(245,158,11,.4); }
  .big:hover { transform: scale(1.04); }
  .big.alt { background: rgba(255,255,255,.12); color: var(--text); box-shadow: none; font-size: 16px; padding: 10px 24px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  th, td { padding: 5px 8px; border-top: 1px solid rgba(255,255,255,.1); text-align: left; }
  th { color: var(--blue2); font-weight: 700; }
  kbd { background: rgba(255,255,255,.14); border-radius: 5px; padding: 1px 6px; font: inherit; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .result { font-size: clamp(40px, 7vw, 72px); font-weight: 900; margin: 6px 0; }
  .stats { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px 16px; max-width: 360px; margin: 10px auto 0; font-size: 15px; }
  .stats div:nth-child(3n+1) { text-align: right; font-weight: 700; }
  .stats div:nth-child(3n+2) { color: var(--muted); }
  .stats div:nth-child(3n) { text-align: left; font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- Startmenü -->
  <div id="menu" class="overlay">
    <div class="panel">
      <h1>⚽ Fußball-<span>Arena</span></h1>
      <div class="sub">4 gegen 4 in der Halle · mit Torwart, Pässen und Bande</div>
      <div class="opt"><span>Spieler</span>
        <div class="seg" data-key="mode"><button data-v="1">1 Spieler gegen KI</button><button data-v="2">2 Spieler</button></div></div>
      <div class="opt" id="optLevel"><span>KI-Stärke</span>
        <div class="seg" data-key="level"><button data-v="leicht">Leicht</button><button data-v="mittel">Mittel</button><button data-v="schwer">Schwer</button></div></div>
      <div class="opt"><span>Spielzeit</span>
        <div class="seg" data-key="minutes"><button data-v="2">2 Min</button><button data-v="3">3 Min</button><button data-v="5">5 Min</button></div></div>
      <button class="big" id="start">Anpfiff!</button>
      <table id="ctrlTable"></table>
      <div class="hint">Enter: Anpfiff · P: Pause · M: Ton an/aus · Gamepad geht auch</div>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="overlay" hidden>
    <div class="panel">
      <h1>Pause</h1>
      <button class="big" id="resume">Weiter (P)</button><br>
      <button class="big alt" id="quit">Zum Menü</button>
    </div>
  </div>

  <!-- Spielende -->
  <div id="over" class="overlay" hidden>
    <div class="panel">
      <h1 id="overTitle">Abpfiff</h1>
      <div class="result" id="overScore">0 : 0</div>
      <div class="stats" id="overStats"></div>
      <button class="big" id="again">Revanche (Enter)</button><br>
      <button class="big alt" id="toMenu">Zum Menü (Esc)</button>
    </div>
  </div>
</div>
<div id="info"></div>

<script>
'use strict';
// =====================================================================
//  FUSSBALL-ARENA
//  Draufsicht, 4 gegen 4 (Torwart, Abwehr, zwei Stürmer), Hallenfußball mit Bande.
//  Alles in einer Datei: Spiellogik, KI, Grafik und Ton.
// =====================================================================

// ---------- Größen (in Spiel-Pixeln, die Anzeige wird automatisch skaliert) ----------
const W = 1200, H = 760;
const L = 90, R = 1110, T = 100, B = 700;          // Spielfeldränder
const CX = (L + R) / 2, MID = (T + B) / 2;           // Mittelpunkt
const GOAL_W = 180, GT = MID - GOAL_W / 2, GB = MID + GOAL_W / 2, GDEPTH = 44;
const BAR = 44, POST_R = 5;                          // Lattenhöhe, Pfostendicke
const BOX_W = 150, BOX_H = 330, SBOX_W = 55, SBOX_H = 190, CIRCLE_R = 80;
const PLAYER_R = 15, BALL_R = 7, PLAYER_H = 26, GRAV = 0.32;
const HUMAN_SPEED = 4.1, DRIBBLE = 0.88;             // Tempo des Menschen, mit Ball etwas langsamer
const POSTS = [[L, GT], [L, GB], [R, GT], [R, GB]];
const TAU = Math.PI * 2;

// ---------- Schwierigkeit der KI ----------
// speed: Lauftempo · react: wie schnell sie reagiert · aim: Ungenauigkeit beim Schuss
// steal: Chance pro Bild, den Ball zu erobern · range: Schussentfernung · gk: Torwart-Können
// slide: Chance auf Grätsche · pass: wie oft sie passt · think: Bilder Bedenkzeit am Ball · shot: maximale Schusskraft
const DIFF = {
  leicht: { speed: 3.0,  react: 0.10, aim: 75, steal: 0.025, range: 250, gk: 0.55, slide: 0,     pass: 0.006, think: 32, shot: 0.65 },
  mittel: { speed: 3.55, react: 0.18, aim: 42, steal: 0.05,  range: 320, gk: 0.75, slide: 0.006, pass: 0.010, think: 18, shot: 0.85 },
  schwer: { speed: 3.95, react: 0.30, aim: 18, steal: 0.08,  range: 370, gk: 0.90, slide: 0.015, pass: 0.016, think: 10, shot: 1.0 },
};

// ---------- Teams ----------
const TEAM = [
  { name: 'Blau', shirt: '#2563eb', dark: '#1e3a8a', light: '#93c5fd', gk: '#f59e0b', gkDark: '#92400e',
    fans: ['#2563eb', '#3b82f6', '#1d4ed8', '#60a5fa', '#ffffff'] },
  { name: 'Rot', shirt: '#dc2626', dark: '#7f1d1d', light: '#fca5a5', gk: '#a855f7', gkDark: '#581c87',
    fans: ['#dc2626', '#ef4444', '#b91c1c', '#f87171', '#ffffff'] },
];
const ROLES = ['gk', 'def', 'attT', 'attB'], NUMS = [1, 4, 9, 10];
const HAIR = ['#2b1d0e', '#4a2c12', '#111', '#8d5a2b', '#d4a24c', '#6b3a1e', '#1a1a1a'];
const SKIN = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac', '#f5cfa0'];

// ---------- kleine Helfer ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const attackDir = t => t === 0 ? 1 : -1;           // Blau spielt nach rechts, Rot nach links
const ownGoalX = t => t === 0 ? L : R;
const oppGoalX = t => t === 0 ? R : L;
function segDist(px, py, ax, ay, bx, by) {          // Abstand Punkt zu Strecke (für Passwege)
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
  const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
  return Math.hypot(px - ax - vx * t, py - ay - vy * t);
}

// ---------- Canvas (scharf auf Retina-Bildschirmen) ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
function makeCanvas() { const c = document.createElement('canvas'); c.width = W * DPR; c.height = H * DPR; const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; }

// =====================================================================
//  TON (wird erst beim ersten Tastendruck gestartet, so wollen es die Browser)
// =====================================================================
let actx = null, master = null, noiseBuf = null, crowdGain = null, muted = false;
try { muted = localStorage.getItem('arena-muted') === '1'; } catch (e) {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Zuschauer-Rauschen im Hintergrund
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 650; f.Q.value = 0.6;
    crowdGain = actx.createGain(); crowdGain.gain.value = 0;
    src.connect(f).connect(crowdGain).connect(master); src.start();
  } catch (e) { actx = null; }
}
const canSound = () => actx && state !== 'menu';
function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function noise(t, dur, type, freq, q, peak, a = 0.005) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain(); env(g, t, peak, a, dur);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + a + dur + 0.05);
  return f;
}
function tone(t, type, freq, dur, peak, toFreq) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  const g = actx.createGain(); env(g, t, peak, 0.004, dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  whistle(times = 1, len = 0.32) {
    if (!canSound()) return;
    for (let i = 0; i < times; i++) {
      const t = actx.currentTime + i * (len + 0.12), dur = i === times - 1 && times > 1 ? len * 2 : len;
      const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = 2750;
      const lfo = actx.createOscillator(); lfo.frequency.value = 38; const lg = actx.createGain(); lg.gain.value = 140;
      lfo.connect(lg).connect(o.frequency);
      const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.setValueAtTime(0.18, t + dur); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
      o.connect(g).connect(master); o.start(t); lfo.start(t); o.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
    }
  },
  kick(p = 0.5) { if (!canSound()) return; const t = actx.currentTime; tone(t, 'sine', 160, 0.12, 0.25 + p * 0.5, 50); noise(t, 0.05, 'lowpass', 1400, 0.7, 0.15 + p * 0.3); },
  wood() { if (!canSound()) return; const t = actx.currentTime; tone(t, 'triangle', 1180, 0.6, 0.25); tone(t, 'triangle', 1770, 0.45, 0.15); this.ooh(); },
  catch() { if (!canSound()) return; const t = actx.currentTime; noise(t, 0.08, 'lowpass', 600, 0.8, 0.5); },
  punch() { if (!canSound()) return; const t = actx.currentTime; tone(t, 'sine', 220, 0.1, 0.5, 80); noise(t, 0.06, 'lowpass', 900, 0.8, 0.4); },
  slide() { if (!canSound()) return; const t = actx.currentTime; const f = noise(t, 0.35, 'bandpass', 2500, 0.8, 0.12, 0.03); f.frequency.exponentialRampToValueAtTime(700, t + 0.35); },
  board() { if (!canSound()) return; const t = actx.currentTime; tone(t, 'square', 90, 0.12, 0.12, 60); noise(t, 0.1, 'lowpass', 500, 0.7, 0.2); },
  ooh() { if (!canSound()) return; const t = actx.currentTime; const f = noise(t, 1.1, 'bandpass', 520, 1.2, 0.35, 0.15); f.frequency.exponentialRampToValueAtTime(330, t + 1.2); },
  goal() {
    if (!canSound()) return; const t = actx.currentTime;
    noise(t, 2.6, 'bandpass', 950, 0.5, 0.75, 0.25); noise(t + 0.1, 2.2, 'bandpass', 2100, 0.7, 0.3, 0.3);
    [523, 659, 784, 1047].forEach((f, i) => tone(t + 0.05 + i * 0.12, 'square', f, 0.22, 0.08));
  },
};
function setCrowd(level) { if (actx && crowdGain) crowdGain.gain.setTargetAtTime(muted ? 0 : level, actx.currentTime, 0.4); }
function toggleMute() {
  muted = !muted; try { localStorage.setItem('arena-muted', muted ? '1' : '0'); } catch (e) {}
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, actx.currentTime, 0.02);
  floatText(W / 2, H - 30, muted ? 'Ton aus' : 'Ton an', '#fff', true);
}

// =====================================================================
//  EINGABE (Tastatur und Gamepad)
// =====================================================================
const keys = {}, latch = {};   // latch: auch ganz kurze Tipper werden mitgezählt
const KEYMAP = {
  solo: { up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], shoot: ['Space'], lob: ['KeyE'] },
  p1:   { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], shoot: ['Space'], lob: ['KeyE'] },
  p2:   { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], shoot: ['Enter', 'NumpadEnter'], lob: ['ShiftRight', 'Numpad0'] },
};
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'NumpadEnter', 'ShiftRight', 'Numpad0']);
const prevIn = [{ shoot: false, lob: false }, { shoot: false, lob: false }];
let inputs = [null, null];

function padState(i) {
  try {
    const gp = navigator.getGamepads && navigator.getGamepads()[i];
    if (!gp) return null;
    const b = n => !!(gp.buttons[n] && gp.buttons[n].pressed);
    let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.hypot(ax, ay) < 0.25) ax = ay = 0;
    ax += (b(15) ? 1 : 0) - (b(14) ? 1 : 0); ay += (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
    return { ax, ay, shoot: b(0) || b(2), lob: b(1) || b(3), start: b(9) };
  } catch (e) { return null; }
}
function readInput(ix) {
  const m = settings.mode === 1 ? KEYMAP.solo : (ix === 0 ? KEYMAP.p1 : KEYMAP.p2);
  const any = arr => arr.some(c => keys[c] || latch[c]);
  let ax = any(m.right) - any(m.left), ay = any(m.down) - any(m.up);
  let shoot = any(m.shoot), lob = any(m.lob);
  const pd = padState(ix);
  if (pd) { if (pd.ax || pd.ay) { ax = pd.ax; ay = pd.ay; } shoot = shoot || pd.shoot; lob = lob || pd.lob; }
  const r = { ax, ay, shoot, lob, shootP: shoot && !prevIn[ix].shoot, lobP: lob && !prevIn[ix].lob, start: pd && pd.start };
  prevIn[ix] = { shoot, lob };
  return r;
}

addEventListener('keydown', e => {
  initAudio();
  const playing = state !== 'menu';
  if (GAME_KEYS.has(e.code) && playing) e.preventDefault();
  if (e.repeat) return;
  if (!keys[e.code]) latch[e.code] = true;
  keys[e.code] = true;

  if (state === 'menu' && e.code === 'Enter') { e.preventDefault(); startMatch(); }
  else if (state === 'over' && e.code === 'Enter') { e.preventDefault(); startMatch(); }
  else if (state === 'over' && e.code === 'Escape') showMenu();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (['play', 'kickoff'].includes(state)) togglePause(); });
addEventListener('pointerdown', initAudio);

// =====================================================================
//  SPIELZUSTAND
// =====================================================================
let settings = { mode: 1, level: 'mittel', minutes: 3 };
try { Object.assign(settings, JSON.parse(localStorage.getItem('arena-settings') || '{}')); } catch (e) {}

let state = 'menu';        // menu (Demo läuft im Hintergrund) | kickoff | play | goal | replay | pause | over
let pausedFrom = null, stateT = 0, frame = 0;
let teams = [], players = [], ghosts = [], ball;
let score = [0, 0], clock = 0, golden = false, kickTeam = 0, goalInfo = null;
let stats = { shots: [0, 0], passes: [0, 0], poss: [0, 0] };
let particles = [], floats = [], shake = 0, crowdJump = [0, 0], trail = [];
const nets = [{ y: MID, amt: 0 }, { y: MID, amt: 0 }];
const chaser = [null, null];
let rec = [], replayPos = 0, replayStart = 0;   // Aufnahme für die Torwiederholung
const REC_MAX = 360;

function makePlayer(team, i) {
  return {
    team, role: ROLES[i], num: NUMS[i], r: PLAYER_R, hair: pick(HAIR), skin: pick(SKIN),
    x: 0, y: 0, vx: 0, vy: 0, fx: attackDir(team), fy: 0, tx: 0, ty: 0, anim: 0,
    noTouch: 0, protect: 0, slide: 0, recover: 0, stun: 0, kickAnim: 0, expect: 0,
    charge: 0, chargeLob: false, holding: false, holdT: 0, aiHold: 0, dive: 0,
  };
}
function skill(p) { return DIFF[teams[p.team].level]; }
function isHumanCtrl(p) { const t = teams[p.team]; return t.human >= 0 && t.ctrl === p; }
function inOwnBox(p) { return Math.abs(p.x - ownGoalX(p.team)) < BOX_W + 6 && Math.abs(p.y - MID) < BOX_H / 2 + 6; }

function createTeams(demo) {
  teams = [0, 1].map(i => ({
    idx: i, ctrl: null, switchCd: 0,
    human: demo ? -1 : (i === 0 ? 0 : (settings.mode === 2 ? 1 : -1)),
    // die eigenen KI-Mitspieler sind immer "mittel", der KI-Gegner hat die gewählte Stärke
    level: demo ? 'mittel' : (i === 1 && settings.mode === 1 ? settings.level : 'mittel'),
  }));
  players = [];
  for (const t of [0, 1]) for (let i = 0; i < 4; i++) players.push(makePlayer(t, i));
  ghosts = players.map(p => Object.create(p));   // Kopien für die Wiederholung
}

// Aufstellung zum Anstoß. starter = Team mit Anstoß
function setupKickoff(starter) {
  kickTeam = starter;
  const fw = R - L, fh = (B - T) / 2;
  const K = { gk: [0.025, 0], def: [0.18, 0], attT: [0.40, -0.38], attB: [0.40, 0.38] };
  for (const p of players) {
    const s = attackDir(p.team), [fx, fy] = K[p.role];
    Object.assign(p, { x: ownGoalX(p.team) + s * fx * fw, y: MID + fy * fh, vx: 0, vy: 0, fx: s, fy: 0,
      noTouch: 0, protect: 0, slide: 0, recover: 0, stun: 0, kickAnim: 0, expect: 0, charge: 0, holding: false, dive: 0 });
    if (p.team === starter && p.role === 'attT') { p.x = CX - s * 21; p.y = MID; }
    p.tx = p.x; p.ty = p.y;
  }
  ball = { x: CX, y: MID, z: 0, vx: 0, vy: 0, vz: 0, r: BALL_R, rot: 0, ux: 1, uy: 0, owner: null, lastTouch: starter, lastPlayer: null, err: 0 };
  for (const t of teams) {
    t.switchCd = 0; t.manual = false;
    t.ctrl = players.find(p => p.team === t.idx && p.role === 'attT');
  }
  nets[0].amt = nets[1].amt = 0; trail = []; rec = [];
}

function startDemo() {
  createTeams(true); score = [0, 0]; setupKickoff(0);
  state = 'menu'; stateT = 0;
}
function startMatch() {
  initAudio();
  hideOverlays(); document.activeElement && document.activeElement.blur();
  createTeams(false);
  score = [0, 0]; golden = false; clock = settings.minutes * 60 * 60;
  stats = { shots: [0, 0], passes: [0, 0], poss: [0, 0] };
  particles = []; floats = [];
  beginKickoff(0);
  updateInfo();
}
function beginKickoff(starter) {
  setupKickoff(starter);
  state = 'kickoff'; stateT = 0;
}

// =====================================================================

function integrate(p) {
  p.x = clamp(p.x + p.vx, L + p.r, R - p.r);
  p.y = clamp(p.y + p.vy, T + p.r, B - p.r);
  p.anim += Math.hypot(p.vx, p.vy) * 0.13;
}
// Richtung (ax, ay) laufen. acc = wie schnell beschleunigt wird, turn = wie schnell man sich dreht
function steer(p, ax, ay, spd, acc = 0.2, turn = 0.3) {
  let len = Math.hypot(ax, ay);
  if (len > 1) { ax /= len; ay /= len; len = 1; }
  p.vx += (ax * spd - p.vx) * acc;
  p.vy += (ay * spd - p.vy) * acc;
  if (len > 0.15) turnTo(p, ax, ay, turn);
  integrate(p);
}
// Blickrichtung drehen (über den Winkel, damit auch eine 180°-Drehung klappt)

  const na = a + d * k; p.fx = Math.cos(na); p.fy = Math.sin(na);
}
function moveTo(p, tx, ty, spd) {
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  if (d < 4) { steer(p, 0, 0, spd, 0.15); turnTo(p, ball.x - p.x, ball.y - p.y, 0.12); return; }
  const k = Math.min(1, d / 30);   // kurz vor dem Ziel abbremsen
  steer(p, dx / d * k, dy / d * k, spd, 0.15, 0.25);
}
function separatePlayers() {
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
    const a = players[i], b = players[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d < min && d > 0.01) {

}

  sfx.slide(); burst(p.x, p.y, 8, ['#7fbf6a', '#a3d48f', '#5a3a1a'], 2, 25);
}

// =====================================================================
//  BALL

function give(p) {

  p.protect = 18; p.aiHold = 0; p.holdT = 0; p.holding = false;
  for (const m of players) if (m.team === p.team) m.expect = 0;
  const t = teams[p.team];

}
function kickBall(p, dx, dy, speed, vz = 0) {
  const d = Math.hypot(dx, dy) || 1;
  ball.owner = null; p.holding = false;
  ball.vx = dx / d * speed; ball.vy = dy / d * speed; ball.vz = vz;
  ball.err = rand(-1, 1);               // so verschätzt sich der Torwart diesmal
  ball.lastTouch = p.team; ball.lastPlayer = p;
  for (const t of teams) t.manual = false;   // nach jedem Schuss/Pass wieder automatisch wechseln
  p.fx = dx / d; p.fy = dy / d; p.noTouch = 14; p.kickAnim = 10;
  sfx.kick(speed / 23);

}
// Zielhilfe: Zeigt der Schuss ungefähr aufs Tor, wird er ins Tor gelenkt
function aimDir(p, lob) {
  let dx = p.fx, dy = p.fy;
  if (lob) return [dx, dy];
  const s = attackDir(p.team), gx = oppGoalX(p.team);
  if (dx * s > 0.3 && Math.abs(gx - p.x) < 600) {
    const hitY = p.y + dy * (gx - p.x) / dx;
    if (hitY > GT - 80 && hitY < GB + 80) {

}
function shootBall(p, power, lob) {

  else kickBall(p, dx, dy, 9 + power * 14, 0);
}
function shootAt(p, tx, ty, power) {

}
// Bester Mitspieler für einen Pass in Richtung (dx, dy)
function bestMate(p, dx, dy, minDot) {
  const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;

    if (m.team !== p.team || m === p || m.role === 'gk' || m.stun > 0) continue;
    const vx = m.x - p.x, vy = m.y - p.y, d = Math.hypot(vx, vy);
    if (d < 50 || d > 650) continue;
    const dot = (vx * dx + vy * dy) / d;
    if (dot < minDot) continue;

    let free = 1e9;
    for (const q of players) {

function passBall(p, lob, target) {
  let m = target;

  stats.passes[p.team]++;
  if (!m) return kickBall(p, p.fx, p.fy, lob ? 8 : 10, lob ? 5 : 0);

  const tx = clamp(m.x + m.vx * lead, L + 20, R - 20), ty = clamp(m.y + m.vy * lead, T + 20, B - 20);

function updateBall(contacts) {
  const o = ball.owner;
  if (o) {
    if (o.holding) {   // Torwart hält den Ball in den Händen
      ball.x = o.x + o.fx * 9; ball.y = o.y + o.fy * 9; ball.z = 8;
      ball.x = clamp(ball.x, L + ball.r, R - ball.r);
    } else {           // Dribbeln: Ball bleibt vor dem Fuß
      const g = o.r + ball.r + 1.5;
      ball.x += (o.x + o.fx * g - ball.x) * 0.5; ball.y += (o.y + o.fy * g - ball.y) * 0.5; ball.z = 0;
    }
    ball.vx = o.vx; ball.vy = o.vy; ball.vz = 0;
    const sp = Math.hypot(o.vx, o.vy); ball.rot += sp / ball.r;
    if (sp > 0.3) { ball.ux = o.vx / sp; ball.uy = o.vy / sp; }
    collideWorld();

  }
  // Schnelle Bälle in kleinen Schritten bewegen, damit sie nicht durch Spieler "tunneln"
  const sp = Math.hypot(ball.vx, ball.vy), n = Math.max(1, Math.ceil(sp / 5));
  for (let i = 0; i < n; i++) {
    ball.x += ball.vx / n; ball.y += ball.vy / n;
    collideWorld();
    if (contacts && ballContacts()) break;
  }
  // Höhe: Schwerkraft und Aufspringen
  if (ball.z > 0 || ball.vz > 0) {
    ball.z += ball.vz; ball.vz -= GRAV;
    if (ball.z <= 0) {
      ball.z = 0;
      if (ball.vz < -1.6) { ball.vz = -ball.vz * 0.5; ball.vx *= 0.88; ball.vy *= 0.88; } else ball.vz = 0;
    }
  }
  const f = ball.z > 0 ? 0.996 : 0.985;   // in der Luft bremst der Ball kaum
  ball.vx *= f; ball.vy *= f;
  const s2 = Math.hypot(ball.vx, ball.vy);
  if (s2 < 0.04) ball.vx = ball.vy = 0;
  ball.rot += s2 / ball.r;
  if (s2 > 0.2) { ball.ux = ball.vx / s2; ball.uy = ball.vy / s2; }
}

function collideWorld() {
  const r = ball.r;
  // Pfosten
  if (ball.z < BAR + 2) for (const [px, py] of POSTS) {
    const dx = ball.x - px, dy = ball.y - py, d = Math.hypot(dx, dy), min = r + POST_R;
    if (d < min && d > 0) {

      if (vn < 0) { ball.vx -= 1.75 * vn * nx; ball.vy -= 1.75 * vn * ny; if (vn < -3 && !ball.owner) hitWood('Pfosten!', px, py); }
    }
  }

  if (ball.y < T + r) { if (ball.vy < -4) sfx.board(); ball.y = T + r; ball.vy = Math.abs(ball.vy) * 0.72; }
  if (ball.y > B - r) { if (ball.vy > 4) sfx.board(); ball.y = B - r; ball.vy = -Math.abs(ball.vy) * 0.72; }

function goalSide(side) {           // side 0 = linkes Tor (Blau verteidigt), 1 = rechtes Tor
  const s = side === 0 ? -1 : 1, line = side === 0 ? L : R, back = line + s * GDEPTH, r = ball.r;
  const inMouth = ball.y > GT && ball.y < GB, behind = (ball.x - line) * s;
  if (inMouth && (ball.z < BAR || behind > 0) && !(ball.owner && ball.owner.holding)) {
    if (behind > 0) {                 // im Tor: Ball bremst im Netz ab, Seitennetze halten ihn
      ball.vx *= 0.9; ball.vy *= 0.9;
      if (ball.y < GT + r) { ball.y = GT + r; ball.vy = Math.abs(ball.vy) * 0.2; ball.vx *= 0.7; }
      if (ball.y > GB - r) { ball.y = GB - r; ball.vy = -Math.abs(ball.vy) * 0.2; ball.vx *= 0.7; }
    }
    if ((ball.x - back) * s > -r) {   // Ball zappelt im Netz
      ball.x = back - s * r;

      ball.vx = -ball.vx * 0.12; ball.vy *= 0.5; ball.vz = 0;
    }

    ball.x = line - s * r; ball.vx = -ball.vx * 0.6; ball.vz = Math.min(ball.vz, 0) - 1;
    hitWood('Latte!', line, ball.y);

    if (ball.vx * s > 4) sfx.board();

}
function hitWood(txt, x, y) { sfx.wood(); floatText(x - Math.sign(x - CX) * 40, y - 20, txt, '#ffe066'); shake = Math.max(shake, 6); }

// Ball trifft einen Spieler: annehmen, fangen, abwehren oder abprallen
function ballContacts() {
  if (ball.z > PLAYER_H) return false;            // fliegt über die Köpfe
  let best = null, bd = 1e9;
  for (const p of players) {
    if (p.noTouch > 0 || p.stun > 0) continue;
    const d = Math.hypot(ball.x - p.x, ball.y - p.y), reach = p.r + ball.r + (p.dive ? 9 : 3);
    if (d < reach && d < bd) { best = p; bd = d; }

  ball.lastTouch = p.team; ball.lastPlayer = p;
  if (p.slide > 0) {                               // Grätsche spitzelt den Ball weg
    ball.vx = p.fx * 7 + rand(-1, 1); ball.vy = p.fy * 7 + rand(-1, 1); ball.vz = 0;
    p.noTouch = 8; sfx.kick(0.3); return false;
  }
  if (p.role === 'gk' && inOwnBox(p)) {            // Torwart im Strafraum
    // Harter Schuss nur mit den Fingerspitzen erwischt: rutscht manchmal durch
    if (rel > 14 && d > p.r + ball.r && Math.random() > 0.35 + skill(p).gk * 0.6) {
      ball.vx *= 0.8; ball.vy += rand(-2.5, 2.5); p.noTouch = 20; sfx.catch();
      return false;
    }
    const pc = rel < 11 ? 1 : skill(p).gk * clamp(1 - (rel - 11) / 18, 0.15, 1);
    if (Math.random() < pc) {
      give(p); p.holding = true; p.fx = attackDir(p.team); p.fy = 0;   // nach dem Fangen Blick nach vorn
      if (rel > 11) { floatText(p.x, p.y - 28, 'Gehalten!', '#fff'); sfx.catch(); stats.saves = (stats.saves || 0) + 1; }
      return true;
    }
    const s = attackDir(p.team);                   // Faustabwehr
    ball.vx = s * (2 + Math.abs(ball.vx) * 0.35); ball.vy = (ball.y < p.y ? -1 : 1) * rand(3, 7); ball.vz = 3;
    p.noTouch = 18; floatText(p.x, p.y - 28, 'Parade!', '#ffe066'); sfx.punch(); sfx.ooh(); shake = Math.max(shake, 5);

}

// Zweikampf: Gegner am Ball versucht ihn zu erobern
function tackles() {
  const o = ball.owner;
  if (!o || o.holding) return;
  for (const q of players) {
    if (q.team === o.team || q.stun > 0) continue;
    const d = Math.hypot(ball.x - q.x, ball.y - q.y);
    if (q.slide > 0 && d < q.r + ball.r + 8) {    // Grätsche erwischt den Ball, Gegner fällt hin

      ball.lastTouch = q.team; ball.lastPlayer = q;
      o.stun = 40; o.noTouch = 45; o.charge = 0; q.noTouch = 6;
      sfx.punch(); burst(o.x, o.y, 10, ['#7fbf6a', '#5a3a1a'], 2.5, 25);

      const ch = isHumanCtrl(q) ? 0.12 : q.role === 'gk' ? 0.09 : skill(q).steal;   // Torwart geht beherzt dazwischen
      if (Math.random() < ch) { o.charge = 0; give(q); o.noTouch = 30; q.protect = 25; return; }

function scoreGoal(team) {
  if (state !== 'play' && state !== 'menu') return;
  score[team]++;
  ball.owner = null;
  if (state === 'menu') { setupKickoff(1 - team); return; }   // Demo im Menü: einfach weiter
  const lp = ball.lastPlayer, own = ball.lastTouch !== team;
  goalInfo = { team, own, scorer: lp, num: lp ? lp.num : 0 };
  state = 'goal'; stateT = 0;
  sfx.goal(); confetti(team); shake = 14; crowdJump[team] = 200;
}

// =====================================================================
//  KI
// =====================================================================
function chooseChasers() {
  for (const t of teams) {
    // Hält der Torwart den Ball, wird er nicht bedrängt
    if (t.human >= 0 || (ball.owner && (ball.owner.team === t.idx || ball.owner.holding))) { chaser[t.idx] = null; continue; }
    let best = null, bd = 1e9;
    for (const p of players) {
      if (p.team !== t.idx || p.role === 'gk' || p.stun > 0) continue;
      const d = dist(p, ball) - (p === chaser[t.idx] ? 35 : 0);   // nicht ständig wechseln
      if (d < bd) { bd = d; best = p; }
    }
    chaser[t.idx] = best;
  }
}
// Wo ist der Ball, wenn ich ihn erreiche?
function intercept(p, spd = 3.6) {
  let tx = ball.x, ty = ball.y;
  for (let i = 0; i < 3; i++) {
    const t = Math.min(60, Math.hypot(tx - p.x, ty - p.y) / spd), k = (1 - Math.pow(0.985, t)) / 0.015;
    tx = ball.x + ball.vx * k; ty = ball.y + ball.vy * k;

}
// Grundposition je nach Rolle, Ballposition und ob wir angreifen
function homePos(p, attacking) {
  const FORM = { gk: [0.02, 0], def: [0.2, 0], attT: [0.48, -0.45], attB: [0.48, 0.45] };
  const s = attackDir(p.team), fw = R - L, fh = (B - T) / 2;
  const prog = (ball.x - CX) * s / fw;
  let [fx, fy] = FORM[p.role];

  if (p.role === 'def') fx = Math.min(fx, attacking ? 0.5 : 0.38);

  return [ownGoalX(p.team) + s * fx * fw, MID + fy * fh + (ball.y - MID) * 0.22];
}
function supportPos(p) {
  let [x, y] = homePos(p, true);
  const o = ball.owner;
  if (o) {   // nicht zu nah an den Ballführer, damit man anspielbar ist
    const dx = x - o.x, dy = y - o.y, d = Math.hypot(dx, dy) || 1;
    if (d < 130) { x += dx / d * (130 - d) * 0.7; y += dy / d * (130 - d) * 0.7; }
  }
  for (const q of players) {   // freilaufen
    if (q.team === p.team) continue;
    const dx = x - q.x, dy = y - q.y, d = Math.hypot(dx, dy) || 1;
    if (d < 70) { x += dx / d * (70 - d); y += dy / d * (70 - d); }
  }

}

  const s = attackDir(p.team), gx = ownGoalX(p.team);

    return [x, MID + (ball.y - MID) * 0.55];
  }

    const dx = gx - q.x, dy = MID - q.y, d = Math.hypot(dx, dy) || 1;
    return [q.x + dx / d * 38, q.y + dy / d * 38];
  }

}
function fieldAI(p) {
  const sk = skill(p);
  if (ball.owner === p) return aiWithBall(p, sk);
  const mine = ball.owner && ball.owner.team === p.team;
  let tx, ty, spd = sk.speed;
  if (p.expect > 0 && !ball.owner) { [tx, ty] = intercept(p, spd); spd *= 1.05; }   // Pass kommt: entgegenlaufen
  else if (mine) [tx, ty] = supportPos(p);
  else if (chaser[p.team] === p) {
    if (ball.owner) {
      tx = ball.x; ty = ball.y;
      if (p.recover === 0 && dist(p, ball) < 46 && Math.random() < sk.slide) {

    } else [tx, ty] = intercept(p, spd);

}

  let near = 1e9;
  for (const q of players) if (q.team !== p.team) near = Math.min(near, dist(p, q));
  if (p.aiHold > sk.think) {
    // Schießen, wenn nah genug am Tor
    if (dG < sk.range && (gx - p.x) * s > 30 && Math.abs(p.y - MID) < 220 && Math.random() < 0.04 + 0.25 * (1 - dG / sk.range)) {
      const k = players.find(q => q.team !== p.team && q.role === 'gk');
      let aimY = k.y < MID - 8 ? GB - 18 : k.y > MID + 8 ? GT + 18 : (Math.random() < 0.5 ? GT + 18 : GB - 18);
      aimY += rand(-1, 1) * sk.aim;       // ins lange Eck, aber ungenau
      return shootAt(p, gx, aimY, clamp(0.35 + dG / 600, 0.45, sk.shot));
    }
    // Passen, wenn ein Gegner zu nah ist
    if (near < 55 && Math.random() < 0.08) {

      if (b && b.score > -0.5) return passBall(p, false, b.m);
    }
    // Ab und zu einen Steilpass spielen
    if (Math.random() < sk.pass) {

// Mitspieler, die man sicher anspielen kann (kein Gegner im Passweg oder direkt daneben)

  if (t.switchCd > 0) { t.switchCd--; return; }

    const d = dist(p, ball) - (p.expect > 0 ? 80 : 0);

// =====================================================================
//  MENSCH
// =====================================================================
// Mit Ball:  Schuss-Taste kurz tippen = Pass, gedrückt halten = Schuss (je länger, desto fester)

  steer(p, inp.ax, inp.ay, spd, 0.24, 0.35);

// Torwart mit Ball, vom Menschen gesteuert:
// Schuss-Taste kurz tippen = Abwurf zum nächsten Mitspieler in Blickrichtung

// =====================================================================
//  SIMULATION
// =====================================================================
function simulate(celebrating) {
  if (!celebrating) for (const t of teams) if (t.human >= 0) autoSwitch(t);
  chooseChasers();
  for (const p of players) {
    for (const k of ['noTouch', 'protect', 'recover', 'kickAnim', 'expect']) if (p[k] > 0) p[k]--;
    if (p.stun > 0) { p.stun--; if (!p.stun) p.recover = 10; p.vx *= 0.85; p.vy *= 0.85; integrate(p); continue; }
    if (p.slide > 0) { p.slide--; p.vx *= 0.93; p.vy *= 0.93; integrate(p); if (!p.slide) p.recover = 22; continue; }
    if (celebrating) { celebrate(p); continue; }
    const t = teams[p.team];
    if (t.human >= 0 && t.ctrl === p) (p.role === 'gk' ? keeperHuman : humanControl)(p, inputs[t.human]);
    else if (p.role === 'gk') keeperAI(p);
    else fieldAI(p);

  if (!celebrating) tackles();
  updateBall(!celebrating);

}

  const g = goalInfo, sc = g.own ? null : g.scorer;

    if (p === sc) moveTo(p, oppGoalX(p.team) - s * 70, sc.y < MID ? T + 40 : B - 40, 3.8);   // Jubellauf zur Ecke

  s[i++] = nets[0].y; s[i++] = nets[0].amt; s[i++] = nets[1].y; s[i++] = nets[1].amt;

function endMatch() {
  state = 'over'; stateT = 0;
  sfx.whistle(3, 0.28);
  const t = settings.mode === 1;
  const title = score[0] > score[1] ? (t ? 'Gewonnen! 🏆' : 'Blau gewinnt! 🏆') : (t ? 'Verloren, Revanche?' : 'Rot gewinnt! 🏆');
  document.getElementById('overTitle').textContent = title;
  document.getElementById('overScore').innerHTML = `<span style="color:#60a5fa">${score[0]}</span> : <span style="color:#f87171">${score[1]}</span>`;
  const tot = stats.poss[0] + stats.poss[1] || 1, pp = Math.round(stats.poss[0] / tot * 100);
  document.getElementById('overStats').innerHTML =
    `<div>${pp}%</div><div>Ballbesitz</div><div>${100 - pp}%</div>` +
    `<div>${stats.shots[0]}</div><div>Schüsse</div><div>${stats.shots[1]}</div>` +
    `<div>${stats.passes[0]}</div><div>Pässe</div><div>${stats.passes[1]}</div>`;
  document.getElementById('over').hidden = false;
  if (score[0] > score[1] || settings.mode === 2) { confetti(score[0] > score[1] ? 0 : 1); crowdJump[score[0] > score[1] ? 0 : 1] = 400; }
}

// ---------- Hauptschritt: läuft genau 60-mal pro Sekunde ----------
function step() {
  frame++; stateT++;
  inputs = [readInput(0), readInput(1)];
  if (inputs[0].start && state === 'play' && stateT > 20) togglePause();

  if (state === 'menu') simulate(false);
  else if (state === 'kickoff') {
    if (stateT > 80) { state = 'play'; stateT = 0; sfx.whistle(); }
  } else if (state === 'play') {
    simulate(false); record();
    if (clock > 0 && --clock === 0) {
      if (score[0] !== score[1]) endMatch();
      else { golden = true; sfx.whistle(2, 0.2); floatText(W / 2, MID - 120, 'GOLDEN GOAL!', '#ffd43b', true); }
    }
  } else if (state === 'goal') {
    simulate(true);
    if (stateT < 45) record();
    const skip = stateT > 40 && (inputs[0].shootP || inputs[1].shootP || latch.Enter);
    if (stateT > 170 || skip) {
      if (golden) endMatch();
      else { state = 'replay'; stateT = 0; replayStart = Math.max(0, rec.length - 200); replayPos = replayStart; }
    }
  } else if (state === 'replay') {
    replayPos += 0.5;
    const skip = stateT > 10 && (inputs[0].shootP || inputs[1].shootP || latch.Enter);
    if (replayPos >= rec.length - 1 || skip) beginKickoff(1 - goalInfo.team);
  }
  updateEffects();
  for (const k in latch) delete latch[k];
}

// =====================================================================
//  EFFEKTE
// =====================================================================
function burst(x, y, n, colors, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(0.3, 1) * spd;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, color: pick(colors), size: rand(1.5, 3), kind: 'bit' });
  }
}
function confetti(team) {
  const cols = [...TEAM[team].fans, '#ffd43b', '#ffffff'];
  for (let i = 0; i < 170; i++) particles.push({ x: rand(0, W), y: rand(-160, -5), vx: rand(-1, 1), vy: rand(1.4, 3.4), life: rand(200, 320), max: 320,
    color: pick(cols), size: rand(3, 7), rot: rand(0, TAU), vr: rand(-0.2, 0.2), kind: 'conf' });
}
function floatText(x, y, text, color, screen) { floats.push({ x, y, text, color, life: 70, screen: !!screen }); }
function updateEffects() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.kind === 'conf') { p.vx += Math.sin(p.life * 0.08) * 0.04; p.rot += p.vr; } else { p.vx *= 0.92; p.vy *= 0.92; }
  }
  particles = particles.filter(p => p.life > 0 && p.y < H + 20);
  for (const f of floats) { f.y -= 0.5; f.life--; }
  floats = floats.filter(f => f.life > 0);
  shake *= 0.88;
  crowdJump = crowdJump.map(v => Math.max(0, v - 1));
  for (const n of nets) n.amt *= 0.9;
  if (ball && !ball.owner && Math.hypot(ball.vx, ball.vy) > 11 && ball.z < 30) trail.push({ x: ball.x, y: ball.y - ball.z * 0.75 });
  else if (trail.length) trail.shift();
  if (trail.length > 9) trail.shift();
  // Zuschauer werden lauter, wenn es vor einem Tor gefährlich wird
  if (frame % 10 === 0 && ball) {
    const near = Math.min(Math.abs(ball.x - L), Math.abs(ball.x - R));
    setCrowd(state === 'menu' || state === 'over' ? 0 : state === 'goal' ? 0.22 : 0.035 + 0.09 * Math.max(0, 1 - near / 330));
  }
}

  bg.font = 'bold 8px system-ui, sans-serif'; bg.textAlign = 'center'; bg.textBaseline = 'middle';
  const board = (x, y, w, h, i, vert) => {
    const [txt, c1, c2] = ads[i % ads.length];
    bg.fillStyle = c1; bg.fillRect(x, y, w, h); bg.fillStyle = 'rgba(255,255,255,.15)'; bg.fillRect(x, y, w, 1.5);
    bg.fillStyle = c2; bg.save(); bg.translate(x + w / 2, y + h / 2); if (vert) bg.rotate(vert * Math.PI / 2); bg.fillText(txt, 0, 0.5); bg.restore();
  };
  const segW = (R - L + 16) / 8;
  for (let i = 0; i < 8; i++) { board(L - 8 + i * segW, T - 9, segW - 1, 8, i); board(L - 8 + i * segW, B + 1, segW - 1, 8, i + 2); }
  const segH = (GT - 12 - (T - 9)) / 2;
  for (let i = 0; i < 2; i++) for (const [y0, k] of [[T - 9, 0], [GB + 12, 2]]) {
    board(L - 9, y0 + i * segH, 8, segH - 1, i + k, -1); board(R + 1, y0 + i * segH, 8, segH - 1, i + k + 1, 1);
  }
  // Eckfahnen
  for (const [x, y] of [[L, T], [R, T], [L, B], [R, B]]) { bg.fillStyle = '#ffd43b'; bg.beginPath(); bg.moveTo(x, y); bg.lineTo(x + (x < CX ? 9 : -9), y + (y < MID ? 4 : -4)); bg.lineTo(x, y + (y < MID ? 8 : -8)); bg.fill(); }

  // Fans: links die Blauen, rechts die Roten
  for (const k of [0, 1]) {
    const g = fanCanvas[k][1], cols = TEAM[k].fans;
    const fan = (x, y) => {
      if ((x < CX) !== (k === 0)) return;
      if (x > W / 2 - 190 && x < W / 2 + 190 && y < 74) return;   // Platz für die Anzeigetafel
      g.fillStyle = Math.random() < 0.75 ? pick(cols) : pick(['#e5e7eb', '#374151', '#facc15', '#9ca3af']);
      g.beginPath(); g.arc(x, y + 1.5, 3.8, 0, TAU); g.fill();
      g.fillStyle = pick(SKIN); g.beginPath(); g.arc(x, y - 1, 2.4, 0, TAU); g.fill();
    };
    for (let y = 7; y < T - 14; y += 9.5) for (let x = 6 + (y % 2) * 4; x < W - 4; x += 9) if (Math.random() < 0.88) fan(x + rand(-1, 1), y);
    for (let y = B + 16; y < H - 3; y += 9.5) for (let x = 6; x < W - 4; x += 9) if (Math.random() < 0.88) fan(x + rand(-1, 1), y);
    for (let x = 7; x < L - 26; x += 9.5) for (let y = T - 4; y < B + 6; y += 9) {
      if (y > GT - 18 && y < GB + 18 && x > L - GDEPTH - 20) continue;
      if (Math.random() < 0.88) { fan(x, y); fan(W - x, y); }
    }
  }
}

function drawGoalFloor(side) {
  const s = side === 0 ? -1 : 1, line = side === 0 ? L : R;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(Math.min(line, line + s * GDEPTH), GT, GDEPTH, GOAL_W);
}
// Netz und Latte werden ÜBER Ball und Spieler gezeichnet, so sieht man den Ball "im" Netz
function drawGoalTop(side, net) {
  const s = side === 0 ? -1 : 1, line = side === 0 ? L : R, back = line + s * GDEPTH;
  const bulge = (y, f) => net.amt * f * Math.exp(-((y - net.y) ** 2) / 900);
  ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = 1;
  for (let i = 1; i <= 5; i++) {
    const f = i / 5, x0 = line + s * GDEPTH * f;
    ctx.beginPath();
    for (let y = GT; y <= GB; y += 6) { const x = x0 + s * bulge(y, f); y === GT ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  for (let y = GT + 9; y < GB; y += 9) { ctx.beginPath(); ctx.moveTo(line, y); ctx.lineTo(back + s * bulge(y, 1), y); ctx.stroke(); }
  // Rahmen hinten
  ctx.strokeStyle = 'rgba(230,230,230,.9)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(line, GT); ctx.lineTo(back, GT); ctx.lineTo(back, GB); ctx.lineTo(line, GB); ctx.stroke();
  // Schatten der Latte und Latte
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(line + 5, GT + 7); ctx.lineTo(line + 5, GB + 7); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(line, GT); ctx.lineTo(line, GB); ctx.stroke();
  ctx.fillStyle = '#fff';
  for (const y of [GT, GB]) { ctx.beginPath(); ctx.arc(line, y, POST_R + 1, 0, TAU); ctx.fill(); }
}

function drawBall(b) {
  const z = b.z, sc = 1 + z / 70, r = b.r * sc, bx = b.x, by = b.y - z * 0.75;
  ctx.fillStyle = `rgba(0,0,0,${Math.max(0.1, 0.32 - z / 260)})`;
  ctx.beginPath(); ctx.ellipse(b.x + 2 + z * 0.15, b.y + 3, b.r * (1 - Math.min(0.35, z / 160)), b.r * 0.8 * (1 - Math.min(0.35, z / 160)), 0, 0, TAU); ctx.fill();
  const g = ctx.createRadialGradient(bx - r * 0.35, by - r * 0.35, r * 0.1, bx, by, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9d1dc');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
  // Flecken drehen sich in Rollrichtung
  ctx.save(); ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#1f2937';
  for (let k = 0; k < 3; k++) {
    const ph = b.rot + k * TAU / 3, depth = Math.cos(ph);
    if (depth < -0.1) continue;
    const along = Math.sin(ph) * r * 0.75, side = (k - 1) * r * 0.5;
    ctx.beginPath(); ctx.arc(bx + b.ux * along - b.uy * side, by + b.uy * along + b.ux * side, r * 0.3 * (0.55 + 0.45 * depth), 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.stroke();
}

function drawPlayer(p) {
  const st = TEAM[p.team], gk = p.role === 'gk', r = p.r;
  const shirt = gk ? st.gk : st.shirt, dark = gk ? st.gkDark : st.dark;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(3, 5, r * 1.05, r * 0.85, 0, 0, TAU); ctx.fill();
  ctx.rotate(Math.atan2(p.fy, p.fx));
  if (p.stun > 0) {   // liegt nach einer Grätsche am Boden
    ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.ellipse(-r * 1.2, -4, 4, 3, 0, 0, TAU); ctx.ellipse(-r * 1.2, 4, 4, 3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = shirt; ctx.beginPath(); ctx.ellipse(-2, 0, r * 0.95, r * 0.6, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(r * 0.8, 0, r * 0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = p.hair; ctx.beginPath(); ctx.arc(r * 0.72, 0, r * 0.34, 0, TAU); ctx.fill();
    ctx.restore();
    for (let i = 0; i < 3; i++) {   // Sternchen
      const a = frame * 0.12 + i * TAU / 3;
      ctx.fillStyle = '#ffd43b'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('★', p.x + Math.cos(a) * 13, p.y - 16 + Math.sin(a) * 5);
    }
    return;
  }
  const sw = Math.sin(p.anim) * 6;
  ctx.fillStyle = '#111827';   // Schuhe
  if (p.slide > 0) {
    ctx.beginPath(); ctx.ellipse(r + 7, 4, 7, 3.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-3, -6, 5, 3, 0, 0, TAU); ctx.fill();
  } else {
    const kick = p.kickAnim > 0 ? p.kickAnim : 0;
    ctx.beginPath(); ctx.ellipse(sw + 2 + kick, 5.5, 5, 3.2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-sw + 2, -5.5, 5, 3.2, 0, 0, TAU); ctx.fill();
  }
  // Arme (Torwart beim Hechtsprung: Arme nach vorn)
  const armX = p.dive ? r * 0.7 : -sw * 0.5, armY = p.dive ? r * 0.7 : r * 0.95;
  ctx.fillStyle = shirt;
  ctx.beginPath(); ctx.arc(armX, -armY, 4.2, 0, TAU); ctx.arc(armX, armY, 4.2, 0, TAU); ctx.fill();
  ctx.fillStyle = gk ? '#f8fafc' : p.skin;
  const hr = gk ? 3.6 : 2.6, hx = armX + (p.dive ? 6 : 3);
  ctx.beginPath(); ctx.arc(hx, -armY - 1, hr, 0, TAU); ctx.arc(hx, armY + 1, hr, 0, TAU); ctx.fill();
  // Körper mit Trikotstreifen
  ctx.fillStyle = shirt; ctx.beginPath(); ctx.ellipse(p.slide > 0 ? -3 : 0, 0, r * 0.62, r * 0.95, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = gk ? 'rgba(0,0,0,.18)' : st.light;
  ctx.fillRect(-r * 0.62, -2, r * 1.24, 4);
  // Kopf: Haare hinten, Gesicht vorne
  ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(1.8, 0, r * 0.43, 0, TAU); ctx.fill();
  ctx.fillStyle = p.hair; ctx.beginPath(); ctx.arc(-0.6, 0, r * 0.38, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawMarker(p, label, color) {
  const bob = Math.sin(frame * 0.15) * 2;
  ctx.strokeStyle = color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 3, p.r + 5, p.r + 3, 0, 0, TAU); ctx.stroke();
  const y = p.y - p.r - 14 + bob;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(p.x - 6, y - 4); ctx.lineTo(p.x + 6, y - 4); ctx.lineTo(p.x, y + 3); ctx.fill();
  ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3; ctx.strokeText(label, p.x, y - 7); ctx.fillText(label, p.x, y - 7);
}
// Torwart am Ball: zeigt, wer den Abwurf (weiß) und wer den weiten Abschlag (gelb) bekommt
function drawKeeperAim(p) {
  const long = p.charge >= 10 || (p.charge > 0 && p.chargeLob);
  for (const [isLong, col] of [[false, 'rgba(255,255,255,.85)'], [true, 'rgba(255,212,59,.9)']]) {
    const m = keeperTarget(p, isLong);
    const active = isLong === long;
    ctx.globalAlpha = active ? 1 : 0.35;
    ctx.strokeStyle = col; ctx.lineWidth = active ? 3 : 2; ctx.setLineDash([8, 7]); ctx.lineDashOffset = -frame;
    const ex = m ? m.x : p.x + p.fx * (isLong ? 300 : 120), ey = m ? m.y : p.y + p.fy * (isLong ? 300 : 120);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    if (isLong) ctx.quadraticCurveTo((p.x + ex) / 2, (p.y + ey) / 2 - 50, ex, ey); else ctx.lineTo(ex, ey);
    ctx.stroke(); ctx.setLineDash([]);
    if (m) { ctx.beginPath(); ctx.ellipse(m.x, m.y + 3, m.r + 7, m.r + 5, 0, 0, TAU); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}
function drawAim(p) {
  const pw = p.charge < 10 ? 0 : Math.min(1, (p.charge - 10) / 40);
  const [dx, dy] = aimDir(p, p.chargeLob);
  const len = 40 + pw * 170, col = p.chargeLob ? `hsl(${195 + pw * 40},90%,65%)` : `hsl(${120 - pw * 120},90%,55%)`;
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.setLineDash([8, 7]); ctx.lineDashOffset = -frame;
  const sx = p.x + dx * 22, sy = p.y + dy * 22, ex = p.x + dx * len, ey = p.y + dy * len;
  ctx.beginPath(); ctx.moveTo(sx, sy);
  if (p.chargeLob) ctx.quadraticCurveTo((sx + ex) / 2, (sy + ey) / 2 - 30 - pw * 40, ex, ey); else ctx.lineTo(ex, ey);
  ctx.stroke(); ctx.setLineDash([]);
  // Kraftbalken unter dem Spieler
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(p.x - 22, p.y + p.r + 9, 44, 7);
  ctx.fillStyle = col; ctx.fillRect(p.x - 22, p.y + p.r + 9, 44 * Math.max(0.06, pw), 7);
}

function drawHUD() {
  const w = 360, x = W / 2 - w / 2, y = 10;
  ctx.fillStyle = 'rgba(6,14,30,.88)'; ctx.beginPath(); ctx.roundRect(x, y, w, 46, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(96,165,250,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = TEAM[0].shirt; ctx.beginPath(); ctx.roundRect(x + 6, y + 6, 104, 34, 7); ctx.fill();
  ctx.fillStyle = TEAM[1].shirt; ctx.beginPath(); ctx.roundRect(x + w - 110, y + 6, 104, 34, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px system-ui';
  const tag = i => state === 'menu' ? 'KI' : teams[i] && teams[i].human >= 0 ? 'P' + (teams[i].human + 1) : 'KI';
  ctx.fillText(`BLAU · ${tag(0)}`, x + 58, y + 24); ctx.fillText(`ROT · ${tag(1)}`, x + w - 58, y + 24);
  ctx.font = 'bold 30px system-ui'; ctx.fillText(`${score[0]} : ${score[1]}`, W / 2, y + 25);
  if (state !== 'menu') {   // Uhr
    const txt = golden ? 'GOLDEN GOAL' : `${Math.floor(Math.ceil(clock / 60) / 60)}:${String(Math.ceil(clock / 60) % 60).padStart(2, '0')}`;
    const cw = golden ? 130 : 70;
    ctx.fillStyle = golden ? '#f59e0b' : 'rgba(6,14,30,.88)'; ctx.beginPath(); ctx.roundRect(W / 2 - cw / 2, y + 44, cw, 22, 6); ctx.fill();
    ctx.fillStyle = golden ? '#1f1300' : (clock < 600 && frame % 60 < 30 ? '#fca5a5' : '#fff'); ctx.font = 'bold 15px system-ui';
    ctx.fillText(txt, W / 2, y + 56);
  }
}
function bigText(txt, y, size, color, scale = 1, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(W / 2, y); ctx.scale(scale, scale);
  ctx.font = `900 ${size}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = size / 6; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = color; ctx.fillText(txt, 0, 0); ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const replay = state === 'replay';
  const view = replay ? replayView() : { players, ball, nets };
  ctx.save();
  if (shake > 0.5 && !replay) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  for (const k of [0, 1]) ctx.drawImage(fanCanvas[k][0], 0, crowdJump[k] > 0 ? -Math.abs(Math.sin(frame * 0.28 + k)) * 4 : 0, W, H);
  drawGoalFloor(0); drawGoalFloor(1);

  // Ballspur bei harten Schüssen
  if (!replay && trail.length > 1) {
    for (let i = 1; i < trail.length; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${i / trail.length * 0.35})`; ctx.lineWidth = BALL_R * 1.6 * i / trail.length; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
  }
  const b = view.ball, high = b.z > PLAYER_H;
  // Markierung unter dem gesteuerten Spieler
  const live = !replay && state !== 'menu';
  if (live) for (const t of teams) if (t.human >= 0 && t.ctrl) drawMarker(t.ctrl, 'P' + (t.human + 1), t.idx === 0 ? '#93c5fd' : '#fca5a5');
  if (!high) drawBall(b);
  [...view.players].sort((a, c) => a.y - c.y).forEach(drawPlayer);
  if (b.owner && b.owner.holding) drawBall(b);   // Ball in den Torwarthänden
  drawGoalTop(0, view.nets[0]); drawGoalTop(1, view.nets[1]);
  if (high) drawBall(b);
  if (live && state === 'play') for (const t of teams) {
    if (t.human < 0 || !t.ctrl) continue;
    if (t.ctrl.role === 'gk' && ball.owner === t.ctrl) drawKeeperAim(t.ctrl);
    else if (t.ctrl.charge > 0) drawAim(t.ctrl);
  }
  for (const f of floats) if (!f.screen) bigTextAt(f);
  for (const p of particles) if (p.kind === 'bit') { ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Konfetti, Anzeigetafel, große Texte
  for (const p of particles) if (p.kind === 'conf') {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life / 60);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
  }
  drawHUD();
  for (const f of floats) if (f.screen) bigTextAt(f);

  if (state === 'kickoff') {
    const who = TEAM[kickTeam].name;
    bigText(`Anstoß ${who}`, MID - 150, 40, kickTeam === 0 ? '#93c5fd' : '#fca5a5', 1, Math.min(1, stateT / 10));
  }
  if (state === 'goal') {
    const t = stateT, sc = t < 12 ? 0.4 + t / 12 * 0.8 : 1.2 - Math.min(0.2, (t - 12) / 40);
    bigText(golden ? 'GOLDEN GOAL!' : 'TOOOR!', MID - 60, 96, '#ffd43b', sc);
    const g = goalInfo;
    const sub = g.own ? `Eigentor! Punkt für ${TEAM[g.team].name}` : `${TEAM[g.team].name} trifft, Nr. ${g.num}!`;
    if (t > 14) bigText(sub, MID + 10, 30, g.team === 0 ? '#bfdbfe' : '#fecaca', 1, Math.min(1, (t - 14) / 10));
  }
  if (replay) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, 34); ctx.fillRect(0, H - 34, W, 34);
    ctx.fillStyle = frame % 50 < 25 ? '#ef4444' : '#7f1d1d'; ctx.beginPath(); ctx.arc(28, 17, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 17px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('WIEDERHOLUNG', 44, 18);
    ctx.textAlign = 'right'; ctx.font = '14px system-ui'; ctx.fillText('Schuss-Taste: überspringen', W - 18, H - 17);
  }
}
function bigTextAt(f) {
  ctx.save(); ctx.globalAlpha = Math.min(1, f.life / 20);
  ctx.font = `900 ${f.screen ? 30 : 20}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 4; ctx.strokeText(f.text, f.x, f.y);
  ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.restore();
}

const $ = id => document.getElementById(id);
function hideOverlays() { for (const id of ['menu', 'pause', 'over']) $(id).hidden = true; }
function showMenu() { hideOverlays(); $('menu').hidden = false; startDemo(); renderMenu(); updateInfo(); }
function togglePause() {
  if (state === 'pause') { state = pausedFrom; $('pause').hidden = true; }
  else if (['play', 'kickoff', 'goal', 'replay'].includes(state)) { pausedFrom = state; state = 'pause'; $('pause').hidden = false; }
}
function renderMenu() {
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', String(settings[seg.dataset.key]) === b.dataset.v)));
  $('optLevel').style.opacity = settings.mode === 1 ? 1 : 0.35;
  const k = s => s.split(' ').map(x => `<kbd>${x}</kbd>`).join(' ');
  const rows = settings.mode === 1
    ? [['Laufen', k('W A S D') + ' oder Pfeile'], ['Pass (kurz tippen)', k('Leertaste')], ['Schuss (halten, loslassen)', k('Leertaste')],
       ['Flanke / Heber', k('E')], ['Spieler wechseln (ohne Ball)', k('E')], ['Grätsche (ohne Ball)', k('Leertaste')],
       ['Torwart: kurzer Abwurf / weiter Abschlag', k('Leertaste') + ' tippen / halten']]
    : [['Laufen', k('W A S D'), 'Pfeiltasten'], ['Pass (kurz tippen)', k('Leertaste'), k('Enter')], ['Schuss (halten)', k('Leertaste'), k('Enter')],
       ['Flanke / Heber', k('E'), 'Shift rechts'], ['Spieler wechseln (ohne Ball)', k('E'), 'Shift rechts'],
       ['Grätsche (ohne Ball)', k('Leertaste'), k('Enter')], ['Torwart: Abwurf / Abschlag', 'tippen / halten', 'tippen / halten']];
  $('ctrlTable').innerHTML = (settings.mode === 1 ? '<tr><th></th><th>Du spielst Blau</th></tr>' : '<tr><th></th><th>Spieler 1 (Blau)</th><th>Spieler 2 (Rot)</th></tr>')
    + rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v; settings[seg.dataset.key] = isNaN(v) ? v : Number(v);
  try { localStorage.setItem('arena-settings', JSON.stringify(settings)); } catch (err) {}
  b.blur(); renderMenu();
}));
$('start').onclick = startMatch;
$('again').onclick = startMatch;
$('toMenu').onclick = showMenu;
$('resume').onclick = togglePause;
$('quit').onclick = showMenu;
function updateInfo() {
  $('info').innerHTML = state === 'menu'
    ? 'Wähle oben deine Einstellungen. Im Hintergrund spielt die KI gegen sich selbst.'
    : settings.mode === 1
      ? '<b>Leertaste</b> tippen = Pass · halten = Schuss · ohne Ball = Grätsche · <b>E</b> = Flanke/Heber · ohne Ball = Spieler wechseln · <b>P</b> Pause · <b>M</b> Ton'
      : 'Blau: <b>WASD</b> + <b>Leertaste</b> / <b>E</b> · Rot: <b>Pfeile</b> + <b>Enter</b> / <b>Shift rechts</b> · <b>P</b> Pause · <b>M</b> Ton';
}

// =====================================================================
//  START: feste 60 Schritte pro Sekunde, egal wie schnell der Bildschirm ist
// =====================================================================
renderStatic();
showMenu();
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { if (state !== 'pause' && state !== 'over') step(); else { stateT++; frame++; updateEffects(); } acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
